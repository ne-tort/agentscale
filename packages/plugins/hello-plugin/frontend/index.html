<!doctype html>
<html lang="ru"
      data-plugin-id="hello_plugin"
      data-plugin-version="0.1.0"
      data-host-origin="">
<head>
  <meta charset="utf-8" />
  <!--
    data-host-origin — canonical exact HTTPS origin, если он задан в signed source.
    Пустой атрибут использует только bounded server-derived iframe.name handoff;
    missing/invalid handoff = fail-closed. Signed HTML после подписи не мутируется.

    Meta CSP ограничивает ресурсы и сеть, но frame-ancestors в meta НЕ работает и
    не является защитой от встраивания. Static origin ОБЯЗАН отдавать HTTP header:
      Content-Security-Policy: default-src 'none'; script-src 'self';
        style-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none';
        form-action 'none'; frame-ancestors https://<configured-shell-origin>
    (одной строкой, с фактическим origin среды). HTTP frame-ancestors обязателен;
    ниже в meta эта директива намеренно отсутствует, чтобы не создавать ложную
    уверенность. Sandbox/credentialless/referrerpolicy задаёт host на iframe.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Hello Plugin</title>
</head>
<body>
  <main>
    <h1>Hello Plugin</h1>
    <p id="state">Ожидание handshake с хостом…</p>
    <button id="greet" type="button" disabled>Поздороваться</button>
    <button id="refresh" type="button" disabled>Обновить список</button>
    <h2>Приветствия</h2>
    <ul id="greetings" aria-live="polite"></ul>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
