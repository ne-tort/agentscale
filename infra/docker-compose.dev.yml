services:
  postgres:
    image: postgres:16
    container_name: prodavan-postgres
    environment:
      POSTGRES_USER: prodavan
      POSTGRES_PASSWORD: prodavan
      POSTGRES_DB: prodavan
    ports:
      - "5432:5432"
    volumes:
      - prodavan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodavan -d prodavan"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: prodavan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prodavan
      MINIO_ROOT_PASSWORD: prodavan123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prodavan_minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: prodavan-redis
    ports:
      - "6379:6379"
    volumes:
      - prodavan_redis_data:/data

  # Kafka-compatible broker for P0 C-EVENT-BUS (local). API: KAFKA_BOOTSTRAP_SERVERS=localhost:19092
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: prodavan-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - prodavan_redpanda_data:/var/lib/redpanda/data

volumes:
  prodavan_pg_data:
  prodavan_minio_data:
  prodavan_redis_data:
  prodavan_redpanda_data:
