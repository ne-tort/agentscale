services:
  postgres:
    image: postgres:16.15
    container_name: prodavan-postgres
    environment:
      POSTGRES_USER: prodavan
      POSTGRES_PASSWORD: prodavan
      POSTGRES_DB: prodavan
    ports:
      - "5432:5432"
    volumes:
      - prodavan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodavan -d prodavan"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: prodavan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prodavan
      MINIO_ROOT_PASSWORD: prodavan123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prodavan_minio_data:/data

  redis:
    image: redis:7.4.11-alpine
    container_name: prodavan-redis
    ports:
      - "6379:6379"
    volumes:
      - prodavan_redis_data:/data

  # Kafka-compatible broker for P0 C-EVENT-BUS (local). API: KAFKA_BOOTSTRAP_SERVERS=localhost:19092
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: prodavan-redpanda
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -eu
        cp /config/redpanda.yaml /etc/redpanda/redpanda.yaml
        export LD_LIBRARY_PATH="/opt/redpanda/lib"
        export PATH="/opt/redpanda/bin:${PATH}"
        exec /opt/redpanda/libexec/redpanda \
          --redpanda-cfg /etc/redpanda/redpanda.yaml \
          --memory=1G \
          --lock-memory=false \
          --unsafe-bypass-fsync=false \
          --reserve-memory=0M \
          --smp=1 \
          --overprovisioned \
          --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - ./redpanda/compose.yaml:/config/redpanda.yaml:ro
      - prodavan_redpanda_data:/var/lib/redpanda/data

volumes:
  prodavan_pg_data:
  prodavan_minio_data:
  prodavan_redis_data:
  prodavan_redpanda_data:
