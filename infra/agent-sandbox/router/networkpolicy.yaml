# NetworkPolicy for the Go sandbox-router. Vendored from
# agent-sandbox/sandbox-router/deploy/networkpolicy.yaml.
# Prodavan deltas vs upstream example:
#   - Ingress :8080 only from namespace `prodavan` (upstream: any namespace) —
#     only the prodavan API dials the router.
#   - Egress to sandbox pods: TCP 3921 (agent-runtime HTTP port) instead of the
#     upstream example's 8888 — without this every dial to a sandbox 502s.
#   - Egress OTel rule kept broad (tracing not enabled yet — tighten when it is).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: sandbox-router
  policyTypes: ["Ingress", "Egress"]
  ingress:
  # Proxy traffic — only the prodavan API (namespace prodavan) dials the router.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prodavan
    ports:
    - protocol: TCP
      port: 8080
  # Metrics scrape — restrict to your monitoring namespace.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Kubelet probes hit the pod IP directly; allow all.
  - ports:
    - protocol: TCP
      port: 8081
  egress:
  # DNS for resolving sandbox FQDNs.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Forwarding to sandbox pods (agent-runtime) on the Prodavan sandbox port.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prodavan-sandboxes
    ports:
    - protocol: TCP
      port: 3921
  # OTel collector (if --enable-tracing or --enable-otel-metrics). Tighten
  # to the collector's namespace/pod selector when tracing is enabled.
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 4317
  # Kubernetes API server — required with --cache-enabled (the cache informer
  # LIST/WATCHes sandbox-owned Pods). The apiserver lives at the cluster-wide
  # kubernetes service; NetworkPolicy can't name it directly, so we allow
  # egress to the default namespace on the standard API ports.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  # Kubernetes API server — actual datapath (F1). kube-router DNATs the
  # `kubernetes` Service (10.43.0.1:443) to the node IP :6443, and on the WSL
  # k3s dev cluster the node IP lives in the host subnet 172.16.0.0/12 and
  # drifts whenever the distro is recreated, so:
  #   - namespaceSelector/podSelector cannot match it: the apiserver is a host
  #     process, not a pod. The `default`-namespace rule above selects zero
  #     pods and kube-router never materializes a rule whose ipsets are empty
  #     (silent no-op, kept as-is for upstream parity) — this is what starved
  #     the router's pod cache informer.
  #   - pinning the node IP as /32 would break on every IP drift.
  # A subnet-wide ipBlock with the cluster pod/service CIDRs excepted is the
  # only selector that covers the apiserver and survives IP drift — same style
  # as the public-internet rule in
  # infra/k3s/base/prodavan-sandboxes-ks/networkpolicy.yaml.
  - to:
    - ipBlock:
        cidr: 172.16.0.0/12
        except:
        - 10.42.0.0/16 # pods
        - 10.43.0.0/16 # services
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
