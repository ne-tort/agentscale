apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# sandbox-router (Go) — proxy to sandbox Pods via X-Sandbox-* headers.
# Vendored from agent-sandbox/sandbox-router/deploy/, patched for Prodavan:
#   - NetworkPolicy egress to sandboxes: 3921 (agent-runtime port), not 8888
#   - NetworkPolicy ingress on 8080: only from namespace prodavan
#   - replicas: 2 (upstream default, kept explicit)
#   - --cache-enabled=true (Pod-IP fast path; requires rbac.yaml ClusterRole)
# authz-mode stays upstream default (allow-all) — router is internal-only,
# no Ingress route; tokenreview/scoped-token is a later iteration.
resources:
  - rbac.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml

namespace: agent-sandbox-system

patches:
  # Explicit HA: 2 replicas (upstream example already sets this; pinned here
  # so drift is visible in review).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sandbox-router
        namespace: agent-sandbox-system
      spec:
        replicas: 2
  # NOTE: no args patch here — a strategic-merge patch REPLACES the whole
  # container args list (scalar lists are not merged), which silently dropped
  # --http-bind-address / --proxy-timeout / --upstream-max-retries from the
  # rendered Deployment. All flags — including --cache-enabled=true (Pod-IP
  # fast path for the k8s-agent-sandbox SDK flow, MIGRATION-DECISIONS §1.7;
  # needs the ClusterRole in rbac.yaml) — live in deployment.yaml as the
  # single source of truth.
