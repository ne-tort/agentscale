# Declarative k3d cluster for prodavan-dev (Kali dockerd).
# Create once: k3d cluster create --config infra/k3d/prodavan-dev.yaml
# Reboot: containers use restartPolicy unless-stopped — no recover scripts.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: prodavan-dev
servers: 1
agents: 0
image: rancher/k3s:v1.29.5-k3s1
ports:
  - port: 8088:80
    nodeFilters:
      - loadbalancer
  - port: 6443:6443
    nodeFilters:
      - server:*:0
options:
  k3d:
    wait: true
    timeout: "120s"
    disableLoadbalancer: false
  k3s:
    extraArgs:
      - arg: --tls-san=127.0.0.1
        nodeFilters:
          - server:*
      - arg: --tls-san=host.docker.internal
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
registries:
  config: |
    mirrors:
      "ghcr.io":
        endpoint:
          - "https://ghcr.io"
    configs:
      "ghcr.io":
        auth:
          username: ""
          password: ""
