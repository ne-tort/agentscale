# DEV-host root app (gitops-bootstrap.sh, GITOPS_APPS != prod).
# Apply once after Argo install (not synced by itself to avoid recursion):
#   kubectl apply -f infra/argocd/root-app.yaml
#
# Syncs the DEV contour only: AppProjects, agent-sandbox (platform),
# agentscale-dev. agentscale-prod.yaml and agentscale-e2e.yaml are EXCLUDED.
#
# Why e2e is excluded: nothing ever syncs it. `prodavan-ops e2e run` applies
# `infra/k3s/overlays/e2e` itself with `kubectl apply -k` (see e2e.py), so the
# Application existed only to sit OutOfSync/Missing forever — a permanently
# unhealthy child under agentscale-root, which is exactly the signal an
# operator reads to tell "a real app broke" from "a real app did not". Apply it
# by hand (`kubectl apply -f infra/argocd/apps/agentscale-e2e.yaml`) when an
# Argo-driven e2e run is actually wanted.
#
# prod: dev bootstrap must never create/sync the prod Application (policy: prod
# only on explicit demand); the prod contour is deployed solely by
# root-app-prod.yaml on a dedicated prod host (terraform gitops_apps=prod).
# NOTE: apps/ must stay a PLAIN directory (no kustomization.yaml) — Argo then
# honours spec.source.directory.exclude (single glob, gobwas syntax).
# NOTE: this Application is NOT in that directory, so Argo never reconciles
# this file against the live object. Editing it changes the *next* bootstrap
# (gitops-bootstrap.sh applies it with `kubectl apply`); a running cluster keeps
# whatever spec it was bootstrapped with unless someone re-applies the file.
# WARNING: re-applying this file on a cluster where agentscale-prod was
# previously synced by an unfiltered root app will PRUNE that Application
# (automated.prune) and cascade-delete prod workloads. On a cold install
# (the only supported flow) nothing is pruned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentscale-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ne-tort/agentscale.git
    targetRevision: main
    path: infra/argocd/apps
    directory:
      # gobwas/glob alternation — one pattern, two exclusions.
      exclude: '{agentscale-prod.yaml,agentscale-e2e.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Cold start: a transient API/git hiccup while creating child Applications
    # must not stall app-of-apps until the next periodic requeue — retry like
    # the child apps do.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
