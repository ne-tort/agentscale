# agent-sandbox platform (controller + extensions CRDs + sandbox-router).
# Source is vendored manifests under infra/agent-sandbox/ — no runtime fetch
# from upstream (MIGRATION-DECISIONS §1.1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-sandbox
  namespace: argocd
  annotations:
    # app-of-apps ordering: the platform (CRDs + controller + router) must be
    # created BEFORE agentscale-dev/e2e (wave 0) — the *-sandboxes layer ships
    # SandboxTemplate/SandboxWarmPool CRs and needs the
    # extensions.agents.x-k8s.io CRDs registered first. Matches
    # gitops-bootstrap.sh ("agent-sandbox app (sync-wave -5) must be Healthy
    # before the platform app"). AppProjects go even earlier (wave -10).
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: agent-sandbox
  source:
    repoURL: https://github.com/ne-tort/agentscale.git
    targetRevision: main
    path: infra/agent-sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-sandbox-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Controller status fields churn under selfHeal without this.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
