# Dedicated AppProject — do not use Argo `default` (any repo, any namespace).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prodavan
  namespace: argocd
spec:
  description: Prodavan k3s (repo + namespace scoped)
  sourceRepos:
    - https://github.com/ne-tort/prodavan.git
    - https://github.com/ne-tort/agentscale.git
  destinations:
    - namespace: prodavan
      server: https://kubernetes.default.svc
    - namespace: prodavan-sandboxes
      server: https://kubernetes.default.svc
    - namespace: agent-sandbox-system
      server: https://kubernetes.default.svc
  # Overlay includes Namespace; CreateNamespace=true also needs this.
  # agent-sandbox app installs CRDs (cluster-scoped) from vendored upstream manifests.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  # Empty whitelist = allow all namespaced kinds. Pin to what overlays/dev actually ships.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: bitnami.com
      kind: SealedSecret
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    # agent-sandbox CRs (prodavan-sandboxes layer, PR-2)
    - group: agents.x-k8s.io
      kind: Sandbox
    - group: extensions.agents.x-k8s.io
      kind: SandboxClaim
    - group: extensions.agents.x-k8s.io
      kind: SandboxTemplate
    - group: extensions.agents.x-k8s.io
      kind: SandboxWarmPool
  # Orphan monitoring is AppProject-scoped (not Application.spec) — warn only, no auto-delete.
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: Endpoints
      - group: discovery.k8s.io
        kind: EndpointSlice
      - group: ""
        kind: Event
      - group: ""
        kind: Pod
      - group: batch
        kind: Job
        name: prodavan-sandbox-probe
      # Sandboxes/claims are created by the API runtime, not kustomize.
      - group: agents.x-k8s.io
        kind: Sandbox
      - group: extensions.agents.x-k8s.io
        kind: SandboxClaim
