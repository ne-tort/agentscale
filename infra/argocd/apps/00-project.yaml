# Dedicated AppProject — do not use Argo `default` (any repo, any namespace).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agentscale
  namespace: argocd
spec:
  description: Agentscale k3s (repo + namespace scoped)
  sourceRepos:
    - https://github.com/ne-tort/agentscale.git
  destinations:
    - namespace: agentscale
      server: https://kubernetes.default.svc
    - namespace: agentscale-sandboxes
      server: https://kubernetes.default.svc
    - namespace: agentscale-dev
      server: https://kubernetes.default.svc
    - namespace: agentscale-dev-sandboxes
      server: https://kubernetes.default.svc
    # agent-sandbox-system: platform ns for the sandbox controller/router
    # (App agent-sandbox.yaml, project `agent-sandbox`). Listed here so the
    # agentscale project may also target it if platform glue ever lands there.
    - namespace: agent-sandbox-system
      server: https://kubernetes.default.svc
  # Overlay includes Namespace; CreateNamespace=true also needs this.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Empty whitelist = allow all namespaced kinds. Pin to what overlays/dev actually ships.
  namespaceResourceWhitelist:
    - group: extensions.agents.x-k8s.io
      kind: SandboxTemplate
    - group: extensions.agents.x-k8s.io
      kind: SandboxWarmPool
    - group: extensions.agents.x-k8s.io
      kind: SandboxClaim
    - group: agents.x-k8s.io
      kind: Sandbox
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: bitnami.com
      kind: SealedSecret
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    # Traefik CRD: prod-контур маршрутизирует HTTPS по IP-адресу ВМ через
    # IngressRoute (k8s Ingress запрещает IP в host); traefik.io/v1alpha1.
    - group: traefik.io
      kind: IngressRoute
  # Orphan monitoring is AppProject-scoped (not Application.spec) — warn only, no auto-delete.
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: Endpoints
      - group: discovery.k8s.io
        kind: EndpointSlice
      - group: ""
        kind: Event
      - group: ""
        kind: Pod
      - group: batch
        kind: Job
        name: agentscale-sandbox-probe
