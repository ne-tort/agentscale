# Плагиновая платформа: только Git-owned always-on ресурсы и minimal runtime contracts.
# Runtime-created Deployment/Service плагинов НЕ принадлежат этому Application.
# Шаблон с placeholders не входит в kustomize render.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: agentscale
  source:
    repoURL: https://github.com/ne-tort/agentscale.git
    targetRevision: main
    path: infra/k3s/overlays/dev/plugins
  destination:
    server: https://kubernetes.default.svc
    namespace: agentscale-dev
  syncPolicy:
    automated:
      selfHeal: true
      # Dynamic plugin resources создаются вне Argo; prune не должен их удалять.
      prune: false
    syncOptions:
      - CreateNamespace=true
      # Нужен ТОЛЬКО для runtime-owned activation state, не для replicas или
      # Git-owned tenant/PgBouncer/Envoy config.
      - RespectIgnoreDifferences=true
      - Wait=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Намеренно НЕТ ignore Deployment /spec/replicas: Gateway, tenant Postgres,
  # PgBouncer и Envoy масштабируются Git config и не должны оставаться выключенными.
  # Runtime-created Deployment не отслеживаются Application, поэтому широкий ignore
  # для их scale-to-zero не требуется.
  #
  # Намеренно НЕТ ignore /data для tenant-postgres-config, pgbouncer-credentials
  # или egress-proxy-config: отсутствующий контроллер не должен блокировать Git.
  # Единственный узкий ignore защищает CAS state, который пишет работающий Gateway.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: plugin-activation-state
      jsonPointers:
        - /data
