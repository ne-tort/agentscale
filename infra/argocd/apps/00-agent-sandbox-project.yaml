# Dedicated AppProject for agent-sandbox: the platform (controller + router)
# lives in agent-sandbox-system, distinct from app namespaces managed by the
# `agentscale` project. RBAC on sandbox objects (claims/…) in agentscale-dev-sandboxes
# is NOT granted through Argo — see infra/k3s/base/agentscale-dev-sandboxes-ks/rbac-sandboxes.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agent-sandbox
  namespace: argocd
spec:
  description: agent-sandbox controller + sandbox-router (namespace scoped)
  sourceRepos:
    - https://github.com/ne-tort/agentscale.git
  destinations:
    - namespace: agent-sandbox-system
      server: https://kubernetes.default.svc
  # Namespace + CRDs (apiextensions.k8s.io) + ClusterRole/ClusterRoleBinding
  # from the vendored upstream manifests are cluster-scoped.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
