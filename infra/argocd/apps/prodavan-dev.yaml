apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prodavan-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prodavan
  source:
    repoURL: https://github.com/ne-tort/prodavan.git
    targetRevision: main
    path: infra/k3s/overlays/dev
    # Overlay already sets first-party :latest. Do not SHA-override here (I18).
  destination:
    server: https://kubernetes.default.svc
    namespace: prodavan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Fixed-name Jobs + controller status fields churn under selfHeal without this.
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers:
        - /status
        - /spec/selector
        - /spec/template/metadata/labels
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status
