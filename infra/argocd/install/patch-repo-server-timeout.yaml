# git fetch из repo-server на этой VM: бюджет и транспорт.
#
# 1) БЮДЖЕТ 900s (было 300s). 2026-10-23 каждый `git fetch` падал с «failed
#    timeout after 5m0s», приложение висело в `Unknown`, и ни один PR не
#    доезжал до кластера. Клон репозитория (14 МиБ) с этой ноды занимает ~30с
#    при нормальной погоде, но канал до GitHub узкий и периодически проседает;
#    из пода overlay-сеть добавляет задержку.
#
# 2) HTTP/1.1 вместо HTTP/2. После подъёма бюджета всплыла настоящая причина:
#    `git fetch` падал через ~10 минут с
#      error: RPC failed; curl 92 HTTP/2 stream 5 was not closed cleanly:
#             CANCEL (err 8)
#    Это не таймаут, а обрыв HTTP/2-потока на нестабильном канале — известная
#    проблема git+GitHub за прокси/NAT. HTTP/1.1 устойчив к таким обрывам и
#    для 14 МиБ разницы в скорости нет.
#
# 3) hostNetwork. Замеры 2026-10-23 на этой VM:
#      pod -> нода (CNI):  155 МБ/с   → сеть пода здорова
#      pod -> GitHub:      ~20 КБ/с, обрывы (IncompleteRead, curl 92 CANCEL)
#      нода -> GitHub:       2.2 МБ/с
#      PMTU до GitHub:      <1500 (ping -M do -s 1472 → Frag needed; -s 1400 → OK)
#    Из пода наружу путь деградирует настолько, что `git fetch` (14 МиБ) не
#    укладывается ни в 5, ни в 15 минут — Argo не получает target state и НИ
#    ОДИН PR не доезжает до кластера. С hostNetwork repo-server ходит тем же
#    путём, что нода: fetch занимает ~1с.
#    Компромисс осознанный: порт 8081 занимается на ноде (в кластере он один).
#    Постоянное лечение — flannel-mtu 1400 (требует рестарта k3s), отдельной
#    задачей: рестарт остановит весь dev-кластер.
#
# Настройки git передаются через GIT_CONFIG_* (документированный механизм git),
# а не через `git config` в shell — декларативно и без init-скриптов.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: argocd-repo-server
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: "900s"
            - name: ARGOCD_GIT_ATTEMPTS_COUNT
              value: "5"
            - name: GIT_CONFIG_COUNT
              value: "2"
            - name: GIT_CONFIG_KEY_0
              value: http.version
            - name: GIT_CONFIG_VALUE_0
              value: HTTP/1.1
            # Буфер на большие packfile: при дефолтном 1 МиБ git переключается
            # на chunked-передачу, которая на этом канале рвётся чаще.
            - name: GIT_CONFIG_KEY_1
              value: http.postBuffer
            - name: GIT_CONFIG_VALUE_1
              value: "524288000"