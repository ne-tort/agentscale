# Longer git fetch timeout for flaky TLS on local WSL/k3s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: "300s"
            - name: ARGOCD_GIT_ATTEMPTS_COUNT
              value: "5"
