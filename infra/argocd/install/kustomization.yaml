apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Official Argo CD install (pinned v2.13.3), vendored for offline CI —
  # remote raw.githubusercontent.com fetch flakes on self-hosted runners.
  - upstream-install.yaml
patches:
  - path: patch-repo-server-timeout.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: patch-pull-policy-repo-server.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: patch-pull-policy-server.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: patch-pull-policy-applicationset.yaml
    target:
      kind: Deployment
      name: argocd-applicationset-controller
  - path: patch-pull-policy-application-controller.yaml
    target:
      kind: StatefulSet
      name: argocd-application-controller
  # The three upstream workloads still shipping imagePullPolicy: Always
  # (redis from docker.io, dex from ghcr.io, notifications from quay.io).
  # All tags are public + immutable → IfNotPresent on every argocd workload,
  # so pod restarts never depend on registry availability/rate-limits.
  - path: patch-pull-policy-redis.yaml
    target:
      kind: Deployment
      name: argocd-redis
  - path: patch-pull-policy-dex.yaml
    target:
      kind: Deployment
      name: argocd-dex-server
  - path: patch-pull-policy-notifications.yaml
    target:
      kind: Deployment
      name: argocd-notifications-controller
  - path: patch-argocd-cm-health.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
