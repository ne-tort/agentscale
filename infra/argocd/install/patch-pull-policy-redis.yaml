# redis:7.0.15-alpine (docker.io/library, public, pinned) — upstream ships
# imagePullPolicy: Always for the redis container. Docker Hub anonymous pulls
# are rate-limited per IP; `Always` re-checks the registry on EVERY pod
# restart, so a restart during a rate-limit window would take down the cache
# Argo itself depends on. Tag is immutable → IfNotPresent is safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          imagePullPolicy: IfNotPresent
