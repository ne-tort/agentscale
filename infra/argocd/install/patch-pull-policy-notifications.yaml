# quay.io/argoproj/argocd:v2.13.3 (public, pinned) — upstream ships Always.
# Immutable tag → IfNotPresent is safe and removes the registry dependency
# from pod restarts (cold VM / flaky link resilience).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-notifications-controller
          imagePullPolicy: IfNotPresent
