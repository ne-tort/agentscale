# Local-fast override: web from host `flutter build web` (no Flutter SDK image).
# Usage:
#   flutter build web --release --dart-define=API_BASE=http://localhost:8000
#   BUILDX_BUILDER=prodavan docker compose -f infra/docker-compose.stack.yml \
#     -f infra/docker-compose.stack.local.yml up --build

services:
  web:
    build:
      target: from-host
