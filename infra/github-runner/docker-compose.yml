services:
  runner:
    build: .
    image: prodavan-gha-runner:local
    container_name: prodavan-gha-runner
    restart: unless-stopped
    # Prefer host net: bridge DNS on Desktop/WSL often fails for broker.actions.githubusercontent.com
    network_mode: host
    env_file:
      - .env
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/ne-tort/prodavan}
      RUNNER_NAME: ${RUNNER_NAME:-wsl-prodavan}
      LABELS: ${LABELS:-self-hosted,linux,docker,wsl-dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-home:/opt/actions-runner
      # Optional preload (avoids flaky GitHub download):
      - ./actions-runner-linux-x64-2.328.0.tar.gz:/tmp/actions-runner-linux-x64-2.328.0.tar.gz:ro

volumes:
  runner-home:
