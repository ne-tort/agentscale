services:
  runner:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: prodavan-gha-runner
    restart: unless-stopped
    # Bridge NAT in this WSL Docker cannot reach api.github.com (HTTP 000).
    network_mode: host
    env_file:
      - .env
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/ne-tort/prodavan}
      RUNNER_NAME: ${RUNNER_NAME:-wsl-prodavan}
      LABELS: ${LABELS:-self-hosted,linux,docker,wsl-dev}
      DISABLE_AUTO_UPDATE: "true"
      RUNNER_SCOPE: repo
      RUNNER_WORKDIR: /tmp/runner/work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner

volumes:
  runner-work:
