services:
  runner:
    build: .
    image: prodavan-gha-runner:local
    container_name: prodavan-gha-runner
    restart: unless-stopped
    # REQUIRED: host net. Bridge on Docker Desktop/WSL breaks GitHub TLS
    # (TCP connects, handshake EOF). Kali host curl + host-net container: OK.
    network_mode: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/ne-tort/prodavan}
      RUNNER_NAME: ${RUNNER_NAME:-wsl-prodavan-kali}
      LABELS: ${LABELS:-self-hosted,linux,docker,wsl-dev}
      KUBECONFIG: /kube/prodavan-k3d.yaml
      # Same Docker as k3d (Kali): leave empty so attach uses 127.0.0.1.
      # Only set host.docker.internal if runner is on Docker Desktop.
      KUBECONFIG_REWRITE_HOST: ${KUBECONFIG_REWRITE_HOST:-}
      GITHUB_TLS_PROBE_URL: https://api.github.com/zen
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-home:/opt/actions-runner
      - ../.kube:/kube:ro
      - ./actions-runner-linux-x64-2.336.0.tar.gz:/tmp/actions-runner-linux-x64-2.336.0.tar.gz:ro

volumes:
  runner-home:
