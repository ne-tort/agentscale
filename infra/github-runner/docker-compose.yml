# Prodavan GitHub Actions runners — Docker Desktop (Windows-controlled)
#
# Peak parallel jobs in CI Gate: infra + api + flutter + schemas = 4
# Persistent /cache volume: Flutter SDK, pub, Poetry, pip (project-dedicated runners).
#
# IMPORTANT: do NOT use `docker compose --scale` for this image.
# Each replica needs its own RUNNER_NAME + CONFIGURED_ACTIONS_RUNNER_FILES_DIR volume,
# otherwise Docker Desktop / WSL restarts leave corrupt `.runner` files and crash-loop
# ("already configured" / configuredSettings null).
#
# Usage (PowerShell):
#   copy .env.example .env   # set ACCESS_TOKEN
#   .\Start-Runners.ps1
#   docker compose down      # keeps volumes (cache + registration)
#   docker compose down -v   # WIPES caches AND registration — re-registers next start

name: prodavan-runners

x-cache-env: &cache-env
  PRODAVAN_CI_CACHE: /cache
  RUNNER_TOOL_CACHE: /cache/toolcache
  AGENT_TOOLSDIRECTORY: /cache/toolcache
  PUB_CACHE: /cache/pub
  FLUTTER_SDK: /cache/flutter-sdk
  PIP_CACHE_DIR: /cache/pip
  POETRY_CLI: /cache/poetry-cli
  POETRY_CACHE_DIR: /cache/poetry
  POETRY_VIRTUALENVS_PATH: /cache/poetry-venvs
  POETRY_VIRTUALENVS_IN_PROJECT: "false"
  XDG_CACHE_HOME: /cache/xdg
  PRODAVAN_CI_HOST: host.docker.internal
  KUBECONFIG: /home/runner/.kube/prodavan-dev.yaml

x-runner-common: &runner-common
  build:
    context: .
    dockerfile: Dockerfile
  image: prodavan-github-runner:py312
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  dns:
    - 8.8.8.8
    - 1.1.1.1
  dns_opt:
    - timeout:2
    - attempts:3
    - use-vc
  networks:
    - runners

x-runner-env: &runner-env
  <<: *cache-env
  REPO_URL: ${REPO_URL:-https://github.com/ne-tort/prodavan}
  ACCESS_TOKEN: ${ACCESS_TOKEN:-}
  RUNNER_TOKEN: ${RUNNER_TOKEN:-}
  RUNNER_SCOPE: repo
  LABELS: ${LABELS:-self-hosted,linux,docker,docker-desktop}
  DISABLE_AUTO_UPDATE: "true"
  # Persist registration across Docker Desktop / WSL restarts (required).
  CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-files
  # Required when CONFIGURED_ACTIONS_RUNNER_FILES_DIR is set — else entrypoint exits 1
  # right after "Storing data to /runner-files" (myoung34 PR #427).
  DISABLE_AUTOMATIC_DEREGISTRATION: "true"
  # myoung34: ANY non-empty EPHEMERAL enables --ephemeral. Keep empty.
  EPHEMERAL: ${EPHEMERAL:-}

x-runner-volumes: &runner-volumes
  - /var/run/docker.sock:/var/run/docker.sock
  - ${USERPROFILE}/.kube:/home/runner/.kube:ro
  - prodavan-ci-cache:/cache

services:
  runner-1:
    <<: *runner-common
    container_name: prodavan-runners-runner-1
    environment:
      <<: *runner-env
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-dd-prodavan}-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/home/runner/.kube:ro
      - prodavan-ci-cache:/cache
      - runner-1-files:/runner-files

  runner-2:
    <<: *runner-common
    container_name: prodavan-runners-runner-2
    environment:
      <<: *runner-env
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-dd-prodavan}-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/home/runner/.kube:ro
      - prodavan-ci-cache:/cache
      - runner-2-files:/runner-files

  runner-3:
    <<: *runner-common
    container_name: prodavan-runners-runner-3
    environment:
      <<: *runner-env
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-dd-prodavan}-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/home/runner/.kube:ro
      - prodavan-ci-cache:/cache
      - runner-3-files:/runner-files

  runner-4:
    <<: *runner-common
    container_name: prodavan-runners-runner-4
    environment:
      <<: *runner-env
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-dd-prodavan}-4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/home/runner/.kube:ro
      - prodavan-ci-cache:/cache
      - runner-4-files:/runner-files

networks:
  runners:
    name: prodavan-runners
    driver: bridge

volumes:
  prodavan-ci-cache:
    name: prodavan-ci-cache
  runner-1-files:
    name: prodavan-runner-1-files
  runner-2-files:
    name: prodavan-runner-2-files
  runner-3-files:
    name: prodavan-runner-3-files
  runner-4-files:
    name: prodavan-runner-4-files
