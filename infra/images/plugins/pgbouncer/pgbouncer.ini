# =============================================================================
# ДЕФОЛТНЫЙ pgbouncer.ini ОБРАЗА (эталон + fail-closed дефолт).
#
# В k3s ЭТОТ файл ПЕРЕКРЫВАЕТ ConfigMap `pgbouncer-config` задачи 14:
#   command: pgbouncer /etc/pgbouncer/config/pgbouncer.ini
#   volumeMounts: subPath pgbouncer.ini (статический конфиг, контроллер его
#                 не правит), auth — КАТАЛОГ БЕЗ subPath из Secret'а.
# Все значения ниже намеренно повторяют configmap: расхождение дефолта и k3s
# было бы тихой дырой при потере монтирования.
# =============================================================================

[databases]
# ОДНА секция, ОДНА запись, ОДИН пул на весь tenant-кластер.
# Wildcard `*` → любая tenant_* БД маршрутизируется на ОДИН backend-кластер.
# N компаний = N БД, но НЕ N записей и НЕ N подов.
* = host=tenant-postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

# Аутентификация: ТОЛЬКО scram-sha-256, НЕ trust/md5/plain.
# В k3s путь = /etc/pgbouncer/auth/userlist.txt (Secret `pgbouncer-credentials`,
# ключ userlist.txt, КАТАЛОГ БЕЗ subPath → kubelet проецирует обновления,
# задача 05 вызывает RELOAD). Здесь, в образе, путь к ПУСТОЙ заглушке:
# ни одна роль не пройдёт аутентификацию = deny all (fail-closed).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/auth/userlist.txt

# ТРАНЗАКЦИОННЫЙ режим (§2.1): серверное соединение возвращается в пул
# ПОСЛЕ КАЖДОЙ ТРАНЗАКЦИИ, а не удерживается сессией плагина. Один пул
# обслуживает N плагинов при max_connections=100 у tenant-postgres.
pool_mode = transaction

# Лимиты. default_pool_size × число ролей должно оставаться ниже
# max_db_connections=80 (иначе upstream упрется в max_connections).
max_client_conn = 200
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
max_user_connections = 40

# DISCARD ALL возвращает search_path к значению из ALTER ROLE ... SET
# search_path (§2.2), а НЕ к дефолту "$user", public: плагин не «залипнет»
# на чужой схеме через переиспользование соединения в transaction mode.
server_reset_query = DISCARD ALL
server_reset_query_always = 1
server_check_query = SELECT 1
server_check_delay = 30
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 2
query_wait_timeout = 30
client_idle_timeout = 300
client_login_timeout = 30
ignore_startup_parameters = extra_float_digits,search_path

# Консоль (RELOAD / SHOW POOLS) — только пользователь из userlist с паролем.
# Отдельного Service для неё НЕТ. В образе userlist ПУСТ → консоль недоступна.
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
verbose = 0
pidfile = /tmp/pgbouncer.pid
