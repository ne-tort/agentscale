# include-файл ПАР (role, tenant_<company>) для pg_hba.conf.
#
# СТАРТОВОЕ СОДЕРЖИМОЕ — ТОЛЬКО КОММЕНТАРИИ: ни одного разрешения до первого
# grant. Пустой список = ни один плагин не подключится (fail-closed).
#
# Формат строки (pg_hba, БЕЗ `map=`!):
#   host  tenant_<company_id>  tenant_<company_id>_plugin_<module>  10.42.0.0/16  scram-sha-256
#   host  tenant_<company_id>  tenant_<company_id>_plugin_<module>  10.43.0.0/16  scram-sha-256
#
# `map=` несовместим со scram-sha-256 (см. pg_ident.conf и
# pg_hba.conf.template): пара задаётся полями DATABASE и USER, а не ident-map.
#
# ОБЯЗАТЕЛЬНЫЙ ПОРЯДОК ПРИ GRANT (задача 05):
#   1) REVOKE CONNECT, TEMPORARY ON DATABASE tenant_<co> FROM PUBLIC;
#   2) GRANT  CONNECT ON DATABASE tenant_<co> TO <роль плагина>;
#   3) ALTER ROLE <роль> LOGIN; ALTER ROLE <роль> CONNECTION LIMIT 10;
#   4) добавить сюда пару (DATABASE = tenant_<co>, USER = <роль>);
#   5) SELECT pg_reload_conf();  -- конфиг смонтирован КАТАЛОГОМ без subPath.
# ПРИ REVOKE: убрать пару, ALTER ROLE ... NOLOGIN, SELECT pg_reload_conf().
#
# В k3s боевой файл приходит из ConfigMap `tenant-postgres-config` задачи 14
# (ключ `tenant_hba.conf`) и правится контроллером ВНЕ Git → для Argo
# Application `plugin-platform` нужен `ignoreDifferences` на `/data`
# (задача 15), иначе selfHeal сотрёт пары при первом же синке.
#
# Главный pg_hba.conf подключает этот файл директивой `include` (НЕ
# `include_if_exists`): если файл пропал, postgres НЕ стартует.
