# MAPNAME  SYSTEM-USERNAME  PG-USERNAME
#
# ПУСТАЯ ЗАГЛУШКА. Намеренно НЕ содержит ни одной записи.
#
# `map=` в pg_hba.conf НЕСОВМЕСТИМ со `scram-sha-256`: опция map допустима
# только для ident / peer / gssapi / sspi / ldap / radius / cert и маппит
# внешнее (системное) имя в имя роли БД. С scram-sha-256 postgres упадёт на
# старте с "authentication option map is not valid for this method".
#
# Поэтому пары (роль, tenant_<company>) задаются ЯВНО полями DATABASE и USER
# в pg_hba.conf.template / tenant_hba.conf, а НЕ через pg_ident. Добавление
# строки сюда НЕ даст эффекта и НЕ должно использоваться как «обход»: это
# ровно то решение, которое дизайн v4 §2.1 явно запрещает.
#
# Deployment задачи 14 передаёт `-c ident_file=/etc/postgresql/pg_ident.conf`,
# чтобы файл был ЯВНЫМ и это решение было видно в конфигурации, а не только
# в комментариях. Пустой файл = нет маппингов = fail-closed.
