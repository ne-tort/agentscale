# Ingress `plugins-gateway` — ОТДЕЛЬНЫЙ объект для путей плагинов (v4 §7.1, §14 п.7).
#
# КАНОНИЧЕСКИЙ файл (решение родителя от задачи 15): живёт ТОЛЬКО здесь, в
# `infra/k3s/overlays/dev/plugins/`, и ведётся исключительно Argo Application
# `plugin-platform.yaml`. Родитель НЕ добавляет его в
# `overlays/dev/kustomization.yaml` и НЕ отдаёт `agentscale-dev` — двойного
# владения нет. `path: infra/k3s/overlays/dev/plugins` в plugin-platform.yaml.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ Ingress, а не новый path в существующем:
# Traefik превращает КАЖДЫЙ path Ingress'а в отдельный router, а
# `traefik.ingress.kubernetes.io/router.priority` — АННОТАЦИЯ НА INGRESS, а не
# на path. Поэтому один объект с `/`, `/api` и `/webhook` дал бы ВСЕМ путям
# одинаковый приоритет. Исторический инцидент #331: `/` перебивал `/api`,
# логин POST получал index.html от SPA. Разделено по смыслу (подробный
# разбор — overlays/dev/ingress-https-api.yaml:1-14, тест
# infra/ops/tests/test_ingress_priority.py).
#
# ПРИОРИТЕТЫ dev-контура на websecure:
#   120 — plugins-gateway (этот файл): /webhook, /pluginpage
#   110 — agentscale-https-api: /api, /health
#   100 — agentscale-https-web: /
#    50 — prod wildcard catch-all («любой публичный адрес = prod»)
# 120 > 110 > 100, поэтому плагиновые пути не уезжают в SPA (acceptance №9).
#
# kind Ingress разрешён whitelist'ом `infra/argocd/apps/00-project.yaml:81-82`.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plugins-gateway
  namespace: agentscale-dev
  labels:
    app: plugin-gateway
    app.kubernetes.io/name: plugins-gateway
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: plugin-ingress
  annotations:
    # Порядок ресурсов ВНУТРИ Argo Application `plugin-platform`.
    # wave 1 (НЕ 25): wave 25 создавал замкнутый круг — Argo считал App
    # «Missing» (Ingress отсутствует в live), а более поздняя волна не
    # применялась до здоровья предыдущих, поэтому Ingress НЕ создавался
    # вообще и /webhook/* оставался без маршрута. Все ресурсы плагинового
    # оверлея синхронизируются одной волной; приоритет 120 задан аннотацией
    # Traefik на самом Ingress и от sync-wave НЕ зависит (инцидент #331).
    argocd.argoproj.io/sync-wave: "1"
    # ПРИОРИТЕТ — АННОТАЦИЯ НА INGRESS, НЕ НА PATH (см. шапку).
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "120"
spec:
  ingressClassName: traefik
  tls:
    # self-signed default cert Traefik (TLSStore). cert-manager в кластере НЕТ
    # и не вводится: cert-manager.io/{Certificate,ClusterIssuer} отсутствуют в
    # whitelist 00-project.yaml (§5.3, §7.1, ADR-008).
    - hosts:
        - agentscale.dev
        - localhost
  rules:
    # Dev PINNED на явные dev-хосты: любой ДРУГОЙ Host на :443 (публичный IP
    # через punnel/VPN, сканеры) уходит в prod wildcard (AGENTS.md, политика сред).
    - host: agentscale.dev
      http:
        paths:
          # /webhook/{plugin}/{company}/* — входящие webhook'ы (§7.1, §7.5).
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: plugin-gateway
                port:
                  number: 8080
          # /pluginpage/{plugin}/{company}/     → frontend (static)
          # /pluginpage/{plugin}/{company}/api/ → backend
          - path: /pluginpage
            pathType: Prefix
            backend:
              service:
                name: plugin-gateway
                port:
                  number: 8080
    - host: localhost
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: plugin-gateway
                port:
                  number: 8080
          - path: /pluginpage
            pathType: Prefix
            backend:
              service:
                name: plugin-gateway
                port:
                  number: 8080
