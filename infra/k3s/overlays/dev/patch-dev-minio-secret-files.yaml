apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscale-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Dev replaces the base plaintext env projection with references.
            - name: PLUGIN_MINIO_ADMIN_ACCESS_KEY
              $patch: delete
            - name: PLUGIN_MINIO_ADMIN_SECRET_KEY
              $patch: delete
            - name: PLUGIN_MINIO_PRESIGN_ACCESS_KEY
              $patch: delete
            - name: PLUGIN_MINIO_PRESIGN_SECRET_KEY
              $patch: delete
            - name: PLUGIN_MINIO_ADMIN_ACCESS_KEY_REF
              value: k8s-secret://agentscale-minio-plugin-admin/access-key
            - name: PLUGIN_MINIO_ADMIN_SECRET_KEY_REF
              value: k8s-secret://agentscale-minio-plugin-admin/secret-key
            - name: PLUGIN_MINIO_PRESIGN_ACCESS_KEY_REF
              value: k8s-secret://agentscale-minio-plugin-presigner/access-key
            - name: PLUGIN_MINIO_PRESIGN_SECRET_KEY_REF
              value: k8s-secret://agentscale-minio-plugin-presigner/secret-key
          volumeMounts:
            - name: minio-plugin-admin-secret
              mountPath: /var/run/secrets/agentscale-minio-plugin-admin
              readOnly: true
            - name: minio-plugin-presigner-secret
              mountPath: /var/run/secrets/agentscale-minio-plugin-presigner
              readOnly: true
      volumes:
        - name: minio-plugin-admin-secret
          secret:
            secretName: agentscale-minio-plugin-admin
            defaultMode: 0400
            items:
              - key: access-key
                path: access-key
              - key: secret-key
                path: secret-key
        - name: minio-plugin-presigner-secret
          secret:
            secretName: agentscale-minio-plugin-presigner
            defaultMode: 0400
            items:
              - key: access-key
                path: access-key
              - key: secret-key
                path: secret-key
