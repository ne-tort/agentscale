# Ensure sibling Postgres database for Tenant User DB (no Alembic).
apiVersion: batch/v1
kind: Job
metadata:
  name: prodavan-userdb-init
  namespace: prodavan
  labels:
    app.kubernetes.io/name: prodavan-userdb-init
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: userdb-init
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-userdb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:16.15
          env:
            - name: PGPASSWORD
              value: prodavan
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -h prodavan-postgres -U prodavan -d prodavan; do sleep 2; done
              psql -h prodavan-postgres -U prodavan -d prodavan -v ON_ERROR_STOP=1 <<'SQL'
              SELECT 'create_db'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'prodavan_userdb')\gexec
              SQL
              # Portable create if missing:
              psql -h prodavan-postgres -U prodavan -d prodavan -tc "SELECT 1 FROM pg_database WHERE datname='prodavan_userdb'" | grep -q 1 \
                || psql -h prodavan-postgres -U prodavan -d prodavan -c "CREATE DATABASE prodavan_userdb OWNER prodavan"
              echo "userdb-init: ok"
