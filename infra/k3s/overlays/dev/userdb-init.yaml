# Ensure sibling Postgres database for Tenant User DB (no Alembic).
apiVersion: batch/v1
kind: Job
metadata:
  name: prodavan-userdb-init
  namespace: prodavan
  labels:
    app.kubernetes.io/name: prodavan-userdb-init
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: userdb-init
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-userdb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:16.15
          env:
            - name: PGPASSWORD
              value: prodavan
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -h prodavan-postgres -U prodavan -d prodavan; do sleep 2; done
              # Idempotent create (no \gexec - crashes ON_ERROR_STOP under heredoc).
              exists=$(psql -h prodavan-postgres -U prodavan -d prodavan -Atc \
                "SELECT 1 FROM pg_database WHERE datname='prodavan_userdb'")
              if [ "$exists" != "1" ]; then
                psql -h prodavan-postgres -U prodavan -d prodavan \
                  -c "CREATE DATABASE prodavan_userdb OWNER prodavan"
              fi
              echo "userdb-init: ok"
