# Ensure sibling Postgres database for Tenant User DB (no Alembic).
apiVersion: batch/v1
kind: Job
metadata:
  name: agentscale-userdb-init
  namespace: agentscale-dev
  labels:
    app.kubernetes.io/name: agentscale-userdb-init
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: userdb-init
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-userdb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:16.15
          env:
            - name: PGPASSWORD
              value: agentscale
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -h agentscale-postgres -U agentscale -d agentscale; do sleep 2; done
              # Idempotent create (no \gexec - crashes ON_ERROR_STOP under heredoc).
              exists=$(psql -h agentscale-postgres -U agentscale -d agentscale -Atc \
                "SELECT 1 FROM pg_database WHERE datname='agentscale_userdb'")
              if [ "$exists" != "1" ]; then
                psql -h agentscale-postgres -U agentscale -d agentscale \
                  -c "CREATE DATABASE agentscale_userdb OWNER agentscale"
              fi
              echo "userdb-init: ok"
