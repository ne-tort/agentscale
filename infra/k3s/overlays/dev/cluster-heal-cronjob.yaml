# Dev-only: prune zombie pods after WSL node flaps (Terminating / Failed sandboxes).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prodavan-cluster-heal
  namespace: prodavan
  labels:
    app.kubernetes.io/name: prodavan-cluster-heal
    app.kubernetes.io/part-of: prodavan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prodavan-cluster-heal
  namespace: prodavan
  labels:
    app.kubernetes.io/name: prodavan-cluster-heal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prodavan-cluster-heal
  namespace: prodavan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prodavan-cluster-heal
subjects:
  - kind: ServiceAccount
    name: prodavan-cluster-heal
    namespace: prodavan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prodavan-cluster-heal
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-cluster-heal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prodavan-cluster-heal
  namespace: prodavan-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prodavan-cluster-heal
subjects:
  - kind: ServiceAccount
    name: prodavan-cluster-heal
    namespace: prodavan
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prodavan-cluster-heal
  namespace: prodavan
  labels:
    app.kubernetes.io/name: prodavan-cluster-heal
    app.kubernetes.io/part-of: prodavan
  annotations:
    argocd.argoproj.io/sync-wave: "99"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: prodavan-cluster-heal
          restartPolicy: Never
          containers:
            - name: heal
              image: bitnami/kubectl:1.31.4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ec
                - |
                  set -uo pipefail
                  for ns in prodavan prodavan-sandboxes; do
                    while read -r name phase; do
                      [ -z "$name" ] && continue
                      case "$phase" in
                        Terminating|Unknown|Failed|Error)
                          echo "delete $ns/$name ($phase)"
                          kubectl delete pod -n "$ns" "$name" --grace-period=0 --force --wait=false || true
                          ;;
                      esac
                    done < <(kubectl get pods -n "$ns" --no-headers 2>/dev/null | awk '{print $1, $3}')
                  done
                  echo cluster-heal done
