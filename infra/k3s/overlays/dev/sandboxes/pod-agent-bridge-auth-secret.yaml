# Dev: sidecar PRODAVAN_AUTH_TOKEN + optional BRIDGE_AUTH_TOKEN for API → bridge calls.
apiVersion: v1
kind: Secret
metadata:
  name: pod-agent-bridge-auth
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: agent-bridge
type: Opaque
stringData:
  token: k3s-dev-bridge-change-me
  bridge-token: k3s-dev-bridge-change-me
