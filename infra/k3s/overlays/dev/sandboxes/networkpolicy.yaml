apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-sandbox-egress
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-sandboxes
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
spec:
  podSelector:
    matchLabels:
      prodavan.io/managed-by: pod-service
  policyTypes:
    - Egress
  egress:
    # Hydrate initContainer → in-cluster MinIO (prodavan namespace).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodavan
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8000
    # General egress (AI APIs, package registries).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: UDP
          port: 53
