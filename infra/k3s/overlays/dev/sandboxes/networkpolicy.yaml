apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-sandbox-egress
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-sandboxes
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
spec:
  podSelector:
    matchLabels:
      prodavan.io/managed-by: pod-service
  policyTypes:
    - Egress
  egress:
    # Pod API surface only (:8001). No MinIO :9000, no full API :8000.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodavan
      ports:
        - protocol: TCP
          port: 8001
    # DNS (kube-dns + upstream resolvers).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # AI provider APIs and public internet (Cursor, Anthropic, OpenAI, …).
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Remote equipment catalogs (live PostgreSQL) — any non-cluster host.
    # Explicit 0.0.0.0/0 so CNI cannot treat “ports-only” as cluster-internal.
    # Covers WSL/Windows host gateways (e.g. 172.21.176.1:5433) and LAN DBs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5433
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-sandbox-ingress
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-sandboxes
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
spec:
  podSelector:
    matchLabels:
      prodavan.io/managed-by: pod-service
  policyTypes:
    - Ingress
  ingress:
    # API → agent-runtime workspace/bridge only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodavan
      ports:
        - protocol: TCP
          port: 3921
