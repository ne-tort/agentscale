# Dev overlay for prodavan-sandboxes (agent-sandbox era).
# Canon: docs/migration/03-devops.md 3.2. SandboxTemplate/WarmPool/RBAC/NetworkPolicy
# come from the base prodavan-sandboxes-ks layer; this overlay keeps dev-only
# extras (probe-pod, ghcr pull secret). The bridge auth secret lives in base —
# the SandboxTemplate BRIDGE_AUTH_TOKEN env references it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/prodavan-sandboxes-ks
  - namespace.yaml
  - probe-pod.yaml
