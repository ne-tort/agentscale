# Dev overlay for agentscale-dev-sandboxes (agent-sandbox era).
# Canon: docs/08-migration/agent-sandbox-adr.md. SandboxTemplate/WarmPool/RBAC/NetworkPolicy
# come from the base agentscale-sandboxes-ks layer (re-namespace to agentscale-dev-sandboxes here); this overlay keeps dev-only
# extras (probe-pod, ghcr pull secret). The bridge auth secret lives in base —
# the SandboxTemplate BRIDGE_AUTH_TOKEN env references it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/agentscale-sandboxes-ks
  - namespace.yaml
  - probe-pod.yaml
patches:
  - target:
      group: extensions.agents.x-k8s.io
      version: v1beta1
      kind: SandboxTemplate
      name: agentscale-agent
    patch: |-
      - op: replace
        path: /spec/podTemplate/spec/containers/0/env/3/value
        value: http://agentscale-api.agentscale-dev.svc:8001/api/v1
  # The API SA lives in the app namespace (agentscale-dev), while the base
  # Role/RoleBinding are re-namespaced into agentscale-dev-sandboxes by the
  # transformer below. A subject without an explicit namespace resolves to
  # the RoleBinding's own namespace — a nonexistent SA there — leaving the
  # API without sandboxclaims RBAC: launch → 403, delete → 500.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: agentscale-sandbox-claims
    patch: |-
      - op: add
        path: /subjects/0/namespace
        value: agentscale-dev
  # Base NetworkPolicy names the PROD app namespace (agentscale) in its
  # namespaceSelectors; in dev the API lives in agentscale-dev. Without this
  # patch agent-runtimes cannot reach the pod-only API surface (:8001) and
  # the API cannot hit sandbox pods directly (deprecated path).
  # (Rule-level `op: replace` — kustomize's JSON6902 chokes on the escaped
  # `kubernetes.io~1metadata.name` leaf key, so whole rules are swapped.)
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: agentscale-sandboxes-egress
    patch: |-
      - op: replace
        path: /spec/ingress/1
        value:
          from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: agentscale-dev
          ports:
          - protocol: TCP
            port: 3921
      - op: replace
        path: /spec/egress/0
        value:
          to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: agentscale-dev
          ports:
          - protocol: TCP
            port: 8001
transformers:
  - namespace-transformer.yaml
