# Pod lifecycle RBAC in prodavan-sandboxes. API SA (prodavan) is the controller subject.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prodavan-project-pod
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-project-pod
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: project-pod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prodavan-pod-service
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-pod-service
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: pod-service
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prodavan-pod-service
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-pod-service
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: pod-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prodavan-pod-service
subjects:
  - kind: ServiceAccount
    name: prodavan-api
    namespace: prodavan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prodavan-project-pod
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-project-pod
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: project-pod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["prodavan-minio-hydrate"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prodavan-project-pod
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-project-pod
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: project-pod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prodavan-project-pod
subjects:
  - kind: ServiceAccount
    name: prodavan-project-pod
    namespace: prodavan-sandboxes
