apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-api
  namespace: prodavan
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: prodavan-api
        app.kubernetes.io/name: prodavan-api
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Must match api container: stale migrate image → upgrade noop + schema 500s.
      initContainers:
        - name: migrate
          imagePullPolicy: Always
      containers:
        - name: api
          # Dev uses :latest — Always so Verify/rollout actually pull new digests.
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-web
  namespace: prodavan
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-celery-worker
  namespace: prodavan
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-celery-beat
  namespace: prodavan
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: beat
          imagePullPolicy: Always
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prodavan-config
  namespace: prodavan
data:
  STORAGE_ROOT: /data/storage
  SECRETS_DIR: /data/storage/secrets
  PACKS_ROOT: /packages/cabinet-packs
  # Dev is reached via arbitrary reverse proxies (punnel / VPN) whose origin
  # (IP:port) is unpredictable. Allow any origin; auth is Bearer JWT (no cookies),
  # so wildcard is safe. cors_forbid_wildcard_origin disabled below to permit "*".
  CORS_ORIGINS: "*"
  CORS_FORBID_WILDCARD_ORIGIN: "false"
  RUN_MIGRATIONS: "1"
  API_V1_PREFIX: /api/v1
  APP_ENV: dev
  AUTH_MODE: oidc
  KEYCLOAK_URL: http://prodavan-keycloak:8080
  KEYCLOAK_ISSUER_URL: http://127.0.0.1:8089/realms/prodavan
  OIDC_JWKS_URL: http://prodavan-keycloak:8080/realms/prodavan/protocol/openid-connect/certs
  KEYCLOAK_REALM: prodavan
  KEYCLOAK_INVITE_MODE: admin
  KEYCLOAK_ADMIN_CLIENT_ID: prodavan-services
  OIDC_AUDIENCE: prodavan-api
  OIDC_FLUTTER_CLIENT_ID: prodavan-flutter
  REDIS_URL: redis://prodavan-redis:6379/0
  REDIS_REQUIRED: "true"
  CELERY_ENABLED: "true"
  CELERY_BROKER_URL: redis://prodavan-redis:6379/0
  TRIGGER_WORKER_ENABLED: "true"
  IDLE_PAUSE_WORKER_ENABLED: "true"
  OBJECT_STORE_BACKEND: s3
  S3_ENDPOINT_URL: http://prodavan-minio:9000
  S3_BUCKET: prodavan
  S3_REGION: us-east-1
  OBJECT_STORE_REQUIRED: "true"
  OBJECT_STORE_MIRROR_LOCAL: "true"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: prodavan-kafka:9092
  KAFKA_CONSUMER_ENABLED: "true"
  KAFKA_CONSUMER_MODE: kick
  KAFKA_REQUIRED: "true"
  KAFKA_TOPIC_DOCUMENT_EVENTS: prodavan.document.events
  KAFKA_TOPIC_SEARCH_EVENTS: prodavan.search.events
  MONGODB_ENABLED: "true"
  MONGODB_DB: prodavan
  MONGODB_REQUIRED: "true"
  OPENSEARCH_ENABLED: "true"
  OPENSEARCH_URL: http://prodavan-opensearch:9200
  OPENSEARCH_REQUIRED: "true"
  CELERY_REQUIRED: "false"
  MCP_SANDBOX_SPAWN: "false"
  SANDBOX_K8S_JOBS: "false"
  SANDBOX_K8S_NAMESPACE: prodavan
  SANDBOX_K8S_PVC: prodavan-api-storage
  SANDBOX_K8S_JOB_IMAGE: ghcr.io/ne-tort/prodavan-api:latest
  POD_RUNTIME_MODE: "k8s"
  POD_K8S_REQUIRED: "true"
  POD_READY_TIMEOUT_SEC: "20"
  POD_IMAGE_PULL_TIMEOUT_SEC: "600"
  POD_PROVISIONING_TIMEOUT_SEC: "120"
  POD_METRICS_GRACE_SEC: "30"
  METRICS_SAMPLE_INTERVAL_SEC: "15"
  METRICS_SAMPLE_TTL_SEC: "60"
  POD_SANDBOX_NAMESPACE: prodavan-sandboxes
  POD_SANDBOX_SA: prodavan-project-pod
  POD_SANDBOX_IMAGE_PULL_SECRET: ghcr-pull
  POD_SANDBOX_IMAGE: ghcr.io/ne-tort/prodavan-api:latest
  POD_SANDBOX_HYDRATE_IMAGE: ghcr.io/ne-tort/prodavan-api:latest
  # Hydrate is API-mediated (workspace-archive on :8001); no MinIO IAM in sandbox.
  POD_SANDBOX_MINIO_SECRET: ""
  POD_RECONCILE_WORKER_ENABLED: "true"
  # L15 agent-runtime — single container Pod (prodavan-agent-runtime image in GHCR)
  POD_AGENT_RUNTIME_ENABLED: "true"
  POD_AGENT_RUNTIME_AUTH_SECRET: pod-agent-bridge-auth
  POD_AGENT_RUNTIME_IMAGE: ghcr.io/ne-tort/prodavan-agent-runtime:latest
  POD_AGENT_RUNTIME_BOOTSTRAP_ENABLED: "true"
  # CLAW-WEB — web.search provider config (SearxNG self-hosted in search ns).
  # Passed to the agent-runtime container env; the built-in web.search tool
  # reads OPENCLAW_WEB_SEARCH_PROVIDER + OPENCLAW_WEB_SEARCH_URL.
  POD_AGENT_RUNTIME_WEB_SEARCH_PROVIDER: "searxng"
  POD_AGENT_RUNTIME_WEB_SEARCH_URL: "http://searxng.search.svc:8080/search"
  # Platform probe pod — verify AI keys & fetch their model list via agent-runtime.
  # The probe pod runs in prodavan-sandboxes (see sandboxes/probe-pod.yaml).
  POD_PROBE_ENABLED: "true"
  POD_PROBE_BASE_URL: http://prodavan-probe-pod.prodavan-sandboxes.svc:3921
  POD_PROBE_LEASE_TTL_SEC: "120"
  POD_PROBE_TIMEOUT_SEC: "15"
