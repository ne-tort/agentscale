apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-api
  namespace: prodavan
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-web
  namespace: prodavan
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          imagePullPolicy: Always
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prodavan-config
  namespace: prodavan
data:
  STORAGE_ROOT: /data/storage
  PACKS_ROOT: /packages/cabinet-packs
  CORS_ORIGINS: "http://prodavan.local,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8088,http://127.0.0.1:8088"
  RUN_MIGRATIONS: "1"
  API_V1_PREFIX: /api/v1
