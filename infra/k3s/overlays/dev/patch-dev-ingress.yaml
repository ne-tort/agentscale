# Removes the base wildcard HTTPS Ingress in dev.
#
# Dev must not answer on `websecure` for an arbitrary Host: "any public address =
# prod" is the routing contract, so anything that is not agentscale.dev or
# localhost belongs to prod. The base object is the wildcard catch-all; dev
# replaces it with two pinned Ingresses (ingress-https-api.yaml,
# ingress-https-web.yaml) that are added as resources of this overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentscale-https
$patch: delete
