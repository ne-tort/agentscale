apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prodavan
resources:
  - ../../base
  - postgres.yaml
patches:
  - path: patch-dev.yaml
# Local k3d GitOps: pin :local and k3d-import (IfNotPresent).
# Do NOT SHA-pin this overlay unless CI has pushed that digest to GHCR —
# Argo selfHeal will roll ImagePullBackOff and Degrade the app (I12/I18).
images:
  - name: ghcr.io/ne-tort/prodavan-api
    newName: ghcr.io/ne-tort/prodavan-api
    newTag: local
  - name: ghcr.io/ne-tort/prodavan-web
    newName: ghcr.io/ne-tort/prodavan-web
    newTag: local
