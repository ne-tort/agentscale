apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - userdb-init.yaml
  # The dev HTTPS route: two Ingresses so `/api` and `/` can carry different
  # Traefik priorities. See ingress-https-api.yaml for why.
  - ingress-https-api.yaml
  - ingress-https-web.yaml
  - sandboxes
transformers:
  - namespace-transformer.yaml
patches:
  # Один ресурс на файл, намеренно. `kubectl kustomize` из kubectl 1.29 несёт
  # kustomize v5.0.4, который НЕ разбирает много-документный patch-файл
  # («unable to parse SM or JSON patch from [...]» — весь файл уходит в
  # SM-парсер как один документ). Argo рендерит своим, более новым kustomize и
  # такое стерпел бы, но `prodavan-ops validate` — штатная пост-установочная
  # проверка — рендерит именно хостовым kubectl и на этом падал.
  - path: patch-dev-api.yaml
  - path: patch-dev-web.yaml
  - path: patch-dev-celery-worker.yaml
  - path: patch-dev-celery-beat.yaml
  - path: patch-dev-celery-indexer.yaml
  - path: patch-dev-config.yaml
  - path: patch-dev-ingress.yaml
# First-party: movable :latest. IfNotPresent + node image cache survives reboot.
# Kubelet pulls from GHCR via SealedSecret ghcr-pull — no image import.
# Third-party brokers are version-pinned in base/platform + postgres.yaml — not :latest.
# Argo не должен блокировать sync на health-гейтинге волн: неудачный проб
# (например mongodb startupProbe) держал операцию в Running и не давал
# применить НОВУЮ ревизию, которая этот проб чинит (catch-22). skip-health-check
# заставляет Argo считать ресурс Healthy сразу → волны применяются по порядку,
# но без ожидания здоровья. Реальное состояние видно в kubectl/пробах.
commonAnnotations:
  argocd.argoproj.io/skip-health-check: "true"

images:
  - name: ghcr.io/ne-tort/agentscale-api
    newName: ghcr.io/ne-tort/agentscale-api
    newTag: latest
  - name: ghcr.io/ne-tort/agentscale-web
    newName: ghcr.io/ne-tort/agentscale-web
    newTag: latest
