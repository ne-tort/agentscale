# unsetOnly: keep agentscale-dev-sandboxes namespace on resources that already declare it.
# Omit metadata/name on Namespace kind — avoids renaming agentscale-dev-sandboxes → agentscale.
apiVersion: builtin
kind: NamespaceTransformer
metadata:
  name: agentscale-namespace
  namespace: agentscale-dev
unsetOnly: true
fieldSpecs:
  - path: metadata/namespace
    create: true
