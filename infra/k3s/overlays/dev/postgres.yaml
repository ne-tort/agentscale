apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentscale-postgres-data
  namespace: agentscale-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscale-postgres
  namespace: agentscale-dev
  labels:
    app: agentscale-postgres
    app.kubernetes.io/name: agentscale-postgres
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentscale-postgres
  template:
    metadata:
      labels:
        app: agentscale-postgres
        app.kubernetes.io/name: agentscale-postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.15
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: agentscale
            - name: POSTGRES_PASSWORD
              value: agentscale
            - name: POSTGRES_DB
              value: agentscale
            # Official image refuses non-empty mount dir without PGDATA subdir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - pg_ctl stop -D "$PGDATA" -m fast -w || true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agentscale", "-d", "agentscale"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agentscale", "-d", "agentscale"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentscale-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: agentscale-postgres
  namespace: agentscale-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: agentscale-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
