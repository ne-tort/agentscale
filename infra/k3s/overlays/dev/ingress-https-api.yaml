# Dev HTTPS router (websecure/:443): PINNED to the explicit dev hostnames so it
# beats the prod wildcard catch-all (priority 50). Any OTHER Host on :443 — a
# public IP via punnel/VPN (may change), scanners — falls through to prod:
# "any public address = prod". Dev stays reachable via https://agentscale.dev
# and https://localhost (both are in the default cert SAN). Plain-HTTP dev access
# is the web entrypoint (:8088), left as the base wildcard (not patched here) —
# that port is local-only, never the public funnel.
#
# TWO Ingresses on purpose. Traefik turns every path of an Ingress into its own
# router, and `router.priority` is an annotation on the Ingress — so a single
# object gave `/api`, `/health` AND `/` the same priority. With `/` tying `/api`,
# Traefik sent API calls to the web SPA: the site loaded, `/health` answered, and
# every login POST returned the HTML shell. Split by purpose, the API paths keep
# the highest priority and the SPA falls last.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentscale-https-api
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "110"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - agentscale.dev
        - localhost
  rules:
    - host: agentscale.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
    - host: localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
