# PROD contour (namespace: agentscale + agentscale-sandboxes).
#
# Delivery: Argo app agentscale-prod tracks the `prod` BRANCH (not main).
# Promotion = PR main → prod (merge triggers Argo sync of this overlay).
# Images: pinned SHA tags — the promotion PR updates newTag below.
# Bootstrap note: initial tag is :latest; the first prod-branch push pins
# the SHA built by CI Images on main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - userdb-init.yaml
  - web-nodeport.yaml
  - web-https-ip-ingressroute.yaml
  - sandboxes
patches:
  - path: patch-prod.yaml
transformers:
  - namespace-transformer.yaml
# Argo не должен блокировать sync на health-гейтинге волн: неудачный проб
# (например mongodb startupProbe) держал операцию в Running и не давал
# применить НОВУЮ ревизию, которая этот проб чинит (catch-22). skip-health-check
# заставляет Argo считать ресурс Healthy сразу → волны применяются по порядку,
# но без ожидания здоровья. Реальное состояние видно в kubectl/пробах.
commonAnnotations:
  argocd.argoproj.io/skip-health-check: "true"

images:
  - name: ghcr.io/ne-tort/agentscale-api
    newName: ghcr.io/ne-tort/agentscale-api
    newTag: ca6a669c7173
  - name: ghcr.io/ne-tort/agentscale-web
    newName: ghcr.io/ne-tort/agentscale-web
    newTag: ca6a669c7173

# Sandbox-образы в проде НЕ могут быть :latest.
#
# Замер 2026-10-24: POD_SANDBOX_IMAGE, POD_SANDBOX_HYDRATE_IMAGE и
# SANDBOX_K8S_JOB_IMAGE указывали на ghcr.io/ne-tort/agentscale-api:latest.
# Для песочницы это значит, что под, поднятый через час после деплоя, работает
# на другом коде, чем API, который его поднял: :latest двигается каждым мержем в
# main, а API-под — только при промоции. Такое расхождение не воспроизводится и
# не отлаживается.
#
# Значение берём из того же пина, что и Deployment (newTag выше), а не дублируем
# литералом: при следующей промоции достаточно поменять newTag, и ConfigMap
# поедет за ним. Иначе тег пришлось бы править в двух местах и однажды забыть.
replacements:
  - source:
      kind: Deployment
      name: agentscale-api
      fieldPath: spec.template.spec.containers.[name=api].image
    targets:
      - select:
          kind: ConfigMap
          name: agentscale-config
        fieldPaths:
          - data.POD_SANDBOX_IMAGE
          - data.POD_SANDBOX_HYDRATE_IMAGE
          - data.SANDBOX_K8S_JOB_IMAGE
