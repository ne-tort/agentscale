# PROD contour (namespace: agentscale + agentscale-sandboxes).
#
# Delivery: Argo app agentscale-prod tracks the `prod` BRANCH (not main).
# Promotion = PR main → prod (merge triggers Argo sync of this overlay).
# Images: pinned SHA tags — the promotion PR updates newTag below.
# Bootstrap note: initial tag is :latest; the first prod-branch push pins
# the SHA built by CI Images on main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - userdb-init.yaml
  - web-nodeport.yaml
  - web-https-ip-ingressroute.yaml
  - sandboxes
patches:
  - path: patch-prod.yaml
transformers:
  - namespace-transformer.yaml
# Argo не должен блокировать sync на health-гейтинге волн: неудачный проб
# (например mongodb startupProbe) держал операцию в Running и не давал
# применить НОВУЮ ревизию, которая этот проб чинит (catch-22). skip-health-check
# заставляет Argo считать ресурс Healthy сразу → волны применяются по порядку,
# но без ожидания здоровья. Реальное состояние видно в kubectl/пробах.
commonAnnotations:
  argocd.argoproj.io/skip-health-check: "true"

images:
  - name: ghcr.io/ne-tort/agentscale-api
    newName: ghcr.io/ne-tort/agentscale-api
    newTag: 4c144f76138c
  - name: ghcr.io/ne-tort/agentscale-web
    newName: ghcr.io/ne-tort/agentscale-web
    newTag: 4c144f76138c
