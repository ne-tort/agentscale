apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentscale-postgres-data
  namespace: agentscale
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscale-postgres
  namespace: agentscale
  labels:
    app: agentscale-postgres
    app.kubernetes.io/name: agentscale-postgres
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentscale-postgres
  template:
    metadata:
      annotations:
        # This k3s/containerd profile incorrectly stacks unconfined exec
        # children, which blocks postgres signals and breaks crash recovery.
        container.apparmor.security.beta.kubernetes.io/postgres: unconfined
      labels:
        app: agentscale-postgres
        app.kubernetes.io/name: agentscale-postgres
    spec:
      terminationGracePeriodSeconds: 60
      # The root entrypoint re-execs through gosu, which spins at 100% CPU on
      # this host after the 2026-11-21 reboot and never starts postgres.
      # Run as the image's postgres user so the entrypoint takes its non-root
      # path and execs the server directly. Existing PVC files use UID/GID 999.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.15
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: agentscale
            - name: POSTGRES_PASSWORD
              value: agentscale
            - name: POSTGRES_DB
              value: agentscale
            # Official image refuses non-empty mount dir without PGDATA subdir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - pg_ctl stop -D "$PGDATA" -m fast -w || true
          startupProbe:
            # WAL-recovery после грязного shutdown (ребут VM) может идти минуты;
            # без startupProbe liveness (20s) убивал postgres на восстановлении.
            exec:
              command: ["pg_isready", "-U", "agentscale", "-d", "agentscale"]
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agentscale", "-d", "agentscale"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agentscale", "-d", "agentscale"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentscale-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: agentscale-postgres
  namespace: agentscale
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: agentscale-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
