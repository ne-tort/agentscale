# Cross-namespace: e2e Job SA manages project pods in agentscale-dev-sandboxes.
# Self-contained Role (do not depend on dev overlay Role sync).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentscale-e2e-sandbox-pods
  namespace: agentscale-dev-sandboxes
  labels:
    app.kubernetes.io/name: agentscale-e2e-runner
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: e2e
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentscale-e2e-sandbox-pods
  namespace: agentscale-dev-sandboxes
  labels:
    app.kubernetes.io/name: agentscale-e2e-runner
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentscale-e2e-sandbox-pods
subjects:
  - kind: ServiceAccount
    name: agentscale-e2e-runner
    namespace: agentscale-dev
