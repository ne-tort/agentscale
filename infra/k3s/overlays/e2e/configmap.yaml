apiVersion: v1
kind: ConfigMap
metadata:
  name: agentscale-e2e-config
  namespace: agentscale-dev
  labels:
    app.kubernetes.io/name: agentscale-e2e-runner
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: e2e
data:
  DATABASE_URL: postgresql+asyncpg://agentscale:agentscale@agentscale-postgres.agentscale-dev.svc:5432/agentscale_e2e
  AUTH_MODE: test
  AUTH_TEST_SECRET: dev-only-test-secret-change-me
  # The bridge signs a scoped JWT for every Project Pod, and
  # ``pod_identity_bridge_strict`` defaults to true — which means "no explicit
  # secret, refuse the call" rather than "fall back to AUTH_TEST_SECRET". Without
  # this every pod-lifecycle test fails with
  # ``pod bridge signing secret not configured`` before it reaches the cluster.
  # Same value as the dev Secret so a token minted here is accepted there.
  POD_IDENTITY_BRIDGE_SECRET: k3s-dev-pod-bridge-jwt-change-me
  KEYCLOAK_INVITE_MODE: fake
  POD_RUNTIME_MODE: k8s
  POD_SANDBOX_NAMESPACE: agentscale-dev-sandboxes
  POD_SANDBOX_SA: agentscale-project-pod
  POD_K8S_REQUIRED: "true"
  POD_SANDBOX_IMAGE: ghcr.io/ne-tort/agentscale-api:latest
  POD_SANDBOX_HYDRATE_IMAGE: ghcr.io/ne-tort/agentscale-api:latest
  # Where the hydrate initContainer fetches a workspace from. The code default is
  # `http://prodavan-api.prodavan.svc:8001/api/v1` — a Service that does not
  # exist in any contour — so leaving it unset made every sandbox pod die with
  # `Name or service not known`. It must NOT point at the deployed agentscale-api
  # either: that process reads the `agentscale` database, while this Job writes
  # its pod rows to `agentscale_e2e`, so hydrate would answer 404 "pod not found".
  # The Job serves its own pod surface on 8001 (see job.yaml) and this Service
  # (see service.yaml) is how sandbox pods address it.
  POD_AGENT_RUNTIME_API_BASE_URL: http://agentscale-e2e-api.agentscale-dev.svc:8001/api/v1
  # Redis is not optional while the bridge is strict: `bump_pod_bridge_generation`
  # treats a failed `cache_set` as "revocation did not happen" and raises 503, and
  # without a Redis manager `cache_set` always returns False. Every pause / stop /
  # delete / reload path bumps a generation, so the whole pod-lifecycle suite fails
  # on 503 rather than on the behaviour it means to test.
  REDIS_REQUIRED: "true"
  REDIS_URL: redis://agentscale-redis.agentscale-dev.svc:6379/0
  KAFKA_REQUIRED: "false"
  CELERY_ENABLED: "false"
  OBJECT_STORE_REQUIRED: "false"
  TRIGGER_WORKER_ENABLED: "false"
  IDLE_PAUSE_WORKER_ENABLED: "false"
  POD_RECONCILE_WORKER_ENABLED: "false"
  STORAGE_ROOT: /tmp/e2e-storage
  SECRETS_DIR: /tmp/e2e-secrets
  PACKS_ROOT: /packages/cabinet-packs
