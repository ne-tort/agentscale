# Ephemeral pytest runner — synced only via Argo Application prodavan-e2e (manual).
# Re-run: prodavan-ops e2e cleanup && prodavan-ops e2e run --suite k8s
# CI may mount PR conftest + k8s tests via ConfigMaps (copied over image sources below).
apiVersion: batch/v1
kind: Job
metadata:
  name: prodavan-e2e-runner
  namespace: prodavan
  labels:
    app.kubernetes.io/name: prodavan-e2e-runner
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: e2e
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-e2e-runner
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: e2e
    spec:
      serviceAccountName: prodavan-e2e-runner
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: runner
          image: ghcr.io/ne-tort/prodavan-api:latest
          imagePullPolicy: Always
          workingDir: /app
          command:
            - /bin/sh
            - -ec
            - |
              # PR overrides (CI ConfigMaps) — never mount over image paths (empty optional wipe).
              if [ -f /e2e-pr/conftest/conftest.py ]; then
                cp /e2e-pr/conftest/conftest.py /app/tests/e2e/conftest.py
              fi
              if [ -d /e2e-pr/k8s ] && [ "$(ls -A /e2e-pr/k8s 2>/dev/null || true)" ]; then
                cp -a /e2e-pr/k8s/. /app/tests/e2e/k8s/
              fi
              pip install -q pytest pytest-asyncio httpx PyJWT ruff asyncpg
              python - <<'PY'
              import asyncio, asyncpg, os
              url = os.environ.get("PG_ADMIN_URL", "postgresql://prodavan:prodavan@prodavan-postgres.prodavan.svc:5432/postgres")
              async def main():
                  conn = await asyncpg.connect(url)
                  try:
                      await conn.execute("CREATE DATABASE prodavan_e2e")
                  except asyncpg.DuplicateDatabaseError:
                      pass
                  await conn.close()
              asyncio.run(main())
              PY
              alembic upgrade head
              pytest tests/e2e/k8s -m k8s -v --tb=short
          env:
            - name: PG_ADMIN_URL
              value: postgresql://prodavan:prodavan@prodavan-postgres.prodavan.svc:5432/postgres
          envFrom:
            - configMapRef:
                name: prodavan-e2e-config
          volumeMounts:
            - name: e2e-conftest
              mountPath: /e2e-pr/conftest
              readOnly: true
            - name: e2e-k8s-tests
              mountPath: /e2e-pr/k8s
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: e2e-conftest
          configMap:
            name: prodavan-e2e-conftest
            optional: true
        - name: e2e-k8s-tests
          configMap:
            name: prodavan-e2e-k8s-tests
            optional: true
