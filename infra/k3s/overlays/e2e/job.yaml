# Ephemeral pytest runner — synced only via Argo Application agentscale-e2e (manual).
# Re-run: prodavan-ops e2e cleanup && prodavan-ops e2e run --suite k8s
# CI may mount PR conftest + k8s tests via ConfigMaps (copied over image sources below).
apiVersion: batch/v1
kind: Job
metadata:
  name: agentscale-e2e-runner
  namespace: agentscale-dev
  labels:
    app.kubernetes.io/name: agentscale-e2e-runner
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: e2e
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-e2e-runner
        app.kubernetes.io/part-of: agentscale
        app.kubernetes.io/component: e2e
    spec:
      serviceAccountName: agentscale-e2e-runner
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: runner
          image: ghcr.io/ne-tort/agentscale-api:latest
          imagePullPolicy: Always
          workingDir: /app
          command:
            - /bin/sh
            - -ec
            - |
              # PR overrides (CI ConfigMaps) — never mount over image paths (empty optional wipe).
              if [ -f /e2e-pr/conftest/conftest.py ]; then
                cp /e2e-pr/conftest/conftest.py /app/tests/e2e/conftest.py
              fi
              if [ -d /e2e-pr/k8s ] && [ "$(ls -A /e2e-pr/k8s 2>/dev/null || true)" ]; then
                cp -a /e2e-pr/k8s/. /app/tests/e2e/k8s/
              fi
              pip install -q pytest pytest-asyncio httpx PyJWT ruff asyncpg
              python - <<'PY'
              import asyncio, asyncpg, os
              url = os.environ.get("PG_ADMIN_URL", "postgresql://agentscale:agentscale@agentscale-postgres.agentscale-dev.svc:5432/postgres")
              async def main():
                  conn = await asyncpg.connect(url)
                  try:
                      await conn.execute("CREATE DATABASE agentscale_e2e")
                  except asyncpg.DuplicateDatabaseError:
                      pass
                  await conn.close()
              asyncio.run(main())
              PY
              alembic upgrade head
              # Sandbox pods hydrate from a pod surface that must read the SAME
              # database this Job just migrated. The dev API cannot serve them:
              # it is backed by `agentscale`, while the rows below are written to
              # `agentscale_e2e`, so every hydrate answered 404 "pod not found".
              # Serve the pod surface here and advertise it through the
              # agentscale-e2e-api Service (see service.yaml).
              uvicorn prodavan.main_pod:app --host 0.0.0.0 --port 8001 \
                --log-level warning >/tmp/pod-surface.log 2>&1 &
              python - <<'PY'
              import sys, time, urllib.request
              deadline = time.time() + 120
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:8001/health/live", timeout=2):
                          print("pod surface ready")
                          sys.exit(0)
                  except Exception:
                      time.sleep(1)
              print("pod surface did not become ready", file=sys.stderr)
              sys.exit(1)
              PY
              pytest tests/e2e/k8s -m k8s -v --tb=short
          env:
            - name: PG_ADMIN_URL
              value: postgresql://agentscale:agentscale@agentscale-postgres.agentscale-dev.svc:5432/postgres
          envFrom:
            - configMapRef:
                name: agentscale-e2e-config
          ports:
            # Named so service.yaml can target it; the pod surface the sandbox
            # pods hydrate against lives on this port.
            - name: pod-http
              containerPort: 8001
          volumeMounts:
            - name: e2e-conftest
              mountPath: /e2e-pr/conftest
              readOnly: true
            - name: e2e-k8s-tests
              mountPath: /e2e-pr/k8s
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: e2e-conftest
          configMap:
            name: agentscale-e2e-conftest
            optional: true
        - name: e2e-k8s-tests
          configMap:
            name: agentscale-e2e-k8s-tests
            optional: true
