apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-web
  namespace: prodavan
  labels:
    app: prodavan-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prodavan-web
  template:
    metadata:
      labels:
        app: prodavan-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ne-tort/prodavan-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
