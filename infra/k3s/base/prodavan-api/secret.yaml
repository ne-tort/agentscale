# Dev/local secrets — replace before any shared cluster.
# kubectl -n prodavan create secret generic prodavan-api-secrets --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: prodavan-api-secrets
  namespace: prodavan
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://prodavan:prodavan@prodavan-postgres:5432/prodavan
  JWT_SECRET: k3s-dev-change-me-in-production
