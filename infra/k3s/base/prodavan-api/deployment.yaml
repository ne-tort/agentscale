apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-api
  namespace: prodavan
  labels:
    app: prodavan-api
    app.kubernetes.io/name: prodavan-api
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prodavan-api
  template:
    metadata:
      labels:
        app: prodavan-api
        app.kubernetes.io/name: prodavan-api
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prodavan-sandbox
      automountServiceAccountToken: true
      containers:
        - name: api
          image: ghcr.io/ne-tort/prodavan-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: prodavan-config
            - secretRef:
                name: prodavan-api-secrets
          volumeMounts:
            - name: storage
              mountPath: /data/storage
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: prodavan-api-storage
