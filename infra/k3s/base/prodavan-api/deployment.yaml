apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-api
  namespace: prodavan
  labels:
    app: prodavan-api
    app.kubernetes.io/name: prodavan-api
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prodavan-api
  template:
    metadata:
      labels:
        app: prodavan-api
        app.kubernetes.io/name: prodavan-api
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prodavan-api
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: migrate
          image: ghcr.io/ne-tort/prodavan-api:latest
          imagePullPolicy: IfNotPresent
          command: ["./scripts/migrate.sh"]
          envFrom:
            - configMapRef:
                name: prodavan-config
            - secretRef:
                name: prodavan-api-secrets
          volumeMounts:
            - name: storage
              mountPath: /data/storage
      containers:
        - name: api
          image: ghcr.io/ne-tort/prodavan-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - prodavan.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: prodavan-config
            - secretRef:
                name: prodavan-api-secrets
          volumeMounts:
            - name: storage
              mountPath: /data/storage
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        # Pod-only surface for Project Pods (sandbox NetworkPolicy → :8001 only).
        - name: api-pod
          image: ghcr.io/ne-tort/prodavan-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - prodavan.main_pod:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          ports:
            - name: pod-http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: prodavan-config
            - secretRef:
                name: prodavan-api-secrets
          env:
            - name: KAFKA_CONSUMER_ENABLED
              value: "false"
            - name: CELERY_ENABLED
              value: "false"
            - name: TRIGGER_WORKER_ENABLED
              value: "false"
            - name: IDLE_PAUSE_WORKER_ENABLED
              value: "false"
            - name: POD_RECONCILE_WORKER_ENABLED
              value: "false"
          volumeMounts:
            - name: storage
              mountPath: /data/storage
          startupProbe:
            httpGet:
              path: /health/live
              port: pod-http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/live
              port: pod-http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: pod-http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: prodavan-api-storage
