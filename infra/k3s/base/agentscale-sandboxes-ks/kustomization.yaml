apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sandboxtemplate.yaml
  - sandboxwarmpool.yaml
  - rbac-sandboxes.yaml
  - networkpolicy.yaml
  # Bridge auth secret referenced by the SandboxTemplate (BRIDGE_AUTH_TOKEN
  # env, optional). Dev-grade placeholder values — prod overlays must
  # override with real ones (SealedSecret).
  - pod-agent-bridge-auth-secret.yaml
