# RBAC for agent-sandbox era (replaces base/agentscale-sandbox/rbac-sandboxes.yaml).
# Canon: docs/08-migration/agent-sandbox-adr.md (ADR §1.6). The API no longer CRUDs pods directly —
# it writes SandboxClaims and reads/patches Sandboxes (CRs reconciled by the
# agent-sandbox controller). pods/exec is GONE: file/command channel is the router.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentscale-project-pod
  labels:
    app.kubernetes.io/part-of: agentscale
---
# API service account permissions in agentscale-sandboxes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentscale-sandbox-claims
rules:
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxclaims/status"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes", "sandboxes/status"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
# pod reconcile (list_managed_pods) и cleanup (delete_pod) ходят в core API
# песочничного ns напрямую — без этого reconcile падает с 403 (pods is forbidden)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentscale-sandbox-claims
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentscale-sandbox-claims
subjects:
# CAUTION: the subject namespace MUST be set by each overlay (dev: agentscale-dev,
# prod: agentscale). Without it the subject resolves to this RoleBinding's own
# namespace — the sandboxes namespace, where no agentscale-api SA exists — and
# the API loses all sandboxclaims/sandboxes RBAC (launch 403, delete 500).
- kind: ServiceAccount
  name: agentscale-api
