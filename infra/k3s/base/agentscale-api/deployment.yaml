apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscale-api
  labels:
    app: agentscale-api
    app.kubernetes.io/name: agentscale-api
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  # `Recreate` guarantees a window with zero ready pods on every deploy, and
  # Traefik reacts badly to it: it rebuilds its config while the Service has no
  # endpoints, drops the paths that point at it, and does not re-add them until
  # the Ingress itself changes. The symptom is not a 503 — `agentscale.dev`
  # keeps serving the SPA while `POST /api/v1/auth/login` falls through to the
  # web container, which answers 405, so the login page renders and cannot log
  # in. That is how it looked in production for the better part of an hour.
  #
  # Mirroring the old pod before removing it keeps endpoints non-empty. The
  # migration initContainer runs in both pods during the overlap; Alembic takes a
  # lock, so the second one waits rather than racing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agentscale-api
  template:
    metadata:
      labels:
        app: agentscale-api
        app.kubernetes.io/name: agentscale-api
        app.kubernetes.io/part-of: agentscale
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agentscale-api
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: migrate
          image: ghcr.io/ne-tort/agentscale-api:latest
          imagePullPolicy: IfNotPresent
          command: ["./scripts/migrate.sh"]
          envFrom:
            - configMapRef:
                name: agentscale-config
            - secretRef:
                name: agentscale-api-secrets
            - secretRef:
                name: agentscale-b2b-secrets
                optional: true
          volumeMounts:
            - name: storage
              mountPath: /data/storage
      containers:
        - name: api
          image: ghcr.io/ne-tort/agentscale-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - prodavan.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentscale-config
            - secretRef:
                name: agentscale-api-secrets
            - secretRef:
                name: agentscale-b2b-secrets
                optional: true
          # Plugin object storage (дизайн v4 §5.4): ДВА РАЗНЫХ principal.
          # admin создаёт бакеты/политики, presigner подписывает URL узкой
          # политикой только на tenant-*/module-* (иначе presigned унаследовал
          # бы agentscale/* от общего service user). Fallback на root/S3_*
          # из configmap ЗАПРЕЩЁН — config.py fail-closed без обеих пар.
          # Dev-значения создаёт Job plugin-buckets-init.yaml; для shared
          # контура заменить на SealedSecret и убрать optional (переменные
          # обязательны, иначе платформа должна упасть, а не работать без них).
          env:
            - name: PLUGIN_MINIO_ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio-plugin-admin
                  key: access-key
                  optional: true
            - name: PLUGIN_MINIO_ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio-plugin-admin
                  key: secret-key
                  optional: true
            - name: PLUGIN_MINIO_PRESIGN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio-plugin-presigner
                  key: access-key
                  optional: true
            - name: PLUGIN_MINIO_PRESIGN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio-plugin-presigner
                  key: secret-key
                  optional: true
          volumeMounts:
            - name: storage
              mountPath: /data/storage
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            # /health/ready бьёт в БД + redis + lifespan health_report — на
            # холодной/загруженной ноде дольше дефолтной 1с (на prod это давало
            # вечный «context deadline exceeded» при 200 на /health/live).
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        # Pod-only surface for Project Pods (sandbox NetworkPolicy → :8001 only).
        - name: api-pod
          image: ghcr.io/ne-tort/agentscale-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - prodavan.main_pod:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          ports:
            - name: pod-http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: agentscale-config
            - secretRef:
                name: agentscale-api-secrets
            - secretRef:
                name: agentscale-b2b-secrets
                optional: true
          env:
            - name: KAFKA_CONSUMER_ENABLED
              value: "false"
            - name: CELERY_ENABLED
              value: "false"
            - name: TRIGGER_WORKER_ENABLED
              value: "false"
            - name: IDLE_PAUSE_WORKER_ENABLED
              value: "false"
            - name: POD_RECONCILE_WORKER_ENABLED
              value: "false"
            - name: METRICS_STORAGE_SAMPLER_ENABLED
              value: "false"
          volumeMounts:
            - name: storage
              mountPath: /data/storage
          startupProbe:
            httpGet:
              path: /health/live
              port: pod-http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/live
              port: pod-http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: pod-http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: agentscale-api-storage
