apiVersion: v1
kind: Service
metadata:
  name: agentscale-api
  labels:
    app: agentscale-api
spec:
  type: ClusterIP
  selector:
    app: agentscale-api
  ports:
    - name: http
      port: 8000
      targetPort: http
    # Sandbox NetworkPolicy targets this port only (Pod Identity Bridge surface).
    - name: pod-http
      port: 8001
      targetPort: pod-http
