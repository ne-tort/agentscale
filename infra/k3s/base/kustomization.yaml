apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform
  # Защита узла от OOM: потолки памяти для namespace приложения.
  - guards/app-budget.yaml
  - agentscale-api/configmap.yaml
  - agentscale-api/secret.yaml
  - agentscale-api/pvc.yaml
  - agentscale-api/deployment.yaml
  - agentscale-api/service.yaml
  - agentscale-web/deployment.yaml
  - agentscale-web/service.yaml
  # Plugin-платформа (дизайн v4): всегда-running инфраструктура — отдельный
  # tenant-PostgreSQL (НЕ prodavan), PgBouncer, Plugin Gateway, egress-proxy и
  # NetworkPolicy. Живёт здесь, в основном agentscale-dev Application.
  # Динамические Deployment'ы плагинов и plugins-gateway Ingress НЕ здесь: они
  # ведутся отдельным Argo Application plugin-platform.yaml (overlays/dev/plugins)
  # с ignoreDifferences на /spec/replicas. Двойного владения нет.
  - plugins
  # agentscale-sandbox/rbac.yaml removed (Wave 4): legacy SA + batch/Jobs Role — dead path.
  # Only the agentscale-api ServiceAccount remains (see agentscale-sandbox/rbac-api.yaml).
  - agentscale-sandbox/rbac-api.yaml
  - ingress.yaml
# Deferred: mcp-gateway, per-project isolator spawn, agent-worker
# (I8: SA on API + Job PVC probe; create path remains object-ws)
