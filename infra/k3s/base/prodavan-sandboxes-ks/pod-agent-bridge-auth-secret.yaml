# Bridge auth shared by API → sandbox calls. Moved from
# overlays/dev/sandboxes to base: the SandboxTemplate (BRIDGE_AUTH_TOKEN env,
# optional secretKeyRef) lives in this layer, so the referenced secret must
# live here too. Also referenced by the API via POD_AGENT_RUNTIME_AUTH_SECRET.
# Dev-grade placeholder values — prod overlays must override (SealedSecret).
apiVersion: v1
kind: Secret
metadata:
  name: pod-agent-bridge-auth
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: agent-bridge
type: Opaque
stringData:
  token: k3s-dev-bridge-change-me
  bridge-token: k3s-dev-bridge-change-me
