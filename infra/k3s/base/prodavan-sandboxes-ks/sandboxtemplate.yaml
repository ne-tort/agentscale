# SandboxTemplate — canonical pod blueprint for prodavan agent sandboxes.
# Canon: docs/08-migration/agent-sandbox-adr.md (ADR §1.4, SandboxTemplate).
# Per-project customization goes through claim LABELS only (post-Ready inject);
# env/VCT in claims are loudly rejected (Disallowed) to keep warm-pool adoption
# sub-second (ADR §1.4: envVarsInjectionPolicy/volumeClaimTemplatesPolicy Disallowed).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: prodavan-agent
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/part-of: prodavan
    prodavan.io/managed-by: agent-sandbox
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: project-pod
        prodavan.io/managed-by: agent-sandbox
    spec:
      serviceAccountName: prodavan-project-pod
      automountServiceAccountToken: false
      # agent-runtime is non-root by design (Dockerfile.bun in prodavan-claw:
      # `USER node`, uid 1000, /workspace and /app chown'ed node:node) —
      # enforce at pod level. fsGroup makes kubelet chown the root-owned
      # local-path PVC dir to the node group so /workspace stays writable;
      # warm-pool pods render this same template, so they inherit the context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Runtime image is private on ghcr — pull via the dev overlay ghcr-pull secret.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
      - name: agent-runtime
        # Versioned tag — bumped by PR when prodavan-claw image is rebuilt.
        # TODO: keep in sync with ghcr.io/ne-tort/prodavan-agent-runtime releases.
        image: ghcr.io/ne-tort/prodavan-agent-runtime:c01dbd48d83c # prodavan-claw@c01dbd4 (subagent MCP profiles: canonical mcp.openclaw.* names, default profile = inherit parent pool incl. MCP; legacy bare names normalized)
        imagePullPolicy: IfNotPresent
        # Static platform env — claims cannot carry env
        # (envVarsInjectionPolicy: Disallowed), so all boot-time config lives
        # here. Per-project values (PRODAVAN_PROJECT_ID, PRODAVAN_POD_ID,
        # WORKSPACE_KEY, PROJECT_ID, PRODAVAN_AUTH_TOKEN) are delivered
        # post-Ready over HTTP (bind step) — MIGRATION-DECISIONS §1.8.
        env:
        - name: WORKSPACE_ROOT
          value: /workspace
        - name: OPENCLAW_DATA_DIR
          value: /workspace/.openclaw-data
        - name: OPENCLAW_SESSION_MAP_PATH
          value: /workspace/.openclaw-data/session-map.json
        - name: PRODAVAN_API_BASE_URL
          value: http://prodavan-api.prodavan.svc:8001/api/v1
        - name: PRODAVAN_EVENTS_WRITE
          value: "1"
        - name: PORT
          value: "3921"
        # Web search is proxied through the Prodavan API (dev default).
        - name: OPENCLAW_WEB_SEARCH_PROVIDER
          value: prodavan_api
        # Optional bridge token for API → agent calls (secret in this namespace).
        - name: BRIDGE_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: pod-agent-bridge-auth
              key: bridge-token
              optional: true
        ports:
        - name: http
          containerPort: 3921
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi
  service: true
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  networkPolicyManagement: Unmanaged
