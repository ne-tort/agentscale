# Traefik Ingress — no host filter so http://localhost:8088/ works from Windows/WSL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prodavan
  namespace: prodavan
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: prodavan-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: prodavan-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prodavan-web
                port:
                  number: 80
