# Agentscale ingress — HTTP (web) and HTTPS (websecure) routers.
#
# Base = WILDCARD (no host filter). The two contours differentiate in overlays:
#  - websecure (:443, the public entrypoint via punnel/VPN): PROD keeps the
#    wildcard (catch-all, priority 50) so ANY Host — including a public IP that
#    may change — lands on prod; DEV pins agentscale.dev/localhost at priority
#    100 (patch-dev.yaml). Net rule: "any public address = prod", dev only via
#    its explicit names. Routing never hardcodes the public IP.
#  - web (:8088, local plain-HTTP): DEV keeps the wildcard (local dev access);
#    PROD pins agentscale.local (patch-prod.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentscale
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentscale-web
                port:
                  number: 80
---
# HTTPS router — websecure entrypoint. TLS uses the Traefik default certificate
# from the default TLSStore (kube-system/agentscale-tls, self-signed; SANs cover
# the VM IP + agentscale.dev/.local/localhost). Wildcard SNI (tls: [{}]) serves
# it for any Host. PROD keeps this wildcard (public catch-all, priority 50);
# DEV pins agentscale.dev/localhost at priority 100 — see the overlay patches.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentscale-https
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    # No hosts → wildcard SNI; Traefik serves the default cert for any Host.
    - {}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: agentscale-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentscale-web
                port:
                  number: 80
