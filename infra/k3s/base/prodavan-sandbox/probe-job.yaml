# Applied by verify_sandbox_job.sh (not in kustomization — Jobs are ephemeral).
# Keep in sync with pvc_probe_job_body() in apps/api/.../infrastructure/k8s/sandbox_jobs.py
apiVersion: batch/v1
kind: Job
metadata:
  name: prodavan-sandbox-probe
  namespace: prodavan
  labels:
    app.kubernetes.io/name: prodavan-sandbox-probe
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox-probe
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 1
  activeDeadlineSeconds: 90
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-sandbox-probe
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: sandbox-probe
    spec:
      serviceAccountName: prodavan-sandbox
      restartPolicy: Never
      containers:
        - name: probe
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, pathlib
              root = pathlib.Path("/data/storage")
              assert root.is_dir(), root
              projects = root / "projects"
              print("ok pvc", root, "projects_exists", projects.is_dir())
          volumeMounts:
            - name: storage
              mountPath: /data/storage
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: prodavan-api-storage
