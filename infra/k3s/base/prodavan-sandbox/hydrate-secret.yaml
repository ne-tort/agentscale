# Optional: MinIO credentials for sandbox Pod initContainer hydrate.
# Populate via sealed-secrets / external-secrets in dev overlay.
apiVersion: v1
kind: Secret
metadata:
  name: prodavan-minio-hydrate
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox-hydrate
type: Opaque
stringData:
  access-key: "CHANGE_ME"
  secret-key: "CHANGE_ME"
  endpoint: "http://prodavan-minio.prodavan.svc:9000"
  bucket: "prodavan"
