apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-sandbox-egress
  namespace: prodavan-sandboxes
  labels:
    app.kubernetes.io/name: prodavan-sandboxes
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
spec:
  podSelector:
    matchLabels:
      prodavan.io/managed-by: pod-service
  policyTypes:
    - Egress
  egress:
    # Hydrate initContainer → in-cluster MinIO + platform API.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodavan
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8000
    # DNS (kube-dns + upstream resolvers).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # AI provider APIs and public internet (Cursor, Anthropic, OpenAI, …).
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
