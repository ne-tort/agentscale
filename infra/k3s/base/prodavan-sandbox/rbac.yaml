# I8: SA for optional PVC probe Job (namespace prodavan).
# Pod lifecycle RBAC lives in prodavan-sandboxes — see rbac-sandboxes.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prodavan-sandbox
  labels:
    app.kubernetes.io/name: prodavan-sandbox
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prodavan-sandbox
  labels:
    app.kubernetes.io/name: prodavan-sandbox
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prodavan-sandbox
  labels:
    app.kubernetes.io/name: prodavan-sandbox
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prodavan-sandbox
subjects:
  - kind: ServiceAccount
    name: prodavan-sandbox
