# I8 slice 1–2: SA for Job isolator + API in-cluster token.
# API uses this SA but SANDBOX_K8S_JOBS=false — create path stays object-ws.
# verify_sandbox_job.sh / POST /admin/projects/sandbox-k8s/pvc-probe prove PVC mount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prodavan-sandbox
  labels:
    app.kubernetes.io/name: prodavan-sandbox
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prodavan-sandbox
  labels:
    app.kubernetes.io/name: prodavan-sandbox
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prodavan-sandbox
  labels:
    app.kubernetes.io/name: prodavan-sandbox
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prodavan-sandbox
subjects:
  - kind: ServiceAccount
    name: prodavan-sandbox
