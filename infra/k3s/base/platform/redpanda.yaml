# Node config for Redpanda. Cluster knobs (write caching, auto-create topics)
# are set by the init Job via Admin API — do not pin them here.
#
# Do not use `rpk redpanda start --check=false`: it enables Seastar fsync bypass.
# STS execs libexec with --unsafe-bypass-fsync=false instead.
redpanda:
  data_directory: /var/lib/redpanda/data
  node_id: 0
  empty_seed_starts_cluster: true
  seed_servers: []
  developer_mode: false
  rpc_server:
    address: 0.0.0.0
    port: 33145
  advertised_rpc_api:
    address: prodavan-kafka-0.prodavan-kafka.prodavan.svc.cluster.local
    port: 33145
  kafka_api:
    - address: 0.0.0.0
      port: 9092
      name: internal
  advertised_kafka_api:
    - address: prodavan-kafka-0.prodavan-kafka.prodavan.svc.cluster.local
      port: 9092
      name: internal
  admin:
    - address: 0.0.0.0
      port: 9644
rpk:
  overprovisioned: true
  kafka_api:
    brokers:
      - 127.0.0.1:9092
  admin_api:
    addresses:
      - 127.0.0.1:9644
pandaproxy: {}
schema_registry: {}
