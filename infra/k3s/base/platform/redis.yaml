# Redis — C-CACHE + Celery broker (P0). AOF for reboot durability.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prodavan-redis-data
  labels:
    app.kubernetes.io/name: prodavan-redis
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prodavan-redis
  labels:
    app.kubernetes.io/name: prodavan-redis
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: prodavan-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prodavan-redis
  labels:
    app.kubernetes.io/name: prodavan-redis
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: redis
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: prodavan-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-redis
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - "60"
            - "1"
            - --dir
            - /data
            # Celery broker: never evict task keys. Cap below the 256Mi limit.
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - noeviction
            - --tcp-keepalive
            - "60"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          lifecycle:
            preStop:
              exec:
                command: ["redis-cli", "SHUTDOWN", "SAVE"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prodavan-redis-data
