# Redis — C-CACHE + Celery broker (P0). AOF for reboot durability.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentscale-redis-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: agentscale-redis
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentscale-redis
  labels:
    app.kubernetes.io/name: agentscale-redis
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: agentscale-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentscale-redis
  labels:
    app.kubernetes.io/name: agentscale-redis
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: redis
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: agentscale-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentscale-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-redis
        app.kubernetes.io/part-of: agentscale
        app.kubernetes.io/component: redis
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Self-heal AOF after unclean shutdown (node reboot / hard kill): a
        # truncated appendonly manifest otherwise keeps redis in
        # CrashLoopBackOff forever and cascades into agentscale-api startup
        # failure (redis ConnectionError at lifespan startup). Declarative
        # repair in-pod (canon: state fixed by init containers, not hosts).
        - name: aof-repair
          image: redis:7.4.11-alpine
          command:
            - sh
            - -c
            - |
              set -e
              manifest=/data/appendonlydir/appendonly.aof.manifest
              [ -f "$manifest" ] || exit 0
              if ! redis-check-aof "$manifest" >/dev/null 2>&1; then
                echo "AOF corrupt - repairing (truncates to last valid prefix)"
                cp -a /data/appendonlydir /data/appendonlydir.bak.$(date +%s) || true
                printf 'y\n' | redis-check-aof --fix "$manifest" || true
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - "60"
            - "1"
            - --dir
            - /data
            # Celery broker: never evict task keys. Cap below the 256Mi limit.
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - noeviction
            - --tcp-keepalive
            - "60"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          lifecycle:
            preStop:
              exec:
                command: ["redis-cli", "SHUTDOWN", "SAVE"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentscale-redis-data
