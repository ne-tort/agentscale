# Single-replica local: refuse voluntary eviction so PVC brokers are not drained mid-write.
# Node reboot still SIGTERM's the node — preStop + PVC cover that path (I14).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentscale-kafka
  labels:
    app.kubernetes.io/name: agentscale-kafka
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: kafka
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentscale-kafka
---
