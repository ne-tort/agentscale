# Инициализация топиков событий ПЛАГИНОВ (задача network-alignment, v4 §7.3).
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ JOB, А НЕ ПРАВКА kafka.yaml
# --------------------------------------------
# `infra/k3s/base/platform/kafka.yaml:210-218` init-Job `agentscale-kafka-init`
# создаёт РОВНО 9 платформенных топиков. Топиков `agentscale.plugin.events` и
# `agentscale.plugin.events.dlq` там НЕТ. При этом `kafka.yaml:221` выставляет
# `auto_create_topics_enabled=false`: при первом produce топик НЕ появится сам,
# публикация событий плагинов упадёт (задача 10,
# `apps/api/src/prodavan/application/plugins/events/topics.py:3-8,155-251`
# явно требует `ensure_topic` до первой отправки — fail-closed).
#
# `kafka.yaml` ведёт ДРУГАЯ задача и он НЕ входит в зону правки этого задания:
# правка уже применённого init-Job'а с `hook-delete-policy: BeforeHookCreation`
# была бы гонкой с порядком sync и изменила бы платформенный контракт.
# Отдельный Job идемпотентен (`rpk topic create ... || true` + явная проверка
# существования после create), не трогает 9 существующих топиков и не меняет
# cluster config. Два Sync-хука одной wave 5 с РАЗНЫМИ именами и разными
# `hook-delete-policy` не конфликтуют (у каждого свой Pod).
#
# ИМЕНА ТОПИКОВ — единственный источник истины:
#   `apps/api/src/prodavan/application/plugins/events/topics.py:35`
#     PLUGIN_EVENTS_TOPIC = "agentscale.plugin.events"
#   `topics.py:39` PLUGIN_DLQ_SUFFIX = ".dlq"
#   => DLQ = "agentscale.plugin.events.dlq" (суффикс РОВНО ОДИН РАЗ,
#      `topics.py:107-120` запрещает `.dlq.dlq` как цикл).
#
# ПАРАМЕТРЫ: `-p 1 -r 1` (topics.py:41-45, DEFAULT_NUM_PARTITIONS=1,
# DEFAULT_REPLICATION_FACTOR=1; single-node Redpanda в kafka.yaml:49 replicas: 1
# — RF>1 дал бы under-replicated топик и остановил продюсер с acks=all).
# `cleanup.policy=delete` + `retention.ms=604800000` (7 суток) согласованы с
# `kafka.yaml:226` (log_retention_ms) и `kafka.yaml:233` (cleanup.policy=delete).
# `min.insync.replicas=1` — обязательно при RF=1 и acks=all (kafka.yaml:228,234).
#
# FAIL-CLOSED: `set -eu`, ожидание брокера и Admin API с ограничением попыток,
# `|| true` ТОЛЬКО на `rpk topic create` (топик уже мог существовать — это не
# ошибка) и на `grep -c` (0 совпадений не должен рвать set -e раньше явной
# проверки), но ПОСЛЕ create — обязательная проверка `rpk topic list` для КАЖДОГО
# топика. Нет топика после create -> `exit 1` -> Job Failed -> Argo Sync хучит,
# платформа НЕ считается готовой. Никакого «ну ладно, авось создастся».
#
# WHITELIST: kind `Job` (group `batch`) разрешён
# `infra/argocd/apps/00-project.yaml:62-63`. Namespace в destinations
# `00-project.yaml:23-26`. CRD/новых kinds НЕ вводим.
#
# ПОДКЛЮЧЕНИЕ (делает РОДИТЕЛЬ, не этот файл):
#   `infra/k3s/base/platform/kustomization.yaml` -> `resources: - plugin-topics-init.yaml`
#   Поле `metadata.namespace` намеренно НЕ задано: подставляет NamespaceTransformer
#   оверлея (паттерн kafka.yaml и egress-proxy.yaml).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agentscale-plugin-topics-init
  labels:
    app.kubernetes.io/name: agentscale-plugin-topics-init
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: plugin-topics-init
  annotations:
    # Тот же Sync-хук и та же wave, что у `agentscale-kafka-init`
    # (kafka.yaml:164,170): init-Job работает ПОСЛЕ волн 0..4, когда StatefulSet
    # Redpanda и его Service уже засинхронизированы.
    argocd.argoproj.io/hook: Sync
    # HookSucceeded убирает успешный Job и не плодит OrphanedResourceWarning
    # (AppProject `orphanedResources.warn: true`, 00-project.yaml:90-103).
    # BeforeHookCreation удаляет прошлую попытку перед новой.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-plugin-topics-init
        app.kubernetes.io/part-of: agentscale
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: rpk
          # Тот же образ и тот же pull-secret, что у kafka.yaml:185: rpk уже
          # есть в образе, второй билд/реестр не нужен.
          image: ghcr.io/ne-tort/redpanda:v24.2.4
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              BROKERS=agentscale-kafka:9092
              ADMIN=agentscale-kafka-0.agentscale-kafka:9644

              # 1) Ждём Kafka API. Ограничение попыток -> fail-closed, не «вечный
              #    ретрай, который в итоге засинхронизируется без топиков».
              i=0
              until rpk cluster info -X brokers=$BROKERS; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then
                  echo "FAIL: Kafka API $BROKERS недоступен" >&2
                  exit 1
                fi
                sleep 2
              done

              # 2) Ждём Admin API :9644 (cluster info на :9092 может подняться
              #    раньше advertised hostname / admin.hosts — kafka.yaml:199-209).
              j=0
              until rpk cluster config get write_caching_default -X brokers=$BROKERS -X admin.hosts=$ADMIN >/dev/null 2>&1; do
                j=$((j+1))
                if [ "$j" -gt 60 ]; then
                  echo "FAIL: Admin API $ADMIN недоступен" >&2
                  exit 1
                fi
                sleep 2
              done

              # 3) РОВНО ДВА топика (задача 10, topics.py:35,39). Ни одного
              #    лишнего create: 9 платформенных топиков ведёт kafka.yaml.
              #    `-p 1` = partitions, `-r 1` = replication factor.
              #    `|| true` допустим здесь (повторный синк) и на `grep -c` ниже;
              #    обязательная проверка факта идёт после create.
              rpk topic create agentscale.plugin.events -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.plugin.events.dlq -p 1 -r 1 -X brokers=$BROKERS || true

              # 4) Конфигурация топиков: delete + 7 суток + min.insync.replicas=1.
              #    Согласовано с kafka.yaml:226,229-235. Ошибка alter-config =
              #    ошибка Job (set -eu): НЕ оставляем топик с дефолтным retention.
              for t in agentscale.plugin.events agentscale.plugin.events.dlq; do
                rpk topic alter-config "$t" \
                  --set cleanup.policy=delete \
                  --set retention.ms=604800000 \
                  --set min.insync.replicas=1 \
                  -X brokers=$BROKERS
              done

              # 5) FAIL-CLOSED проверка ПОСЛЕ create: для КАЖДОГО топика
              #    убеждаемся, что он реально существует в списке. create_topic
              #    мог «успешно» ничего не сделать (гонка/очередь админ-операций),
              #    а auto_create_topics_enabled=false не спасёт при первом produce
              #    (topics.py:234-250 — та же логика повторной проверки).
              #
              #    `rpk topic list` печатает ТАБЛИЦУ (`NAME PARTITIONS REPLICAS`),
              #    а не просто имена: `grep -qx "$t"` всегда промахивался бы и
              #    Job уходил в CrashLoopBackOff даже при созданных топиках.
              #    Берём первый столбец через awk и сравниваем точную строку.
              topics=$(rpk topic list -X brokers=$BROKERS | awk 'NR > 1 { print $1 }')
              for t in agentscale.plugin.events agentscale.plugin.events.dlq; do
                printf '%s\n' "$topics" | grep -Fxq "$t" || {
                  echo "FAIL: топик $t отсутствует после create; публикация событий плагинов запрещена" >&2
                  exit 1
                }
              done

              # 6) Явная фиксация: ровно 2 топика, DLQ-суффикс ОДИН раз.
              #    Список имён задан литералами, а не вычислением из переменной с
              #    уже добавленным `.dlq`: исключаем `.dlq.dlq` (topics.py:110-120).
              matched=$(printf '%s\n' "$topics" | grep -Ec '^agentscale\.plugin\.events(\.dlq)?$' || true)
              if [ "$matched" -ne 2 ]; then
                echo "FAIL: ожидалось ровно 2 топика плагинов, найдено $matched" >&2
                exit 1
              fi

              echo "OK: agentscale.plugin.events + agentscale.plugin.events.dlq созданы (p=1 r=1, delete, 7d)"
