# MongoDB — Document Store BC (non-relational app data).
# Sandbox NetworkPolicy must NOT allow egress to :27017.
apiVersion: v1
kind: Secret
metadata:
  name: agentscale-mongodb
  labels:
    app.kubernetes.io/name: agentscale-mongodb
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: mongodb
stringData:
  root-user: root
  root-password: agentscale-mongo-root
  app-user: agentscale
  app-password: agentscale
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentscale-mongodb-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: agentscale-mongodb
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentscale-mongodb
  labels:
    app.kubernetes.io/name: agentscale-mongodb
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: mongodb
spec:
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app.kubernetes.io/name: agentscale-mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentscale-mongodb
  labels:
    app.kubernetes.io/name: agentscale-mongodb
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: mongodb
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: agentscale-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentscale-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-mongodb
        app.kubernetes.io/part-of: agentscale
        app.kubernetes.io/component: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mongodb
          image: mongo:7.0.14
          args:
            - --bind_ip_all
            - --auth
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agentscale-mongodb
                  key: root-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentscale-mongodb
                  key: root-password
            - name: MONGO_INITDB_DATABASE
              value: agentscale
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  mongosh --quiet \
                    -u "$MONGO_INITDB_ROOT_USERNAME" \
                    -p "$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  mongosh --quiet \
                    -u "$MONGO_INITDB_ROOT_USERNAME" \
                    -p "$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval "db.adminCommand('ping')"
            initialDelaySeconds: 40
            periodSeconds: 20
            # mongosh-ping на нагруженной ноде бывает дольше секунды —
            # дефолдный timeout=1s ронял под по liveness (6+ рестартов)
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentscale-mongodb-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agentscale-mongodb-init
  labels:
    app.kubernetes.io/name: agentscale-mongodb-init
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: mongodb-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "9"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-mongodb-init
        app.kubernetes.io/part-of: agentscale
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongosh
          image: mongo:7.0.14
          env:
            - name: MONGO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: agentscale-mongodb
                  key: root-user
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentscale-mongodb
                  key: root-password
            - name: MONGO_APP_USER
              valueFrom:
                secretKeyRef:
                  name: agentscale-mongodb
                  key: app-user
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentscale-mongodb
                  key: app-password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until mongosh --host agentscale-mongodb --quiet \
                -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin \
                --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then echo "mongodb not ready"; exit 1; fi
                sleep 2
              done
              mongosh --host agentscale-mongodb --quiet \
                -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin \
                --eval "
                  const user = '$MONGO_APP_USER';
                  const pass = '$MONGO_APP_PASSWORD';
                  const admin = db.getSiblingDB('admin');
                  const existing = admin.getUser(user);
                  const roles = [
                    { role: 'readWrite', db: 'agentscale' },
                    { role: 'dbAdmin', db: 'agentscale' }
                  ];
                  if (!existing) {
                    admin.createUser({ user: user, pwd: pass, roles: roles });
                    print('mongodb-init: created app user ' + user);
                  } else {
                    admin.updateUser(user, { pwd: pass, roles: roles });
                    print('mongodb-init: updated app user ' + user);
                  }
                  db.getSiblingDB('agentscale').runCommand({ ping: 1 });
                  print('mongodb-init: ok');
                "
