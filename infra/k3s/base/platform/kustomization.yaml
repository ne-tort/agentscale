apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - redis.yaml
  - minio.yaml
  - mongodb.yaml
  - opensearch.yaml
  - kafka.yaml
  - celery.yaml
  - keycloak.yaml
  - searchnet.yaml
  - gotenberg.yaml
  - pdb.yaml
  # Plugin-платформа (дизайн v4 §5.4): bootstrap service user с политикой,
  # ограниченной tenant-* бакетами. job монтирует configmap ниже.
  - plugin-buckets-init.yaml
  # Топики agentscale.plugin.events + .dlq: auto_create_topics_enabled=false
  # в kafka.yaml, поэтому создаёт отдельный init Job.
  - plugin-topics-init.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: agentscale-kafka-config
    files:
      - redpanda.yaml
  - name: agentscale-minio-api-policy
    files:
      - minio-api-policy.json
  # НЕ редактируем существующую minio-api-policy.json (у service user всё ещё
  # agentscale/*). Плагиновый admin получает отдельную политику только на
  # tenant-* — задача MinIO IAM адаптера.
  - name: agentscale-minio-plugin-policy
    files:
      - plugin-minio-policy.json
  - name: agentscale-keycloak-realm
    files:
      - realm-agentscale.json
