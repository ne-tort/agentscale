# Redpanda (Kafka API) — C-EVENT-BUS (P0).
#
# Local/single-node pattern (k3d):
# - StatefulSet + PVC so topic data survives pod/node reboot
# - Do NOT use --mode dev-container (bundles --unsafe-bypass-fsync → data loss on crash)
# - Do NOT use fictional --mode empty (rpk only documents: help / dev-container)
# - Explicit overprovisioned + check=false for shared k3d CPU; still fsyncs (durable enough for local)
# - API KafkaManager also ensure_topics on startup; init Job is belt-and-suspenders
#
# Prod HA needs ≥3 brokers + anti-affinity + no overprovisioned — hole (Helm/operator).
---
apiVersion: v1
kind: Service
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/name: prodavan-kafka
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  # Headless so pod DNS prodavan-kafka-0.prodavan-kafka resolves (StatefulSet).
  clusterIP: None
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app.kubernetes.io/name: prodavan-kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/name: prodavan-kafka
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  serviceName: prodavan-kafka
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-kafka
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: kafka
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          args:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://prodavan-kafka-0.prodavan-kafka.prodavan.svc.cluster.local:9092
            - --rpc-addr
            - 0.0.0.0:33145
            - --advertise-rpc-addr
            - prodavan-kafka-0.prodavan-kafka.prodavan.svc.cluster.local:33145
            # No --mode: avoid unsafe_bypass_fsync from dev-container while keeping local flags:
            - --smp
            - "1"
            - --memory
            - 1G
            - --overprovisioned
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --check=false
            - --default-log-level=warn
          ports:
            - name: kafka
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: prodavan-kafka
          app.kubernetes.io/part-of: prodavan
          app.kubernetes.io/component: kafka
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prodavan-kafka-init
  labels:
    app.kubernetes.io/name: prodavan-kafka-init
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka-init
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-kafka-init
        app.kubernetes.io/part-of: prodavan
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until rpk cluster info -X brokers=prodavan-kafka:9092; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then exit 1; fi
                sleep 2
              done
              rpk topic create prodavan.platform.events -X brokers=prodavan-kafka:9092 || true
              rpk topic create prodavan.project.triggers -X brokers=prodavan-kafka:9092 || true
