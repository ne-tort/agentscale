# Redpanda (Kafka API) — C-EVENT-BUS (P0).
#
# Local/single-node pattern (k3s):
# - StatefulSet + PVC so topic data survives pod/node reboot
# - Do NOT use `rpk redpanda start --check=false` / `--mode dev-container`: both end up
#   passing --unsafe-bypass-fsync=true (data loss on crash). Exec the binary instead.
# - Do NOT use fictional --mode empty (rpk only documents: help / dev-container)
# - overprovisioned + no rpk syschecks; developer_mode:false in ConfigMap
# - Single-node empty_seed_starts_cluster=true so the STS can form a cluster;
#   HA (I9) must set it false + identical seed_servers
# - write_caching_default=false + internal_topic_replication_factor=1 via init Job (Admin API :9644)
# - API KafkaManager also ensure_topics on startup; init Job is belt-and-suspenders
#
# Prod HA needs ≥3 brokers + anti-affinity + no overprovisioned — hole (Helm/operator).
---
apiVersion: v1
kind: Service
metadata:
  name: agentscale-kafka
  labels:
    app.kubernetes.io/name: agentscale-kafka
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: kafka
spec:
  # Headless so pod DNS agentscale-kafka-0.agentscale-kafka resolves (StatefulSet).
  clusterIP: None
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
  selector:
    app.kubernetes.io/name: agentscale-kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentscale-kafka
  labels:
    app.kubernetes.io/name: agentscale-kafka
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: agentscale-kafka
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentscale-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-kafka
        app.kubernetes.io/part-of: agentscale
        app.kubernetes.io/component: kafka
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /config/redpanda.yaml /etc/redpanda/redpanda.yaml
              export LD_LIBRARY_PATH="/opt/redpanda/lib"
              export PATH="/opt/redpanda/bin:${PATH}"
              exec /opt/redpanda/libexec/redpanda \
                --redpanda-cfg /etc/redpanda/redpanda.yaml \
                --memory=1G \
                --lock-memory=false \
                --unsafe-bypass-fsync=false \
                --reserve-memory=0M \
                --smp=1 \
                --overprovisioned \
                --default-log-level=warn
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /var/lib/redpanda/data
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Readiness fails first; brief drain before SIGTERM (HA: use maintenance mode).
                    sleep 10
          startupProbe:
            tcpSocket:
              port: admin
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: agentscale-kafka-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: agentscale-kafka
          app.kubernetes.io/part-of: agentscale
          app.kubernetes.io/component: kafka
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agentscale-kafka-init
  labels:
    app.kubernetes.io/name: agentscale-kafka-init
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: kafka-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-kafka-init
        app.kubernetes.io/part-of: agentscale
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until rpk cluster info -X brokers=agentscale-kafka:9092; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then exit 1; fi
                sleep 2
              done
              BROKERS=agentscale-kafka:9092
              ADMIN=agentscale-kafka-0.agentscale-kafka:9644
              # Wait for pod DNS + Admin API (9644). cluster info on :9092 can succeed
              # before advertised hostname / admin.hosts is reachable from this Job.
              j=0
              until rpk cluster config get write_caching_default -X brokers=$BROKERS -X admin.hosts=$ADMIN >/dev/null 2>&1; do
                j=$((j+1))
                if [ "$j" -gt 60 ]; then
                  echo "FAIL: admin API not reachable at $ADMIN" >&2
                  exit 1
                fi
                sleep 2
              done
              rpk topic create agentscale.platform.events -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.project.triggers -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.ops.health -p 1 -r 1 -X brokers=$BROKERS || true
              # Auth Service registration bus (auto_create disabled below — must exist before API publish).
              rpk topic create agentscale.auth.commands -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.auth.events -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.relation.events -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.metrics.events -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.document.events -p 1 -r 1 -X brokers=$BROKERS || true
              rpk topic create agentscale.search.events -p 1 -r 1 -X brokers=$BROKERS || true
              rpk cluster config set write_caching_default false -X brokers=$BROKERS -X admin.hosts=$ADMIN
              rpk cluster config set auto_create_topics_enabled false -X brokers=$BROKERS -X admin.hosts=$ADMIN
              rpk cluster config set default_topic_replications 1 -X brokers=$BROKERS -X admin.hosts=$ADMIN
              # Single-node: default 3 would leave __consumer_offsets / tx coordinator under-replicated
              # and break idempotent producers (API uses acks=all + enable_idempotence).
              rpk cluster config set internal_topic_replication_factor 1 -X brokers=$BROKERS -X admin.hosts=$ADMIN
              rpk cluster config set log_retention_ms 604800000 -X brokers=$BROKERS -X admin.hosts=$ADMIN
              rpk cluster config set log_segment_ms 86400000 -X brokers=$BROKERS -X admin.hosts=$ADMIN
              # RF=1 → min.isr must be 1 or acks=all producers stall (API enable_idempotence).
              for t in agentscale.platform.events agentscale.project.triggers agentscale.ops.health \
                       agentscale.auth.commands agentscale.auth.events agentscale.relation.events \
                       agentscale.metrics.events agentscale.document.events agentscale.search.events; do
                rpk topic alter-config "$t" \
                  --set cleanup.policy=delete \
                  --set min.insync.replicas=1 \
                  -X brokers=$BROKERS || true
              done
              rpk topic alter-config agentscale.ops.health --set retention.ms=86400000 -X brokers=$BROKERS || true
