# SearxNG — self-hosted meta-search engine for agent web.search tool (CLAW-WEB).
# Exposes JSON API at http://searxng.search.svc:8080/search?q=...&format=json.
# Consumed by the openclaw built-in web.search tool when
# OPENCLAW_WEB_SEARCH_PROVIDER=searxng + OPENCLAW_WEB_SEARCH_URL set on
# the agent-runtime pod (via agentscale-sandbox configmap).
# The `search` namespace is declared in namespace.yaml (base), not inline,
# to avoid conflicts with the dev overlay namespace-transformer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: web-search
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  settings.yml: |
    use_default_settings: true
    server:
      bind_address: "0.0.0.0"
      port: 8080
      limiter: false
      image_proxy: false
      # Secret key for SearXNG session/cookies. Must be set; the default
      # "ultrasecretkey" causes SearXNG to refuse to start.
      secret_key: "agentscale-searxng-dev-key-change-me"
    search:
      formats:
        - html
        - json
      safe_search: 0
      autocomplete: ""
    ui:
      static_use_hash: true
    outgoing:
      request_timeout: 10
      user_agent: "agentscale-searxng/1.0"
    engines:
      - name: duckduckgo
        engine: duckduckgo
        shortcut: dd
        disabled: false
      - name: google
        engine: google
        shortcut: g
        disabled: false
      - name: bing
        engine: bing
        shortcut: b
        disabled: false
      - name: wikipedia
        engine: wikipedia
        shortcut: w
        disabled: false
      - name: github
        engine: github
        shortcut: gh
        disabled: false
  env: |
    SEARXNG_BASE_URL=http://searxng.search.svc:8080/
    SEARXNG_SECRET=$(openssl rand -hex 32)
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: web-search
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: searxng
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: web-search
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: agentscale
        app.kubernetes.io/component: web-search
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:2026.9.22-019460e07
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: searxng-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: searxng-config
            items:
              - key: settings.yml
                path: settings.yml
---
# Separate env ConfigMap (secret generated by initContainer or sealed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-env
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: agentscale
data:
  SEARXNG_BASE_URL: http://searxng.search.svc:8080/
