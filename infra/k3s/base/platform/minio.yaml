# MinIO — C-OBJECT-STORE (P0). Local secret values match compose stack; rotate for shared clusters.
apiVersion: v1
kind: Secret
metadata:
  name: prodavan-minio
  labels:
    app.kubernetes.io/name: prodavan-minio
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: minio
stringData:
  root-user: prodavan
  root-password: prodavan123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prodavan-minio-data
  labels:
    app.kubernetes.io/name: prodavan-minio
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prodavan-minio
  labels:
    app.kubernetes.io/name: prodavan-minio
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: minio
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app.kubernetes.io/name: prodavan-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prodavan-minio
  labels:
    app.kubernetes.io/name: prodavan-minio
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: prodavan-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-minio
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: minio
    spec:
      terminationGracePeriodSeconds: 60
      # MinIO image user is uid 1000; fsGroup so PVC files are group-writable after reschedule.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-02T17-50-41Z
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: prodavan-minio
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prodavan-minio
                  key: root-password
            # Local k3s: no phone-home. Browser console stays on :9001 for ops.
            - name: MINIO_UPDATE
              value: "off"
            - name: MINIO_BROWSER
              value: "on"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          lifecycle:
            preStop:
              exec:
                # No graceful CLI; give endpoints time to fail readiness before SIGTERM.
                command: ["/bin/sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prodavan-minio-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prodavan-minio-init
  labels:
    app.kubernetes.io/name: prodavan-minio-init
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: minio-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-minio-init
        app.kubernetes.io/part-of: prodavan
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: prodavan-minio
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prodavan-minio
                  key: root-password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until mc alias set local http://prodavan-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then exit 1; fi
                sleep 2
              done
              j=0
              until mc ready local; do
                j=$((j+1))
                if [ "$j" -gt 60 ]; then exit 1; fi
                sleep 2
              done
              mc mb -p local/prodavan || true
              # App bucket must stay private (no anonymous download of workspaces).
              mc anonymous set none local/prodavan || true
              # Local SoT uses overwrite semantics; versioning off keeps PVC lean.
              mc version suspend local/prodavan || true
