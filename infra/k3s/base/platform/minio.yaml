# MinIO — C-OBJECT-STORE (P0). Local secret values match compose stack; rotate for shared clusters.
apiVersion: v1
kind: Secret
metadata:
  name: agentscale-minio
  labels:
    app.kubernetes.io/name: agentscale-minio
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: minio
stringData:
  root-user: agentscale
  root-password: agentscale123
  api-user: agentscale-api
  api-password: agentscale-api-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentscale-minio-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: agentscale-minio
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentscale-minio
  labels:
    app.kubernetes.io/name: agentscale-minio
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: minio
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app.kubernetes.io/name: agentscale-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentscale-minio
  labels:
    app.kubernetes.io/name: agentscale-minio
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: agentscale-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentscale-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-minio
        app.kubernetes.io/part-of: agentscale
        app.kubernetes.io/component: minio
    spec:
      terminationGracePeriodSeconds: 60
      # MinIO image user is uid 1000; fsGroup so PVC files are group-writable after reschedule.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # ghcr mirror of quay.io/minio (upstream closed anonymous pulls); package
      # is private on ghcr — pull via the contour ghcr-pull secret.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: minio
          image: ghcr.io/ne-tort/minio:RELEASE.2024-10-02T17-50-41Z
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio
                  key: root-password
            # Local k3s: no phone-home. Browser console stays on :9001 for ops.
            - name: MINIO_UPDATE
              value: "off"
            - name: MINIO_BROWSER
              value: "on"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          lifecycle:
            preStop:
              exec:
                # No graceful CLI; give endpoints time to fail readiness before SIGTERM.
                command: ["/bin/sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentscale-minio-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agentscale-minio-init
  labels:
    app.kubernetes.io/name: agentscale-minio-init
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: minio-init
  annotations:
    # Sync hook wave 9 — must finish before agentscale-api (wave 10).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "9"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscale-minio-init
        app.kubernetes.io/part-of: agentscale
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mc
          image: ghcr.io/ne-tort/mc:RELEASE.2024-10-08T09-37-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio
                  key: root-password
            - name: MINIO_API_USER
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio
                  key: api-user
            - name: MINIO_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentscale-minio
                  key: api-password
          volumeMounts:
            - name: api-policy
              mountPath: /policy
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until mc alias set local http://agentscale-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then exit 1; fi
                sleep 2
              done
              j=0
              until mc ready local; do
                j=$((j+1))
                if [ "$j" -gt 60 ]; then exit 1; fi
                sleep 2
              done
              mc mb -p local/agentscale || true
              # App bucket must stay private (no anonymous download of workspaces).
              mc anonymous set none local/agentscale || true
              # Local SoT uses overwrite semantics; versioning off keeps PVC lean.
              mc version suspend local/agentscale || true
              # mc admin policy update is deprecated; recreate idempotently.
              mc admin policy remove local agentscale-api-policy 2>/dev/null || true
              mc admin policy create local agentscale-api-policy /policy/minio-api-policy.json
              if ! mc admin user info local "$MINIO_API_USER" >/dev/null 2>&1; then
                mc admin user add local "$MINIO_API_USER" "$MINIO_API_PASSWORD"
              fi
              mc admin policy attach local agentscale-api-policy --user "$MINIO_API_USER"
              # Smoke: service user must head/list bucket before API (wave 10) starts.
              mc alias set apiuser http://agentscale-minio:9000 "$MINIO_API_USER" "$MINIO_API_PASSWORD"
              mc ls "apiuser/agentscale" >/dev/null
              echo "minio-init: bucket + IAM user ok"
      volumes:
        - name: api-policy
          configMap:
            name: agentscale-minio-api-policy
