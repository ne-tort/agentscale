# NetworkPolicy `plugin-egress` — фаерволл подов плагинов (дизайн v4, §6.1, §6.2, §14 п.6).
#
# ОДНА из ДВУХ политик из одного генератора (задача 08): вторая, эталонная для
# агентов, — `networkpolicy-agent.yaml` в этом же каталоге. Общая схема правил
# и единая схема egress-аудита сохранены, но plugin egress временно сужен.
#
# EMERGENCY FAIL-CLOSED: до завершения security/lifecycle remediation и появления
# реальной per-tenant аутентификации разрешены только DNS и plugin-gateway:8080.
# Capability-вызовы, direct DSN, events и остальной сетевой доступ временно
# закрыты; маршрут к Gateway сам по себе не включает capability-surface при
# выключенной платформе. Восстановление — отдельно, только после безопасных
# адаптеров и per-tenant аутентификации, а не добавлением destinations сюда.
#
# `namespaceSelector` ТОЛЬКО по `kubernetes.io/metadata.name`: лейблы `name`
# в `overlays/dev/namespace.yaml` НЕТ (§6.2). Имя `agentscale-dev` — dev-контур
# (политика сред: работаем только с dev). При переносе в prod заменить на
# `agentscale` / `agentscale-sandboxes` (оба есть в destinations 00-project.yaml).
#
# ЯВНО НЕ ВКЛЮЧАЕМ `prodavan`: платформенный Postgres (`app: agentscale-postgres`,
# БД `agentscale` / `agentscale_userdb`) в правила egress НЕ входит. У плагина
# нет ни сетевого пути, ни credentials, ни CONNECT к этой БД (§2.1, §2.2, §6.2).
# Дополнительно bootstrap-Job tenant-postgres.yaml снимает PUBLIC CONNECT и на
# самом платформенном инстансе.
#
# kind NetworkPolicy разрешён whitelist'ом `infra/argocd/apps/00-project.yaml:81-84`.
# Никаких CRD (KEDA/Knative/cert-manager/SPIRE).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plugin-egress
  labels:
    app: plugin
    app.kubernetes.io/name: plugin-egress
    app.kubernetes.io/part-of: agentscale
    app.kubernetes.io/component: plugin-network-policy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Emergency fail-closed: CapabilityGrant НЕ расширяет этот список.
    # Capabilities/direct DSN/events/network восстанавливаются отдельно, после
    # security/lifecycle remediation и безопасных per-tenant адаптеров.
spec:
  # ТОЛЬКО поды плагинов (`app: plugin` из plugin-deployment-template.yaml).
  # НЕ `podSelector: {}`: иначе политика накроет и агентов, и сам Gateway.
  podSelector:
    matchLabels:
      app: plugin
  # Fail-closed: Ingress + Egress. Отсутствие правила = ЗАПРЕТ, не разрешение.
  policyTypes: [Ingress, Egress]
  ingress:
    # Входящий трафик ТОЛЬКО от Plugin Gateway на :8080 (§6.2, §7.2).
    # Webhook'ы и pluginpage приходят через Ingress → Gateway → плагин.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentscale-dev
          podSelector:
            matchLabels:
              app: plugin-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # 1) Plugin Gateway :8080 — единственный сохранённый service egress.
    #    Маршрут НЕ включает capabilities: до завершения remediation платформа
    #    выключена через PLUGIN_PLATFORM_ENABLED=false. Pod-gateway :8001 запрещён.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentscale-dev
          podSelector:
            matchLabels:
              app: plugin-gateway
      ports:
        - protocol: TCP
          port: 8080
    # 2) kube-dns. UDP 53 обязателен; TCP 53 добавлен для ответов >512 байт
    #    (паттерн base/agentscale-sandboxes-ks/networkpolicy.yaml:39-47).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # ЯВНО ЗАПРЕЩЕНО до безопасных per-tenant адаптеров (правил НЕТ = fail-closed):
    #   * tenant-postgres :5432 и PgBouncer :6432 — direct DSN, включая admin/DoS;
    #   * MinIO :9000;
    #   * Redpanda :9092 — общие auth topics;
    #   * egress-proxy :8080 — общий Envoy объединяет чужие allowlists;
    #   * `app: agentscale-postgres` / БД `prodavan` (:5432);
    #   * pod-gateway :8001 (`/agent/*`, `/internal/pods/*`) — критерий №17;
    #   * прямой 0.0.0.0/0 :80/:443 и любой иной неразрешённый порт/хост.
