name: Deploy Dev k3s

on:
  push:
    branches: [main]
    paths:
      - "infra/k3s/**"
      - "infra/scripts/attach_ci_kubeconfig.sh"
      - "infra/scripts/rollout_latest_from_ghcr.sh"
      - "infra/scripts/ensure_argocd.sh"
      - "infra/scripts/lib/common.sh"
      - ".github/workflows/deploy-dev-k3s.yml"
  workflow_run:
    workflows: ["CI Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-dev-k3s
  cancel-in-progress: true

env:
  HTTP_PORT: "8088"
  KUBECONFIG: ${{ github.workspace }}/infra/.kube/prodavan-k3d.yaml
  # k3d may live in another WSL Docker; never create a second cluster from Desktop.
  REQUIRE_EXISTING_CLUSTER: "1"
  CREATE_CLUSTER: "0"
  WARM_K3D_IMAGES: "0"
  SMOKE_ADDR: host.docker.internal

jobs:
  deploy-smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Attach workstation k3d API (no create, no shared Docker required)
        run: bash infra/scripts/attach_ci_kubeconfig.sh

      - name: Ensure GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash infra/scripts/create_ghcr_pull_secret.sh

      - name: Pull :latest from GHCR (restart pods)
        run: bash infra/scripts/rollout_latest_from_ghcr.sh

      - name: Ensure Argo CD + Application
        env:
          ARGOCD_REPO_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: bash infra/scripts/ensure_argocd.sh

      - name: Wait rollout
        run: bash infra/scripts/wait_prodavan_ready.sh

      - name: Smoke HTTP via ingress
        run: bash infra/scripts/smoke_ingress.sh
