name: Deploy Dev k3s

on:
  workflow_run:
    workflows: ["CI Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-dev-k3s
  cancel-in-progress: true

env:
  HTTP_PORT: "8088"
  KUBECONFIG: ${{ github.workspace }}/infra/.kube/prodavan-k3d.yaml
  # Never create a second k3d from CI (port clash with the workstation cluster).
  REQUIRE_EXISTING_CLUSTER: "1"
  CREATE_CLUSTER: "0"
  WARM_K3D_IMAGES: "0"

jobs:
  deploy-smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Attach existing k3d (do not create)
        run: bash infra/scripts/ensure_k3d_cluster.sh

      - name: Ensure GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash infra/scripts/create_ghcr_pull_secret.sh

      - name: Import overlay images into k3d
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash infra/scripts/import_overlay_images.sh

      - name: Ensure Argo CD + Application
        env:
          ARGOCD_REPO_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: bash infra/scripts/ensure_argocd.sh

      - name: Wait rollout
        run: bash infra/scripts/wait_prodavan_ready.sh

      - name: Smoke HTTP via ingress
        run: bash infra/scripts/smoke_ingress.sh
