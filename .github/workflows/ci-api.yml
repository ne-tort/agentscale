name: CI API

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  workflow_dispatch:

jobs:
  test:
    # github-hosted ubuntu-latest fails instantly (empty steps) in this org
    runs-on: [self-hosted, linux, docker]
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://prodavan_app:prodavan@127.0.0.1:55432/prodavan
      PG_ADMIN_URL: postgresql+asyncpg://prodavan:prodavan@127.0.0.1:55432/prodavan
    steps:
      - uses: actions/checkout@v4

      # setup-python has no Kali builds; Debian/Kali PEP 668 blocks --user pip.
      - name: Python venv (self-hosted)
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "${{ runner.temp }}/venv"
          echo "${{ runner.temp }}/venv/bin" >> "${GITHUB_PATH}"
          "${{ runner.temp }}/venv/bin/python" -m pip install -U pip

      - name: Start Postgres
        run: |
          docker rm -f prodavan-ci-pg 2>/dev/null || true
          docker run -d --name prodavan-ci-pg \
            -e POSTGRES_USER=prodavan \
            -e POSTGRES_PASSWORD=prodavan \
            -e POSTGRES_DB=prodavan \
            -p 55432:5432 \
            postgres:16.15
          for i in $(seq 1 30); do
            if docker exec prodavan-ci-pg pg_isready -U prodavan -d prodavan; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ensure app role
        env:
          DATABASE_URL: postgresql+asyncpg://prodavan:prodavan@127.0.0.1:55432/prodavan
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://prodavan:prodavan@127.0.0.1:55432/prodavan")
              try:
                  await conn.execute("CREATE ROLE prodavan_app LOGIN PASSWORD 'prodavan'")
              except Exception:
                  pass
              await conn.execute("GRANT ALL ON SCHEMA public TO prodavan_app")
              await conn.execute("GRANT ALL ON DATABASE prodavan TO prodavan_app")
              await conn.close()
          asyncio.run(main())
          PY

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://prodavan:prodavan@127.0.0.1:55432/prodavan
        run: alembic upgrade head

      - name: Migration downgrade smoke
        env:
          DATABASE_URL: postgresql+asyncpg://prodavan:prodavan@127.0.0.1:55432/prodavan
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Grant app role on migrated tables
        env:
          DATABASE_URL: postgresql+asyncpg://prodavan:prodavan@127.0.0.1:55432/prodavan
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://prodavan:prodavan@127.0.0.1:55432/prodavan")
              await conn.execute("GRANT ALL ON ALL TABLES IN SCHEMA public TO prodavan_app")
              await conn.execute("GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO prodavan_app")
              await conn.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE prodavan IN SCHEMA public GRANT ALL ON TABLES TO prodavan_app"
              )
              await conn.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE prodavan IN SCHEMA public GRANT ALL ON SEQUENCES TO prodavan_app"
              )
              await conn.close()
          asyncio.run(main())
          PY

      - name: Ruff check
        run: ruff check src tests

      - name: Release gate check
        working-directory: .
        run: python tools/release_gate_check.py

      - name: Pytest (unit — required on PR)
        run: pytest tests/unit/ -q

      - name: Stop Postgres
        if: always()
        run: docker rm -f prodavan-ci-pg 2>/dev/null || true

      # actions/setup-python@v5 removed — Kali not in python-versions manifest.
