name: CI API

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  workflow_dispatch:

jobs:
  test:
    # github-hosted ubuntu-latest fails instantly (empty steps) in this org
    runs-on: [self-hosted, linux, docker]
    defaults:
      run:
        working-directory: apps/api
    env:
      PIP_CACHE_DIR: /cache/pip
    steps:
      - uses: actions/checkout@v4

      # setup-python has no Kali builds; Debian/Kali PEP 668 blocks --user pip.
      - name: Python venv (self-hosted)
        run: |
          set -euo pipefail
          python3 --version
          # api requires >=3.12 (Docker runner image must ship 3.12)
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          mkdir -p "${PIP_CACHE_DIR:-/cache/pip}"
          python3 -m venv "${{ runner.temp }}/venv"
          echo "${{ runner.temp }}/venv/bin" >> "${GITHUB_PATH}"
          "${{ runner.temp }}/venv/bin/python" -m pip install -U pip

      - name: Start Postgres
        id: pg
        run: |
          set -euo pipefail
          # Docker Desktop runners: published ports land on Desktop VM → host.docker.internal
          # Host/WSL runners: 127.0.0.1
          PG_HOST="${PRODAVAN_CI_HOST:-127.0.0.1}"
          NAME="prodavan-ci-pg-${{ github.run_id }}-${{ github.job }}"
          docker rm -f "$NAME" 2>/dev/null || true
          # ephemeral host port avoids collisions across parallel runners
          docker run -d --name "$NAME" \
            -e POSTGRES_USER=prodavan \
            -e POSTGRES_PASSWORD=prodavan \
            -e POSTGRES_DB=prodavan \
            -p 0:5432 \
            postgres:16.15
          PORT="$(docker port "$NAME" 5432/tcp | head -1 | awk -F: '{print $NF}')"
          echo "PG_HOST=$PG_HOST" >> "${GITHUB_ENV}"
          echo "PG_PORT=$PORT" >> "${GITHUB_ENV}"
          echo "PG_CONTAINER=$NAME" >> "${GITHUB_ENV}"
          echo "DATABASE_URL=postgresql+asyncpg://prodavan_app:prodavan@${PG_HOST}:${PORT}/prodavan" >> "${GITHUB_ENV}"
          echo "PG_ADMIN_URL=postgresql+asyncpg://prodavan:prodavan@${PG_HOST}:${PORT}/prodavan" >> "${GITHUB_ENV}"
          echo "Postgres $NAME on ${PG_HOST}:${PORT}"
          for i in $(seq 1 30); do
            if docker exec "$NAME" pg_isready -U prodavan -d prodavan; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ensure app role
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              host = os.environ["PG_HOST"]
              port = os.environ["PG_PORT"]
              conn = await asyncpg.connect(f"postgresql://prodavan:prodavan@{host}:{port}/prodavan")
              try:
                  await conn.execute("CREATE ROLE prodavan_app LOGIN PASSWORD 'prodavan'")
              except Exception:
                  pass
              await conn.execute("GRANT ALL ON SCHEMA public TO prodavan_app")
              await conn.execute("GRANT ALL ON DATABASE prodavan TO prodavan_app")
              await conn.close()
          asyncio.run(main())
          PY

      - name: Run migrations
        run: |
          export DATABASE_URL="${PG_ADMIN_URL}"
          alembic upgrade head

      - name: Migration downgrade smoke
        run: |
          export DATABASE_URL="${PG_ADMIN_URL}"
          alembic downgrade base
          alembic upgrade head

      - name: Grant app role on migrated tables
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              host = os.environ["PG_HOST"]
              port = os.environ["PG_PORT"]
              conn = await asyncpg.connect(f"postgresql://prodavan:prodavan@{host}:{port}/prodavan")
              await conn.execute("GRANT ALL ON ALL TABLES IN SCHEMA public TO prodavan_app")
              await conn.execute("GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO prodavan_app")
              await conn.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE prodavan IN SCHEMA public GRANT ALL ON TABLES TO prodavan_app"
              )
              await conn.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE prodavan IN SCHEMA public GRANT ALL ON SEQUENCES TO prodavan_app"
              )
              await conn.close()
          asyncio.run(main())
          PY

      - name: Ruff check
        run: ruff check src tests

      - name: Release gate check
        working-directory: .
        run: python tools/release_gate_check.py

      - name: Pytest (unit — required on PR)
        run: pytest tests/unit/ -q

      - name: Stop Postgres
        if: always()
        run: docker rm -f "${PG_CONTAINER:-}" 2>/dev/null || true

      # actions/setup-python@v5 removed — Kali not in python-versions manifest.
