name: CI API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodavan
          POSTGRES_PASSWORD: prodavan
          POSTGRES_DB: prodavan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodavan -d prodavan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://prodavan_app:prodavan@localhost:5432/prodavan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://prodavan:prodavan@localhost:5432/prodavan
        run: alembic upgrade head

      - name: Ruff check
        run: ruff check src tests

      - name: Pytest
        run: pytest tests/ -q
