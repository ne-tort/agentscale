name: CI Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Least privilege by default: on a self-hosted runner the token reaches code from
# every pull request, and nothing in this workflow writes to the repository.
permissions:
  contents: read

# Cron and a manual dispatch can overlap: without a group the second run starts
# beside the first, and both bind the same fixed container/port.
concurrency:
  group: ci-nightly
  cancel-in-progress: false

jobs:
  integration:
    runs-on: [self-hosted, linux, docker]
    # Bounds a hung pull/pytest. The nightly also competes for RAM with the dev
    # cluster, so it must not sit on a slot all night.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/api
    env:
      PIP_CACHE_DIR: /cache/pip
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DB host (Docker Desktop gateway)
        run: |
          set -euo pipefail
          echo "DB_HOST=${PRODAVAN_CI_HOST:-127.0.0.1}" >> "${GITHUB_ENV}"

      - name: Start Postgres
        timeout-minutes: 2
        run: |
          set -euo pipefail
          docker rm -f agentscale-nightly-pg 2>/dev/null || true
          docker run -d --name agentscale-nightly-pg \
            -e POSTGRES_USER=agentscale \
            -e POSTGRES_PASSWORD=agentscale \
            -e POSTGRES_DB=agentscale \
            -p 55433:5432 \
            postgres:16.15
          for i in $(seq 1 15); do
            if docker exec agentscale-nightly-pg pg_isready -U agentscale -d agentscale; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ensure app role
        env:
          DATABASE_URL: postgresql+asyncpg://agentscale:agentscale@${{ env.DB_HOST }}:55433/agentscale
        run: |
          python - <<PY
          import asyncio
          import asyncpg
          import os
          host = os.environ["DB_HOST"]
          async def main():
              conn = await asyncpg.connect(f"postgresql://agentscale:agentscale@{host}:55433/agentscale")
              try:
                  await conn.execute("CREATE ROLE agentscale_app LOGIN PASSWORD 'agentscale'")
              except Exception:
                  pass
              await conn.execute("GRANT ALL ON SCHEMA public TO agentscale_app")
              await conn.execute("GRANT ALL ON DATABASE agentscale TO agentscale_app")
              await conn.close()
          asyncio.run(main())
          PY

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://agentscale:agentscale@${{ env.DB_HOST }}:55433/agentscale
        run: alembic upgrade head

      - name: Alembic model drift check
        env:
          DATABASE_URL: postgresql+asyncpg://agentscale:agentscale@${{ env.DB_HOST }}:55433/agentscale
        run: alembic check

      - name: Grant app role on migrated tables
        env:
          DATABASE_URL: postgresql+asyncpg://agentscale:agentscale@${{ env.DB_HOST }}:55433/agentscale
        run: |
          python - <<PY
          import asyncio
          import asyncpg
          import os
          host = os.environ["DB_HOST"]
          async def main():
              conn = await asyncpg.connect(f"postgresql://agentscale:agentscale@{host}:55433/agentscale")
              await conn.execute("GRANT ALL ON ALL TABLES IN SCHEMA public TO agentscale_app")
              await conn.execute("GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO agentscale_app")
              # The suite truncates between tests, and append-only guards
              # (`runtime_materialization_audit`, `agent_control_plane_events`,
              # the M04E/M06 ledgers) reject that. Stepping around a guard needs
              # `ALTER TABLE ... DISABLE TRIGGER`, which requires *ownership* —
              # DML grants are not enough, and without this every database-backed
              # test fails in setup with "... is append-only". This job was red
              # for three consecutive nights for exactly that reason.
              rows = await conn.fetch(
                  "SELECT c.relname FROM pg_class c "
                  "JOIN pg_namespace n ON n.oid = c.relnamespace "
                  "WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p')"
              )
              for (name,) in rows:
                  quoted = '"' + name.replace('"', '""') + '"'
                  await conn.execute(f"ALTER TABLE public.{quoted} OWNER TO agentscale_app")
              await conn.close()
          asyncio.run(main())
          PY

      - name: Pytest integration (L2)
        env:
          DATABASE_URL: postgresql+asyncpg://agentscale_app:agentscale@${{ env.DB_HOST }}:55433/agentscale
          PG_ADMIN_URL: postgresql+asyncpg://agentscale:agentscale@${{ env.DB_HOST }}:55433/agentscale
          AUTH_MODE: test
          AUTH_TEST_SECRET: dev-only-test-secret-change-me
          KEYCLOAK_INVITE_MODE: fake
          POD_RUNTIME_MODE: stub
        run: pytest tests/integration -m integration -q

      - name: Stop Postgres
        if: always()
        run: |
          # -v: drop the anonymous postgres volume too (see ci-api.yml),
          # otherwise every nightly leaks ~140 MB onto the CI VM disk.
          docker rm -fv agentscale-nightly-pg 2>/dev/null || true
          docker volume prune -f >/dev/null 2>&1 || true
