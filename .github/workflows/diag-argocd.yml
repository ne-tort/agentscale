name: Diag ArgoCD

# WAVE17: agentscale-dev stuck в ComparisonError «Failed to load target state»
# после мержа WAVE17. Раннер на VM с kubeconfig — читаем repo-server логи и
# полный статус приложения. Только чтение, только dev.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Ensure kubectl on PATH
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
            exit 0
          fi
          ver=v1.31.4
          cache="/cache/kubectl/${ver}"
          if [ -x "${cache}/kubectl" ]; then
            echo "${cache}" >> "${GITHUB_PATH}"
            "${cache}/kubectl" version --client
            exit 0
          fi
          mkdir -p "${cache}"
          tgz="${{ runner.temp }}/kubectl"
          url="https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl"
          curl -fsSL -o "${tgz}" "${url}"
          install -m 0755 "${tgz}" "${cache}/kubectl"
          echo "${cache}" >> "${GITHUB_PATH}"

      - name: Resolve kubeconfig (host, not checkout)
        run: |
          set -euo pipefail
          # Тот же путь, что verify-dev: prodavan-ops берёт ~/.kube/prodavan-dev.yaml
          # (подготовлен на runner-хосте).
          KCFG="$HOME/.kube/prodavan-dev.yaml"
          [ -f "$KCFG" ] || { echo "no $KCFG"; ls -la "$HOME/.kube/" || true; exit 1; }
          echo "KUBECONFIG=${KCFG}" >> "${GITHUB_ENV}"
          grep -E "server:" "$KCFG" | head -2
          kubectl get ns agentscale-dev --request-timeout=10s || true
          kubectl version 2>/dev/null | tail -1 || true

      - name: Application full status
        run: |
          set -euo pipefail
          kubectl -n argocd get application agentscale-dev -o yaml | sed -n '1,120p'
          echo '=== sync/conditions ==='
          kubectl -n argocd get application agentscale-dev -o json | python3 -c "
          import json,sys
          o=json.load(sys.stdin)
          st=o.get('status',{})
          print('sync:', json.dumps(st.get('sync',{}).get('status'), ensure_ascii=False))
          for c in st.get('conditions',[]):
              print('condition:', c.get('type'), '-', c.get('message'))
          "

      - name: Repo-server logs (errors)
        run: |
          set -euo pipefail
          echo '=== repo-server recent errors ==='
          kubectl -n argocd logs deploy/argocd-repo-server --tail=300 2>&1 | grep -iE "error|fail|manifest|kustomize" | tail -40 || true
          echo '=== application-controller errors ==='
          kubectl -n argocd logs deploy/argocd-application-controller --tail=200 2>&1 | grep -iE "agentscale-dev|error|comparison" | tail -20 || true

      - name: Git fetch probe (как repo-server)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          git clone --depth 1 https://github.com/ne-tort/agentscale.git repo 2>&1 | tail -2
          cd repo
          git log --oneline -1
          echo '=== submodule probe ==='
          git submodule status || true

  pods:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: searchnet pod state
        run: |
          set -euo pipefail
          kubectl -n agentscale-dev get pods -o wide | grep -E "searchnet|searxng|NAME" || true
          kubectl -n agentscale-dev get deploy searchnet -o wide || true
          echo '=== searchnet events ==='
          kubectl -n agentscale-dev describe deploy searchnet | tail -20 || true
          echo '=== searchnet health from inside cluster ==='
          kubectl -n agentscale-dev run curl-probe --image=curlimages/curl:8.10.1 --restart=Never -- \
            curl -s -m 30 http://searchnet.agentscale-dev.svc:3950/health || true
          sleep 25
          kubectl -n agentscale-dev logs curl-probe 2>/dev/null | head -c 500 || true
          kubectl -n agentscale-dev delete pod curl-probe --wait=false 2>/dev/null || true
          echo
          kubectl -n agentscale-dev run curl-search --image=curlimages/curl:8.10.1 --restart=Never -- \
            sh -c 'curl -s -m 90 -X POST http://searchnet.agentscale-dev.svc:3950/search -H "content-type: application/json" -d "{\"q\":\"playwright python\",\"max_results\":3}"' || true
          sleep 100
          kubectl -n agentscale-dev logs curl-search 2>/dev/null | head -c 700 || true
          kubectl -n agentscale-dev delete pod curl-search --wait=false 2>/dev/null || true
