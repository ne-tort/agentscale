name: Diag ArgoCD

# WAVE17: agentscale-dev stuck в ComparisonError «Failed to load target state»
# после мержа WAVE17. Раннер на VM с kubeconfig — читаем repo-server логи и
# полный статус приложения. Только чтение, только dev.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Ensure kubectl on PATH
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
            exit 0
          fi
          ver=v1.31.4
          cache="/cache/kubectl/${ver}"
          if [ -x "${cache}/kubectl" ]; then
            echo "${cache}" >> "${GITHUB_PATH}"
            "${cache}/kubectl" version --client
            exit 0
          fi
          mkdir -p "${cache}"
          tgz="${{ runner.temp }}/kubectl"
          url="https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl"
          curl -fsSL -o "${tgz}" "${url}"
          install -m 0755 "${tgz}" "${cache}/kubectl"
          echo "${cache}" >> "${GITHUB_PATH}"

      - name: Resolve kubeconfig (host, not checkout)
        run: |
          set -euo pipefail
          # Тот же путь, что verify-dev: prodavan-ops берёт ~/.kube/prodavan-dev.yaml
          # (подготовлен на runner-хосте).
          KCFG="$HOME/.kube/prodavan-dev.yaml"
          [ -f "$KCFG" ] || { echo "no $KCFG"; ls -la "$HOME/.kube/" || true; exit 1; }
          echo "KUBECONFIG=${KCFG}" >> "${GITHUB_ENV}"
          grep -E "server:" "$KCFG" | head -2
          kubectl get ns agentscale-dev --request-timeout=10s || true
          kubectl version 2>/dev/null | tail -1 || true

      - name: Application full status
        run: |
          set -euo pipefail
          kubectl -n argocd get application agentscale-dev -o yaml | sed -n '1,120p'
          echo '=== sync/conditions ==='
          kubectl -n argocd get application agentscale-dev -o json | python3 -c "
          import json,sys
          o=json.load(sys.stdin)
          st=o.get('status',{})
          print('sync:', json.dumps(st.get('sync',{}).get('status'), ensure_ascii=False))
          for c in st.get('conditions',[]):
              print('condition:', c.get('type'), '-', c.get('message'))
          "

      - name: Repo-server logs (errors)
        run: |
          set -euo pipefail
          echo '=== repo-server recent errors ==='
          kubectl -n argocd logs deploy/argocd-repo-server --tail=300 2>&1 | grep -iE "error|fail|manifest|kustomize" | tail -40 || true
          echo '=== application-controller errors ==='
          kubectl -n argocd logs deploy/argocd-application-controller --tail=200 2>&1 | grep -iE "agentscale-dev|error|comparison" | tail -20 || true

      - name: Git fetch probe (как repo-server)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          git clone --depth 1 https://github.com/ne-tort/agentscale.git repo 2>&1 | tail -2
          cd repo
          git log --oneline -1
          echo '=== submodule probe ==='
          git submodule status || true

  pods:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: searchnet pod state
        run: |
          set -euo pipefail
          kubectl -n agentscale-dev get pods -o wide | grep -E "searchnet|searxng|NAME" || true
          kubectl -n agentscale-dev get deploy searchnet -o wide || true
          echo '=== searchnet events ==='
          kubectl -n agentscale-dev describe deploy searchnet | tail -20 || true
          echo '=== searchnet health from inside cluster ==='
          kubectl -n agentscale-dev run curl-probe --image=curlimages/curl:8.10.1 --restart=Never -- \
            curl -s -m 30 http://searchnet.agentscale-dev.svc:3950/health || true
          sleep 25
          kubectl -n agentscale-dev logs curl-probe 2>/dev/null | head -c 500 || true
          kubectl -n agentscale-dev delete pod curl-probe --wait=false 2>/dev/null || true
          echo
          kubectl -n agentscale-dev run curl-search --image=curlimages/curl:8.10.1 --restart=Never -- \
            sh -c 'curl -s -m 90 -X POST http://searchnet.agentscale-dev.svc:3950/search -H "content-type: application/json" -d "{\"q\":\"playwright python\",\"max_results\":3}"' || true
          sleep 100
          kubectl -n agentscale-dev logs curl-search 2>/dev/null | head -c 700 || true
          kubectl -n agentscale-dev delete pod curl-search --wait=false 2>/dev/null || true

  api-logs:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: api logs (websearch + credentials)
        run: |
          set -euo pipefail
          echo '=== web_search proxy lines (last 200) ==='
          kubectl -n agentscale-dev logs deploy/agentscale-api --tail=2000 2>&1 | grep -iE "web_search|credential (lease|push)|xai" | tail -30 || true
          echo '=== api errors tail ==='
          kubectl -n agentscale-dev logs deploy/agentscale-api --tail=200 2>&1 | grep -iE "error|401" | tail -15 || true

  pod-logs:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: agent-runtime pod logs
        run: |
          set -euo pipefail
          echo '=== sandbox pods ==='
          kubectl -n agentscale-dev-sandboxes get pods -o wide | head -10 || true
          POD=$(kubectl -n agentscale-dev-sandboxes get pods -o name | grep -m1 agent-pool)
          echo "POD=$POD"
          echo '=== pod env (websearch/provider) ==='
          kubectl -n agentscale-dev-sandboxes get "$POD" -o yaml | grep -A2 -iE "OPENCLAW_WEB|PRODAVAN|NAME: OPENCLAW" | head -30 || true
          echo '=== pod logs (provider/401) ==='
          kubectl -n agentscale-dev-sandboxes logs "$POD" --tail=300 2>&1 | grep -iE "provider|401|auth|api.x.ai|credential|lease" | tail -25 || true

  deep:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: deep dive
        run: |
          set -euo pipefail
          echo '=== api logs credential/lease (tail 5000) ==='
          kubectl -n agentscale-dev logs deploy/agentscale-api --tail=5000 2>&1 | grep -iE "credential|lease|web_search|xai|openclaw send" | tail -40 || true
          echo '=== api-pod container too ==='
          kubectl -n agentscale-dev get pods -l app=agentscale-api -o name | head -2
          kubectl -n agentscale-dev logs deploy/agentscale-api -c api --tail=5000 2>&1 | grep -iE "credential|lease|web_search|openclaw" | tail -30 || true
          echo '=== agent-pod logs full tail (401/provider) ==='
          POD=$(kubectl -n agentscale-dev-sandboxes get pods -o name | grep -m1 agent-pool)
          kubectl -n agentscale-dev-sandboxes logs "$POD" --tail=500 2>&1 | tail -40 || true

  workspace:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: workspace config + send trace
        run: |
          set -euo pipefail
          POD=$(kubectl -n agentscale-dev-sandboxes get pods -o name | grep -m1 agent-pool)
          echo "=== .prodavan/config.yaml ==="
          kubectl -n agentscale-dev-sandboxes exec "$POD" -- cat /workspace/.prodavan/config.yaml 2>/dev/null | sed -n '1,40p' || true
          echo "=== workspace layout ==="
          kubectl -n agentscale-dev-sandboxes exec "$POD" -- ls -la /workspace/.prodavan/ 2>/dev/null || true
          echo "=== live model stream error (последний send) ==="
          kubectl -n agentscale-dev-sandboxes logs "$POD" --tail=100 --timestamps 2>&1 | tail -30 || true

  config-dump:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: exec cat config
        run: |
          set -euo pipefail
          POD=$(kubectl -n agentscale-dev-sandboxes get pods -o name | grep -m1 agent-pool)
          echo "POD=$POD"
          kubectl -n agentscale-dev-sandboxes exec "$POD" -- sh -c 'ls -la /workspace/ 2>&1 | head; echo ---; ls -la /workspace/.prodavan 2>&1 | head; echo ---; cat /workspace/.prodavan/config.yaml 2>&1 | head -50' || true

  w17-pod:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: find W17 project pod (label by project)
        run: |
          set -euo pipefail
          echo '=== all sandbox pods with labels ==='
          kubectl -n agentscale-dev-sandboxes get pods -o custom-columns=NAME:.metadata.name,PROJECT:.metadata.labels.proj --no-headers 2>/dev/null || \
            kubectl -n agentscale-dev-sandboxes get pods --show-labels | head -10 || true
          echo '=== find pod bound to proj_60023937403249dc (session-map scan) ==='
          for P in $(kubectl -n agentscale-dev-sandboxes get pods -o name | grep agent-pool); do
            OUT=$(kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'ls /workspace/.prodavan 2>/dev/null; cat /workspace/.prodavan/config.yaml 2>/dev/null | head -30' 2>/dev/null || true)
            if echo "$OUT" | grep -q "60023937403249dc\|provider"; then
              echo "FOUND pod: $P"
              echo "$OUT" | sed 's/apiKey:.*/apiKey: ***MASKED***/'
              break
            fi
          done
          echo '=== claim CRs for the project ==='
          kubectl -n agentscale-dev-sandboxes get claims 2>/dev/null | grep -i 60023937403249dc || kubectl get claims -A 2>/dev/null | grep -i 60023937403249dc | head -3 || true

  session-map:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: session-map scan
        run: |
          set -euo pipefail
          for P in $(kubectl -n agentscale-dev-sandboxes get pods -o name | grep -E "agent-pool|sandbox"); do
            OUT=$(kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'cat /workspace/.openclaw-data/session-map.json 2>/dev/null | head -c 2000' 2>/dev/null || true)
            if [ -n "$OUT" ]; then
              echo "=== $P session-map ==="
              echo "$OUT"
            fi
          done
          echo '=== claims CR list ==='
          kubectl -n agentscale-dev-sandboxes get agentsandboxes 2>/dev/null || kubectl -n agentscale-dev-sandboxes get agentsandbox 2>/dev/null || kubectl api-resources 2>/dev/null | grep -i sandbox | head -5 || true

  w17-claim:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: claim + pod for W17
        run: |
          set -euo pipefail
          echo '=== sandboxclaims ==='
          kubectl -n agentscale-dev-sandboxes get sandboxclaims -o wide 2>/dev/null | head -12
          echo '=== claim for our project (по имени/annotation) ==='
          kubectl -n agentscale-dev-sandboxes get sandboxclaims -o yaml 2>/dev/null | grep -B5 -A15 "60023937403249dc" | head -50 || true
          echo '=== sandboxes ==='
          kubectl -n agentscale-dev-sandboxes get sandboxes -o wide 2>/dev/null | head -12

  w17-cfg:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: W17 pod config + leases
        run: |
          set -euo pipefail
          P=pod/agentscale-agent-pool-wf89q
          echo '=== /workspace tree ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'ls -la /workspace/ | head -15; echo ---; ls -la /workspace/.prodavan 2>/dev/null | head -8; echo ---; cat /workspace/.prodavan/config.yaml 2>/dev/null' || true
          echo '=== leases via bridge API ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header="Authorization: Bearer $BRIDGE_AUTH_TOKEN" http://127.0.0.1:3921/v1/credentials/leases 2>/dev/null | head -c 400 || echo NOLEAK' || true
          echo
          echo '=== send last error from pod logs ==='
          kubectl -n agentscale-dev-sandboxes logs "$P" --tail=60 2>&1 | grep -vE "^$" | tail -25 || true

  w17-env:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: W17 pod env + leases
        run: |
          set -euo pipefail
          P=pod/agentscale-agent-pool-wf89q
          echo '=== provider env vars ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'env | grep -iE "OPENROUTER|OPENAI|ANTHROPIC|PROVIDER" | sed "s/=.*/=***/" ' || true
          echo '=== leases list (auth по BRIDGE_AUTH_TOKEN) ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header "Authorization: Bearer $(cat /var/run/bridge-token 2>/dev/null || echo $BRIDGE_AUTH_TOKEN)" http://127.0.0.1:3921/v1/credentials/leases 2>&1 | head -c 500' || true
          echo
          echo '=== bridges health ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- http://127.0.0.1:3921/v1/health 2>&1 | head -c 300' || true

  w17-lease:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: W17 lease list via GET /v1/credentials
        run: |
          set -euo pipefail
          P=pod/agentscale-agent-pool-wf89q
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header "Authorization: Bearer $BRIDGE_AUTH_TOKEN" http://127.0.0.1:3921/v1/credentials 2>&1 | head -c 300' || true
          echo
          echo '=== env полностью (маскируя значения) ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'env | cut -d= -f1 | sort' || true

  w17-full:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: full config + sessions
        run: |
          set -euo pipefail
          P=pod/agentscale-agent-pool-wf89q
          echo '=== config.yaml FULL ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- cat /workspace/.prodavan/config.yaml || true
          echo '=== bridge sessions list ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header "Authorization: Bearer $BRIDGE_AUTH_TOKEN" http://127.0.0.1:3921/v1/sessions 2>&1 | head -c 1500' || true
          echo
          echo '=== env PROVIDER/OPEN match ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'env | grep -iE "openrouter|openai|anthropic|provider|dialect|model" | sed "s/=.*/=***/" ' || true

  buildkit-heal:
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Inspect and heal buildkit
        run: |
          set -euo pipefail
          echo '=== buildx builders ==='
          docker buildx ls || true
          echo '=== buildkitd status ==='
          docker ps -a | grep buildkitd || true
          echo '=== disk ==='
          df -h / | tail -1
          echo '=== restart buildx builder agentscale-ci ==='
          docker buildx stop agentscale-ci 2>/dev/null || true
          docker buildx rm --keep-state agentscale-ci 2>/dev/null || true
          docker buildx create --name agentscale-ci --driver docker-container --driver-opt network=host --config /etc/buildkit/buildkitd.toml 2>/dev/null || \
            docker buildx create --name agentscale-ci --driver docker-container --driver-opt network=host || true
          docker buildx inspect --bootstrap agentscale-ci >/dev/null && echo "builder healthy"
          echo '=== buildkitd container logs (errors) ==='
          docker logs buildx_buildkit_agentscale-ci0 --tail 60 2>&1 | grep -iE "error|fatal|oom|kill|restart|timeout" | tail -20 || true
          echo '=== buildkitd mem info ==='
          docker stats --no-stream --format "{{.Name}} {{.MemUsage}}" | grep buildkit || true
          echo '=== buildkitd.toml ==='
          cat /etc/buildkit/buildkitd.toml 2>/dev/null || echo "NO TOML"

  push-probe:
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: docker login + direct push test
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo '=== retag alpine and push directly (no buildx) ==='
          docker pull alpine:3.20 >/dev/null 2>&1 || true
          docker tag alpine:3.20 ghcr.io/ne-tort/push-probe:latest
          time docker push ghcr.io/ne-tort/push-probe:latest 2>&1 | tail -4 || true
          docker logout ghcr.io
      - name: net throughput to ghcr
        run: |
          set -euo pipefail
          echo '=== curl speed to ghcr.io upload ==='
          curl -s -o /dev/null -w 'connect: %{time_connect}s ttfb: %{time_starttransfer}s\n' https://ghcr.io/v2/ || true
          echo '=== upload test file 50MB ==='
          dd if=/dev/zero of=/tmp/blob.bin bs=1M count=50 2>/dev/null
          time curl -s -o /dev/null -w '%{http_code} %{speed_upload}B/s\n' -X POST --data-binary @/tmp/blob.bin https://ghcr.io/v2/ || true
          rm -f /tmp/blob.bin

  post-fix:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: W17 config after fix
        run: |
          set -euo pipefail
          P=pod/agentscale-agent-pool-wf89q
          echo '=== config.yaml provider section ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'cat /workspace/.prodavan/config.yaml | grep -A8 "provider:"' || echo "NO PROVIDER BLOCK"
          echo '=== api pod image ==='
          kubectl -n agentscale-dev get deploy agentscale-api -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
          echo '=== agentscale-api pod started ==='
          kubectl -n agentscale-dev get pods -l app=agentscale-api -o jsonpath='{.items[0].status.startTime}'
          echo

  post-fix2:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: find new W17 pod and config
        run: |
          set -euo pipefail
          echo '=== current sandboxclaims ==='
          kubectl -n agentscale-dev-sandboxes get sandboxclaims -o wide | head -8
          POD=$(kubectl -n agentscale-dev-sandboxes get pods -o name | grep -m1 agent-pool)
          echo "=== checking all pods for W17 config ==="
          for P in $(kubectl -n agentscale-dev-sandboxes get pods -o name | grep agent-pool); do
            OUT=$(kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'grep -A6 "^provider:" /workspace/.prodavan/config.yaml 2>/dev/null' 2>/dev/null || true)
            if [ -n "$OUT" ]; then
              echo "=== $P has provider block ==="
              echo "$OUT"
            else
              SESSIONS=$(kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'cat /workspace/.openclaw-data/session-map.json 2>/dev/null | head -c 300' 2>/dev/null || true)
              echo "--- $P sessions: ${SESSIONS:0:200}"
            fi
          done

  w17-hmzh5:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: hmzh5 config
        run: |
          set -euo pipefail
          P=pod/agentscale-agent-pool-hmzh5
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'ls -la /workspace/; echo ---; ls /workspace/.prodavan 2>/dev/null; echo ---; cat /workspace/.prodavan/config.yaml 2>/dev/null | head -40' || true

  post-sync:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: W17 pod after sync
        run: |
          set -euo pipefail
          echo '=== claims ==='
          kubectl -n agentscale-dev-sandboxes get sandboxclaims -o wide | grep 60023937403249dc
          P=$(kubectl -n agentscale-dev-sandboxes get sandboxclaims -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.sandboxName}{"\n"}{end}' | grep 60023937403249dc | awk '{print "pod/"$2}')
          echo "P=$P"
          echo '=== config provider ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'grep -A6 "^provider:" /workspace/.prodavan/config.yaml 2>/dev/null || echo NO_PROVIDER; echo ---; grep -c . /workspace/.prodavan/config.yaml' || true
          echo '=== bridge sessions ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header "Authorization: Bearer $BRIDGE_AUTH_TOKEN" http://127.0.0.1:3921/v1/sessions 2>&1 | head -c 800' || true
          echo
          echo '=== leases ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header "Authorization: Bearer $BRIDGE_AUTH_TOKEN" http://127.0.0.1:3921/v1/credentials 2>&1 | head -c 300' || true

  post-sync2:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: rwp4k config
        run: |
          set -euo pipefail
          P=pod/agentscale-agent-pool-rwp4k
          echo '=== config provider ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'grep -A6 "^provider:" /workspace/.prodavan/config.yaml 2>/dev/null || echo NO_PROVIDER'
          echo '=== sessions ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header "Authorization: Bearer $BRIDGE_AUTH_TOKEN" http://127.0.0.1:3921/v1/sessions 2>&1 | head -c 600'
          echo
          echo '=== leases ==='
          kubectl -n agentscale-dev-sandboxes exec "$P" -- sh -c 'wget -qO- --header "Authorization: Bearer $BRIDGE_AUTH_TOKEN" http://127.0.0.1:3921/v1/credentials 2>&1 | head -c 200'
          echo
          echo '=== pod log tail ==='
          kubectl -n agentscale-dev-sandboxes logs "$P" --tail=30 2>&1 | tail -12

  api-side-ws:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: API-side workspace config
        run: |
          set -euo pipefail
          echo '=== config.yaml в PVC API ==='
          kubectl -n agentscale-dev exec deploy/agentscale-api -c api -- sh -c 'cat /data/storage/projects/60023937403249dc/workspace/.prodavan/config.yaml 2>/dev/null | grep -A6 "^provider:" || echo NO_PROVIDER_API_SIDE; md5sum /data/storage/projects/60023937403249dc/workspace/.prodavan/config.yaml 2>/dev/null'
          echo '=== grepping fix code in image ==='
          kubectl -n agentscale-dev exec deploy/agentscale-api -c api -- sh -c 'grep -n "W17-фикс" /app/src/prodavan/application/projects/materialize.py 2>/dev/null | head -2 || echo FIX_NOT_IN_IMAGE'

  mtime:
    needs: diag
    continue-on-error: true
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Resolve kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/prodavan-dev.yaml" >> "${GITHUB_ENV}"
      - name: workspace mtime + rematerialize bus
        run: |
          set -euo pipefail
          kubectl -n agentscale-dev exec deploy/agentscale-api -c api -- sh -c 'ls -la /data/storage/projects/60023937403249dc/workspace/.prodavan/ 2>/dev/null; stat -c "%y %n" /data/storage/projects/60023937403249dc/workspace/.prodavan/config.yaml 2>/dev/null'
          echo '=== celery worker logs: rematerialize/materialize для проекта ==='
          kubectl -n agentscale-dev logs deploy/agentscale-celery-worker --tail=500 2>&1 | grep -iE "60023937403249dc|materializ" | tail -10 || true
