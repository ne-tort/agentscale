name: CI Schemas

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Same runner as Images — github-hosted ubuntu-latest fails empty in this org.
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4

      # setup-python has no Kali builds; Debian/Kali PEP 668 blocks --user pip.
      - name: Python venv (self-hosted)
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "${{ runner.temp }}/venv"
          echo "${{ runner.temp }}/venv/bin" >> "${GITHUB_PATH}"
          "${{ runner.temp }}/venv/bin/python" -m pip install -U pip

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate cabinet pack and profile schema
        run: python tools/validate_schemas.py
