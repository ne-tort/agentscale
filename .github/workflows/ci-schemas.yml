name: CI Schemas

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: on a self-hosted runner the token reaches code from
# every pull request, and nothing in this workflow writes to the repository.
permissions:
  contents: read

# All runners share one VM — supersede a pending run instead of stacking.
concurrency:
  group: ci-schemas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Same runner as Images — github-hosted ubuntu-latest fails empty in this org.
    runs-on: [self-hosted, linux, docker]
    # Bounds a hung venv/pip; this job blocks the gate, so it must not sit on a
    # runner for the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # setup-python has no Kali builds; Debian/Kali PEP 668 blocks --user pip.
      - name: Python venv (self-hosted)
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "${{ runner.temp }}/venv"
          echo "${{ runner.temp }}/venv/bin" >> "${GITHUB_PATH}"
          "${{ runner.temp }}/venv/bin/python" -m pip install -U pip

      - name: Install jsonschema
        # A bare `pip install` makes a network flake a red gate: pypi.org HTTPS
        # from this VM has been observed timing out under load, and this is the
        # only dependency the job needs. Retry with backoff, and do not reinstall
        # when the runner's cache already satisfies it.
        run: |
          set -euo pipefail
          export PIP_CACHE_DIR="${PIP_CACHE_DIR:-/cache/pip}"
          mkdir -p "$PIP_CACHE_DIR"
          for attempt in 1 2 3 4; do
            if pip install --disable-pip-version-check --retries 3 --timeout 60 jsonschema; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}/4), retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install jsonschema after 4 attempts"
          exit 1

      - name: Validate cabinet pack and profile schema
        run: python tools/validate_schemas.py
