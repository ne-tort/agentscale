name: CI Schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Same runner as Images — github-hosted ubuntu-latest fails empty in this org.
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate cabinet pack and profile schema
        run: python tools/validate_schemas.py
