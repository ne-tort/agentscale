name: Auto-merge

# GitHub Free + private repo cannot require branch protection.
# After CI Gate succeeds on a PR, squash-merge and dispatch CI Images
# (GITHUB_TOKEN merge does not trigger push workflows).

on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  squash:
    # FORK GUARD: the repository is PUBLIC (visibility=public, fork PRs allowed),
    # so without this condition an external fork PR that passes CI Gate would be
    # squash-merged into main automatically and shipped to ghcr by CI Images.
    # Only PRs whose head branch lives in THIS repository are auto-merged.
    # (Separate hardening, outside .github: Settings → Actions → General →
    # require approval for fork-PR workflow runs — self-hosted runners execute
    # PR code with docker-group access on the cluster VM.)
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, docker]
    # Bounded: this job holds the shared `auto-merge` concurrency slot, so a
    # hung `gh` call would block every later merge behind it.
    timeout-minutes: 10
    steps:
      - name: Squash-merge PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"
          if ! command -v gh >/dev/null 2>&1; then
            mkdir -p "${HOME}/.local/bin"
            ver="2.67.0"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
              | tar -xz -C /tmp
            mv "/tmp/gh_${ver}_linux_amd64/bin/gh" "${HOME}/.local/bin/gh"
          fi
          PR="$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '.[0].number')"
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            echo "No PR for sha ${{ github.event.workflow_run.head_sha }}"
            exit 0
          fi
          echo "Merging PR #${PR}"
          draft="$(gh pr view "$PR" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          if [[ "$draft" == "true" ]]; then
            echo "Draft PR — skip"
            exit 0
          fi
          labels="$(gh pr view "$PR" --repo "${{ github.repository }}" --json labels --jq '[.labels[].name]|join(",")')"
          if [[ "$labels" == *do-not-merge* ]]; then
            echo "label do-not-merge — skip"
            exit 0
          fi
          # The gate ran against one commit; the branch may have moved since.
          # Without this comparison a push landing after the green run was
          # merged untested — GitHub Free has no branch protection to stop it.
          TESTED="${{ github.event.workflow_run.head_sha }}"
          CURRENT="$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          if [[ "$TESTED" != "$CURRENT" ]]; then
            echo "PR head moved: tested $TESTED, now $CURRENT — skip (the next gate run will decide)"
            exit 0
          fi
          # And the base may have moved too: the gate tested the merge against
          # the main it saw, not the one it will be squashed onto.
          STATE="$(gh pr view "$PR" --repo "${{ github.repository }}" --json mergeStateStatus --jq .mergeStateStatus)"
          if [[ "$STATE" == "DIRTY" || "$STATE" == "BEHIND" || "$STATE" == "BLOCKED" ]]; then
            echo "merge state $STATE — skip until the branch is rebuilt on main"
            exit 0
          fi
          gh pr merge "$PR" --repo "${{ github.repository }}" --squash --delete-branch
          gh workflow run "CI Images" --repo "${{ github.repository }}" --ref main
          echo "Merged #${PR} and dispatched CI Images"
