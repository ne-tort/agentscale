name: CI Images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/flutter/**"
      - "packages/cabinet-packs/**"
      - "packages/schemas/**"
      - "prodavan-claw/**"
      - ".gitmodules"
      - ".github/workflows/ci-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    runs-on: [self-hosted, linux, docker]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      push: ${{ steps.meta.outputs.push }}
      owner: ${{ steps.meta.outputs.owner }}
      api: ${{ steps.meta.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          python3 - <<'PY'
          import os
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          registry = os.environ["REGISTRY"]
          sha = os.environ["GITHUB_SHA"][:12]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          out = os.environ["GITHUB_OUTPUT"]
          lines = [
              f"owner={owner}",
              f"api={registry}/{owner}/prodavan-api",
          ]
          if event == "pull_request":
              lines += ["tag=pr-local", "push=false"]
          else:
              lines += [f"tag={sha}", "push=true"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Sanitize Docker config
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path.home() / ".docker" / "config.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          cfg = {}
          if path.is_file():
              cfg = json.loads(path.read_text(encoding="utf-8"))
          cfg.pop("credsStore", None)
          cfg.pop("credHelpers", None)
          cfg.setdefault("auths", {})
          path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          print("sanitized", path)
          PY

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Warm base images (WSL TLS flakiness)
        run: |
          set -euo pipefail
          for img in python:3.12-slim-bookworm; do
            for i in 1 2 3 4 5; do
              docker pull "$img" && break
              echo "retry $i $img"
              sleep 10
            done
          done

      - name: Sanitize Docker config (no desktop.exe credsStore)
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          python3 - <<'PY'
          import json, os
          path = os.path.expanduser("~/.docker/config.json")
          cfg = {}
          if os.path.isfile(path):
              with open(path, encoding="utf-8") as f:
                  cfg = json.load(f)
          cfg.pop("credsStore", None)
          cfg.pop("credHelpers", None)
          cfg.setdefault("auths", {})
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          print("docker config sanitized:", path)
          PY

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-api
          cache-to: type=local,dest=/tmp/.buildx-cache-api-new,mode=max

      - name: Migration smoke (image ORM ↔ alembic)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}"
          NAME="prodavan-migrate-smoke-${{ github.run_id }}-${{ github.job }}"
          NET="${NAME}-net"
          docker rm -f "$NAME" 2>/dev/null || true
          docker network rm "$NET" 2>/dev/null || true
          docker network create "$NET"
          # Same user-defined bridge: migrate resolves Postgres by container name.
          # Avoid host.docker.internal — engine dns overrides break that special name.
          docker run -d --name "$NAME" --network "$NET" \
            -e POSTGRES_USER=prodavan \
            -e POSTGRES_PASSWORD=prodavan \
            -e POSTGRES_DB=prodavan \
            postgres:16.15
          echo "Postgres $NAME on docker network $NET"
          for i in $(seq 1 30); do
            if docker exec "$NAME" pg_isready -U prodavan -d prodavan; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Postgres did not become ready" >&2
              docker network rm "$NET" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          DATABASE_URL="postgresql+asyncpg://prodavan:prodavan@${NAME}:5432/prodavan"
          docker run --rm --network "$NET" \
            -e DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" ./scripts/migrate.sh
          docker rm -f "$NAME"
          docker network rm "$NET"

      - name: Rotate cache
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          old, new = Path("/tmp/.buildx-cache-api"), Path("/tmp/.buildx-cache-api-new")
          if old.exists():
              shutil.rmtree(old, ignore_errors=True)
          if new.exists():
              new.rename(old)
          PY

  build-web:
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          python3 - <<'PY'
          import os
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          registry = os.environ["REGISTRY"]
          sha = os.environ["GITHUB_SHA"][:12]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          out = os.environ["GITHUB_OUTPUT"]
          lines = [f"web={registry}/{owner}/prodavan-web"]
          if event == "pull_request":
              lines += ["tag=pr-local", "push=false"]
          else:
              lines += [f"tag={sha}", "push=true"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Sanitize Docker config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path.home() / ".docker" / "config.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          cfg = {}
          if path.is_file():
              cfg = json.loads(path.read_text(encoding="utf-8"))
          cfg.pop("credsStore", None)
          cfg.pop("credHelpers", None)
          cfg.setdefault("auths", {})
          path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          print("sanitized", path)
          PY

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Warm base images (WSL TLS flakiness)
        run: |
          set -euo pipefail
          for img in nginx:1.27-alpine debian:bookworm-slim; do
            for i in 1 2 3 4 5; do
              docker pull "$img" && break
              echo "retry $i $img"
              sleep 10
            done
          done

      - name: Sanitize Docker config (no desktop.exe credsStore)
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          python3 - <<'PY'
          import json, os
          path = os.path.expanduser("~/.docker/config.json")
          cfg = {}
          if os.path.isfile(path):
              with open(path, encoding="utf-8") as f:
                  cfg = json.load(f)
          cfg.pop("credsStore", None)
          cfg.pop("credHelpers", None)
          cfg.setdefault("auths", {})
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          print("docker config sanitized:", path)
          PY

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Flutter web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/flutter/Dockerfile
          target: runtime
          push: ${{ steps.meta.outputs.push }}
          provenance: false
          sbom: false
          build-args: |
            BUILD_ID=${{ github.sha }}
            BUILD_NAME=1.0.0
            BUILD_NUMBER=${{ github.run_number }}
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-web
          cache-to: type=local,dest=/tmp/.buildx-cache-web-new,mode=max

      - name: Rotate cache
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          old, new = Path("/tmp/.buildx-cache-web"), Path("/tmp/.buildx-cache-web-new")
          if old.exists():
              shutil.rmtree(old, ignore_errors=True)
          if new.exists():
              new.rename(old)
          PY

  build-agent-runtime:
    runs-on: [self-hosted, linux, docker]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      push: ${{ steps.meta.outputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          python3 - <<'PY'
          import os
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          registry = os.environ["REGISTRY"]
          sha = os.environ["GITHUB_SHA"][:12]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          out = os.environ["GITHUB_OUTPUT"]
          lines = [f"agent={registry}/{owner}/prodavan-agent-runtime"]
          if event == "pull_request":
              lines += ["tag=pr-local", "push=false"]
          else:
              lines += [f"tag={sha}", "push=true"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Clone prodavan-claw submodule
        env:
          # PAT with read access to the private ne-tort/prodavan-claw repo
          # (GITHUB_TOKEN cannot clone cross-repo private repos).
          GH_TOKEN: ${{ secrets.PRODAVAN_CLAW_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf prodavan-claw
          git clone https://x-access-token:${GH_TOKEN}@github.com/ne-tort/prodavan-claw.git prodavan-claw
          # checkout the commit recorded in the prodavan repo submodule pointer
          cd prodavan-claw
          git fetch origin "$GITHUB_SHA" 2>/dev/null || true
          sub_sha="$(cd .. && git ls-tree HEAD prodavan-claw | awk '{print $3}')"
          if [ -n "${sub_sha}" ] && git cat-file -e "${sub_sha}" 2>/dev/null; then
            git checkout "${sub_sha}"
          else
            # fall back to the default branch (main)
            git checkout main
          fi

      - name: Sanitize Docker config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path.home() / ".docker" / "config.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          cfg = {}
          if path.is_file():
              cfg = json.loads(path.read_text(encoding="utf-8"))
          cfg.pop("credsStore", None)
          cfg.pop("credHelpers", None)
          cfg.setdefault("auths", {})
          path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          print("sanitized", path)
          PY

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Warm base images (WSL TLS flakiness)
        run: |
          set -euo pipefail
          for img in node:22-bookworm-slim; do
            for i in 1 2 3 4 5; do
              docker pull "$img" && break
              echo "retry $i $img"
              sleep 10
            done
          done

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          # PRODAVAN_CLAW_TOKEN (PAT with write:packages) — the
          # prodavan-agent-runtime package is owned by the prodavan-claw
          # repo, so the prodavan repo GITHUB_TOKEN lacks push permission.
          username: ${{ github.actor }}
          password: ${{ secrets.PRODAVAN_CLAW_TOKEN }}

      - name: Build agent-runtime image
        uses: docker/build-push-action@v6
        with:
          context: prodavan-claw
          file: prodavan-claw/platform-openclaw/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.agent }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.agent }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-agent
          cache-to: type=local,dest=/tmp/.buildx-cache-agent-new,mode=max

      - name: Agent-runtime smoke (artifacts present + health)
        if: steps.meta.outputs.push == 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.agent }}:${{ steps.meta.outputs.tag }}"
          # 1) Non-zero artifacts must exist in the image (catches a stale
          #    buildx cache that ships an empty dist/ tree).
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -s /app/package.json && test -s /app/package-lock.json && test -s /app/packages/bridge/dist/server.js && test -d /app/node_modules'
          # 2) Health endpoint must respond 200 within start-period. This also
          #    proves server.js actually loads and boots Hono — a 0-byte or
          #    truncated dist will crash the container and never answer.
          docker run -d --name agent-runtime-smoke-${{ github.run_id }} --network host \
            -e PORT=3921 -e WORKSPACE_ROOT=/tmp/ws \
            "$IMAGE"
          trap 'docker rm -f agent-runtime-smoke-${{ github.run_id }} 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 20); do
            if docker exec agent-runtime-smoke-${{ github.run_id }} \
              node -e "fetch('http://127.0.0.1:'+(process.env.PORT||3921)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ok=1; break
            fi
            sleep 2
          done
          [ "$ok" = "1" ] || { echo "agent-runtime /health did not return 200"; docker logs agent-runtime-smoke-${{ github.run_id }} 2>&1 | tail -40; exit 1; }

      - name: Rotate cache
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          old, new = Path("/tmp/.buildx-cache-agent"), Path("/tmp/.buildx-cache-agent-new")
          if old.exists():
              shutil.rmtree(old, ignore_errors=True)
          if new.exists():
              new.rename(old)
          PY

  # GITHUB_TOKEN merge/push does not always chain workflow_run; dispatch explicitly.
  trigger-verify:
    name: trigger-verify
    needs: [build-api, build-web, build-agent-runtime]
    if: >
      always() &&
      needs.build-api.result == 'success' &&
      needs.build-web.result == 'success' &&
      needs.build-agent-runtime.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Dispatch Verify Dev
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"
          if ! command -v gh >/dev/null 2>&1; then
            mkdir -p "${HOME}/.local/bin"
            ver="2.67.0"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
              | tar -xz -C /tmp
            mv "/tmp/gh_${ver}_linux_amd64/bin/gh" "${HOME}/.local/bin/gh"
          fi
          gh workflow run verify-dev.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched Verify Dev"