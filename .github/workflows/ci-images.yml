name: CI Images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/flutter/**"
      - "packages/cabinet-packs/**"
      - "packages/schemas/**"
      - ".gitmodules"
      - ".github/workflows/ci-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

# Every runner lives on ONE VM: stacking image builds (each ~2 GB of layers)
# on top of each other is what pushed the CI disk to 84%. Newest push wins.
concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    runs-on: [self-hosted, linux, docker]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      push: ${{ steps.meta.outputs.push }}
      owner: ${{ steps.meta.outputs.owner }}
      api: ${{ steps.meta.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          python3 - <<'PY'
          import os
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          registry = os.environ["REGISTRY"]
          sha = os.environ["GITHUB_SHA"][:12]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          out = os.environ["GITHUB_OUTPUT"]
          lines = [
              f"owner={owner}",
              f"api={registry}/{owner}/agentscale-api",
          ]
          if event == "pull_request":
              lines += ["tag=pr-local", "push=false"]
          else:
              lines += [f"tag={sha}", "push=true"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Use persistent buildx builder
        run: |
          set -euo pipefail
          # One long-lived buildkitd on the CI VM (docker-container driver,
          # name agentscale-ci). Layer cache AND RUN cache mounts (pip, pub)
          # live in its state volume and survive across jobs/PRs/deploys.
          # GC cap: /etc/buildkit/buildkitd.toml on the runner host (50Gi/30d).
          # All VM runners share the `runner` user's docker CLI store, so the
          # create/use race between parallel jobs is idempotent.
          if ! docker buildx inspect agentscale-ci >/dev/null 2>&1; then
            docker buildx create --name agentscale-ci \
              --driver docker-container \
              --driver-opt network=host \
              --config /etc/buildkit/buildkitd.toml \
              || docker buildx create --name agentscale-ci \
                --driver docker-container --driver-opt network=host
          fi
          docker buildx use agentscale-ci
          docker buildx inspect --bootstrap agentscale-ci >/dev/null

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest

      - name: Migration smoke (image ORM ↔ alembic)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}"
          NAME="agentscale-migrate-smoke-${{ github.run_id }}-${{ github.job }}"
          NET="${NAME}-net"
          docker rm -f "$NAME" 2>/dev/null || true
          docker network rm "$NET" 2>/dev/null || true
          docker network create "$NET"
          # Same user-defined bridge: migrate resolves Postgres by container name.
          # Avoid host.docker.internal — engine dns overrides break that special name.
          docker run -d --name "$NAME" --network "$NET" \
            -e POSTGRES_USER=agentscale \
            -e POSTGRES_PASSWORD=agentscale \
            -e POSTGRES_DB=agentscale \
            postgres:16.15
          echo "Postgres $NAME on docker network $NET"
          for i in $(seq 1 30); do
            if docker exec "$NAME" pg_isready -U agentscale -d agentscale; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Postgres did not become ready" >&2
              docker network rm "$NET" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          DATABASE_URL="postgresql+asyncpg://agentscale:agentscale@${NAME}:5432/agentscale"
          docker run --rm --network "$NET" \
            -e DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" ./scripts/migrate.sh
          # -v removes the anonymous postgres volume: without it every smoke run
          # leaks ~140 MB and the CI VM disk fills up unnoticed.
          docker rm -fv "$NAME"
          docker network rm "$NET"

      - name: Reclaim disk (dangling volumes + stale images)
        if: always()
        run: |
          set -euo pipefail
          # Belt-and-braces: a cancelled/failed run must not leave its smoke
          # container, anonymous volume or stale sha-tagged image behind.
          docker rm -fv "agentscale-migrate-smoke-${{ github.run_id }}-${{ github.job }}" 2>/dev/null || true
          docker volume prune -f >/dev/null 2>&1 || true
          # Keep only the two newest sha tags per repo (rollback window); k3s
          # runs from containerd, so docker-side sha images are CI leftovers.
          for repo in agentscale-api agentscale-web; do
            docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedAt}}' \
              | grep -E "^${REGISTRY}/[^/]+/${repo}:[0-9a-f]{12} " \
              | sort -k2 -r | tail -n +3 | awk '{print $1}' \
              | xargs -r -n1 docker rmi >/dev/null 2>&1 || true
          done
          df -h /

  build-web:
    needs: [build-api]
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          python3 - <<'PY'
          import os
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          registry = os.environ["REGISTRY"]
          sha = os.environ["GITHUB_SHA"][:12]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          out = os.environ["GITHUB_OUTPUT"]
          lines = [f"web={registry}/{owner}/agentscale-web"]
          if event == "pull_request":
              lines += ["tag=pr-local", "push=false"]
          else:
              lines += [f"tag={sha}", "push=true"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Use persistent buildx builder
        run: |
          set -euo pipefail
          # Shared long-lived buildkitd on the CI VM (see build-api job).
          if ! docker buildx inspect agentscale-ci >/dev/null 2>&1; then
            docker buildx create --name agentscale-ci \
              --driver docker-container \
              --driver-opt network=host \
              --config /etc/buildkit/buildkitd.toml \
              || docker buildx create --name agentscale-ci \
                --driver docker-container --driver-opt network=host
          fi
          docker buildx use agentscale-ci
          docker buildx inspect --bootstrap agentscale-ci >/dev/null

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build Flutter web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/flutter/Dockerfile
          target: runtime
          push: ${{ steps.meta.outputs.push }}
          provenance: false
          sbom: false
          build-args: |
            BUILD_ID=${{ github.sha }}
            BUILD_NAME=1.0.0
            BUILD_NUMBER=${{ github.run_number }}
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest

  # WAVE17 — searchnet (web-search gateway, сабмодуль ../searchnet). Образ
  # тяжёлый (~4.4GB: camoufox+chromium бинари) и не зависит от кода apps/*,
  # поэтому собирается ТОЛЬКО по workflow_dispatch (смена пина сабмодуля
  # searchnet). Пин версий браузерных пакетов в Dockerfile.recovery обязан
  # совпадать с poetry.lock, иначе кэш-слои расходятся с ревизиями chromium.
  build-searchnet:
    if: github.event_name == 'workflow_dispatch' && needs.build-web.result == 'success'
    needs: [build-api, build-web]
    timeout-minutes: 45
    runs-on: [self-hosted, linux, docker]
    steps:
      # searchnet — отдельный публичный репозиторий (ne-tort/searchnet); в этой
      # репе сабмодуля нет (суперрепозиторий — локальная рабочая копия). Чекаутим
      # исходник прямо из GitHub по коммиту пина из infra/k3s/base/platform/searchnet.yaml.
      - name: Clone searchnet source (private — GHCR_PUSH_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1             "https://x-access-token:${GH_TOKEN}@github.com/ne-tort/searchnet.git" searchnet

      - name: Image names
        id: meta
        run: |
          python3 - <<'PY'
          import os
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          registry = os.environ["REGISTRY"]
          sha = os.environ["GITHUB_SHA"][:12]
          out = os.environ["GITHUB_OUTPUT"]
          lines = [
              f"searchnet={registry}/{owner}/searchnet",
              f"tag={sha}",
              "push=true",
          ]
          with open(out, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Use persistent buildx builder
        run: |
          set -euo pipefail
          if ! docker buildx inspect agentscale-ci >/dev/null 2>&1; then
            docker buildx create --name agentscale-ci \
              --driver docker-container \
              --driver-opt network=host \
              --config /etc/buildkit/buildkitd.toml \
              || docker buildx create --name agentscale-ci \
                --driver docker-container --driver-opt network=host
          fi
          docker buildx use agentscale-ci
          docker buildx inspect --bootstrap agentscale-ci >/dev/null

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # Recovery-путь: свежий camoufox fetch / playwright download с CI-VM
      # стабильно падает (GitHub 403 rate-limit / CDN EOF). Браузерные кэши
      # берём из предыдущего успешно собранного образа в GHCR; source-слои
      # (pip install из pyproject+src) пересобираются как обычно.
      - name: Pull previous searchnet image (browser caches)
        run: |
          set -euo pipefail
          docker pull ${{ steps.meta.outputs.searchnet }}:latest || \
            echo "no previous image — first build will fetch browsers from upstream"

      - name: Build searchnet image (recovery path)
        uses: docker/build-push-action@v6
        with:
          context: searchnet
          file: searchnet/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.searchnet }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.searchnet }}:latest

  trigger-verify:
    name: trigger-verify
    needs: [build-api, build-web]
    if: >
      always() &&
      needs.build-api.result == 'success' &&
      needs.build-web.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Dispatch Verify Dev
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"
          if ! command -v gh >/dev/null 2>&1; then
            mkdir -p "${HOME}/.local/bin"
            ver="2.67.0"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
              | tar -xz -C /tmp
            mv "/tmp/gh_${ver}_linux_amd64/bin/gh" "${HOME}/.local/bin/gh"
          fi
          gh workflow run verify-dev.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched Verify Dev"