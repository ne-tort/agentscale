# Plugin source -> dry-run -> quarantine -> verify -> digest promotion -> release verify -> platform publication.
#
# No action tags are used: this repository currently has no reviewed full-SHA
# action pins. Source checkout uses an immutable commit and does not persist
# credentials. Cosign/ORAS are installed only after release trust validation,
# with an exact version and mandatory protected SHA256 variable.
#
# Direct push/dispatch release uses only the exact protected default-branch
# identity. Reusable workflow_call callers must reference this workflow by a full
# 40-character commit SHA. Platform publication requires protected source
# provisioning plus independent release scan/CSP evidence. Dry-run remains useful
# without those inputs and receives no write/OIDC permissions.

name: Plugin OCI Artifacts

on:
  pull_request:
    paths:
      - "packages/plugins/**"
      - ".github/workflows/plugin-artifacts.yml"
      - ".github/scripts/plugin_*.py"
      - "apps/api/tests/unit/plugins/test_ci_plugin_*.py"
  push:
    branches: [main]
    paths:
      - "packages/plugins/**"
      - ".github/workflows/plugin-artifacts.yml"
      - ".github/scripts/plugin_*.py"
      - "apps/api/tests/unit/plugins/test_ci_plugin_*.py"
  workflow_dispatch:
    inputs:
      plugin_dir:
        description: "Source directory, independent of canonical manifest plugin_id"
        required: false
        default: ""
        type: string
      manifest_path:
        description: "Optional manifest path relative to repository; must stay in plugin_dir"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      plugin_dir:
        description: "Source directory, independent of canonical manifest plugin_id"
        required: true
        type: string
      manifest_path:
        required: false
        default: ""
        type: string
      trusted_workflow_ref:
        description: "ne-tort/agentscale/.github/workflows/plugin-artifacts.yml@<full commit SHA>"
        required: true
        type: string
      expected_repository:
        required: true
        type: string
      expected_repository_id:
        required: true
        type: string
      default_branch_ref:
        description: "Protected default branch ref, for example refs/heads/main"
        required: true
        type: string
      enable_release:
        description: "Request release after caller push/dispatch; OIDC and platform gates still apply"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: plugin-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ARTIFACT_TYPE: application/vnd.agentscale.plugin.oci
  PLUGIN_MANIFEST_MEDIA_TYPE: application/vnd.agentscale.plugin.manifest.v1+json
  FRONTEND_MEDIA_TYPE: application/vnd.agentscale.plugin.frontend
  MIGRATIONS_MEDIA_TYPE: application/vnd.agentscale.plugin.liquibase+xml
  COSIGN_VERSION: "2.4.1"
  ORAS_VERSION: "1.2.3"
  COSIGN_LINUX_AMD64_SHA256: ${{ vars.PLUGIN_COSIGN_2_4_1_LINUX_AMD64_SHA256 || '' }}
  ORAS_LINUX_AMD64_SHA256: ${{ vars.PLUGIN_ORAS_1_2_3_LINUX_AMD64_SHA256 || '' }}
  BUILDKIT_IMAGE: ${{ vars.PLUGIN_BUILDKIT_IMAGE || '' }} # moby/buildkit:vX.Y.Z@sha256:...
  # Dockerfile объявляет ARG без дефолта (дефолт запрещён template-тестом),
  # поэтому значения обязаны прийти build-arg-ом. Пустое значение отвергает
  # сам Dockerfile: fail-closed остаётся на его стороне.
  PYTHON_BASE_IMAGE: ${{ vars.PLUGIN_PYTHON_BASE_IMAGE || '' }}
  LIQUIBASE_SHA256: ${{ vars.PLUGIN_LIQUIBASE_SHA256 || '' }}

jobs:
  dry-run:
    name: PR/pre-merge validation and local build (no registry writes)
    # Как в ci-images.yml/ci-e2e.yml: сборка требует Docker daemon, которого на
    # чистый ubuntu-latest нет. Это же площадка с buildx и локальным реестром.
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: none
      id-token: none
    outputs:
      plugin_dir: ${{ steps.inputs.outputs.plugin_dir }}
      plugin_id: ${{ steps.manifest.outputs.plugin_id }}
    steps:
      - name: Checkout immutable source without persisted credentials
        # The repository is public, so this is an ordinary anonymous read: no
        # credential is placed in the clone at all. Pinning is enforced by the
        # detached checkout plus the exact SHA equality test below, so the
        # result is the same immutable commit a token would have fetched.
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/plugin-source"
          GIT_TERMINAL_PROMPT=0 git clone --filter=blob:none --no-checkout \
            "https://github.com/$GITHUB_REPOSITORY.git" "$SOURCE"
          git -C "$SOURCE" -c advice.detachedHead=false checkout --detach "$GITHUB_SHA"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"

      - name: Resolve plugin directory and trusted CI scripts
        id: inputs
        env:
          INPUT_PLUGIN_DIR: ${{ inputs.plugin_dir }}
          INPUT_WORKFLOW_REF: ${{ inputs.trusted_workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "ne-tort/agentscale" && -z "$INPUT_WORKFLOW_REF" ]]; then
            CI_DIR="$SOURCE_DIR/.github/scripts"
            BUILDER_ID="ne-tort/agentscale/.github/workflows/plugin-artifacts.yml@$GITHUB_REF"
          else
            [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::reusable workflow must be pinned by full commit SHA"; exit 1;
            }
            EXPECTED="ne-tort/agentscale/.github/workflows/plugin-artifacts.yml@$WORKFLOW_SHA"
            [[ "$INPUT_WORKFLOW_REF" == "$EXPECTED" ]] || {
              echo "::error::trusted_workflow_ref does not match the pinned reusable workflow"; exit 1;
            }
            TRUSTED="$RUNNER_TEMP/trusted-plugin-ci"
            # Public read only. A private platform repository requires a future
            # short-lived GitHub App contract; no shared push token is accepted.
            git clone --filter=blob:none --no-checkout               https://github.com/ne-tort/agentscale.git "$TRUSTED"
            git -C "$TRUSTED" -c advice.detachedHead=false checkout --detach "$WORKFLOW_SHA"
            test "$(git -C "$TRUSTED" rev-parse HEAD)" = "$WORKFLOW_SHA"
            CI_DIR="$TRUSTED/.github/scripts"
            BUILDER_ID="$EXPECTED"
          fi
          PLUGIN_DIR="$INPUT_PLUGIN_DIR"           SOURCE_DIR="$SOURCE_DIR"           CI_DIR="$CI_DIR"           BUILDER_ID="$BUILDER_ID"           python3 - <<'PY'
          import os
          from pathlib import Path

          plugin_dir = os.environ["PLUGIN_DIR"].strip()
          if not plugin_dir:
              root = Path(os.environ["SOURCE_DIR"])
              candidates = sorted(
                  path.parent.relative_to(root).as_posix()
                  for path in (root / "packages" / "plugins").glob("*/manifest.json")
              )
              if len(candidates) != 1:
                  raise SystemExit(
                      "::error::plugin_dir is required when the changed plugin cannot be resolved uniquely; "
                      f"candidates={candidates}"
                  )
              plugin_dir = candidates[0]
          if Path(plugin_dir).is_absolute() or ".." in Path(plugin_dir).parts:
              raise SystemExit("::error::plugin_dir must be a safe relative path")
          ci_dir = Path(os.environ["CI_DIR"])
          for name in ("plugin_manifest_builder.py", "plugin_verify.py", "plugin_publication.py"):
              if not (ci_dir / name).is_file():
                  raise SystemExit(f"::error::trusted CI script is missing: {name}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PLUGIN_DIR={plugin_dir}\n")
              handle.write(f"CI_DIR={ci_dir}\n")
              handle.write(f"TRUSTED_BUILDER_ID={os.environ['BUILDER_ID']}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"plugin_dir={plugin_dir}\n")
          PY

      - name: Validate manifest, protocol fixture and compatible source layout
        id: manifest
        env:
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          PREPARE="$RUNNER_TEMP/plugin-prepare"
          # ORAS intentionally rejects absolute file paths in file refs. Work
          # from the parent of the prepare directory so bundle inputs stay
          # relative to the current working directory.
          WORKSPACE="$(dirname "$PREPARE")"
          cd "$WORKSPACE"
          python3 "$CI_DIR/plugin_manifest_builder.py" prepare             --source-root "$SOURCE_DIR"             --plugin-dir "$PLUGIN_DIR"             --manifest-path "$INPUT_MANIFEST_PATH"             --output-dir "$PREPARE"             --base-image-arg "$PYTHON_BASE_IMAGE" > "$RUNNER_TEMP/resolved.json"
          python3 - <<'PY'
          import json
          import os

          resolved = json.load(open(os.environ["RUNNER_TEMP"] + "/resolved.json", encoding="utf-8"))
          mapping = {
              "PLUGIN_ID": "plugin_id",
              "PLUGIN_VERSION": "version",
              "MIN_PLATFORM_VERSION": "min_platform_version",
              "SOURCE_MANIFEST": "manifest_path",
              "CANONICAL_MANIFEST": "canonical_manifest",
              "FRONTEND_ARCHIVE": "frontend_archive",
              "MIGRATIONS_ARCHIVE": "migrations_archive",
              "DOCKERFILE": "dockerfile",
              "BUILD_CONTEXT": "docker_context",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for environment_name, key in mapping.items():
                  handle.write(f"{environment_name}={resolved[key]}\n")
              handle.write("CAPABILITIES=" + ",".join(resolved["capabilities"]) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"plugin_id={resolved['plugin_id']}\n")
          PY

      - name: Run stdlib focused and module contract tests
        run: |
          set -euo pipefail
          for TEST_FILE in test_ci_plugin_supply_chain.py test_ci_plugin_publication.py; do
            if [[ -f "$SOURCE_DIR/apps/api/tests/unit/plugins/$TEST_FILE" ]]; then
              PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover                 -s "$SOURCE_DIR/apps/api/tests/unit/plugins" -p "$TEST_FILE"
            fi
          done
          if [[ -d "$BUILD_CONTEXT/tests/contract" ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover               -s "$BUILD_CONTEXT/tests/contract" -p "test_*.py"
          elif [[ "$GITHUB_REPOSITORY" != "ne-tort/agentscale" ]]; then
            echo "::error::standalone plugin must provide stdlib tests/contract"; exit 1
          fi

      - name: Create fresh ephemeral builder and build locally without push
        id: local_build
        run: |
          set -euo pipefail
          # buildx на раннере падал с "context not found: .../contexts/meta/<hash>".
          # Причина — не отсутствие контекста, а DOCKER_HOST: когда он задан,
          # docker считает окружение внешним и не пишет каталог контекста.
          # Локальная сборка работает с сокетом напрямую, поэтому фиксируем его.
          # Имя НЕ DOCKER_CONTEXT: docker CLI трактует эту переменную как имя
          # своего контекста и падал с "context not found" на пути к исходникам.
          # build context. Очищаем только DOCKER_HOST.
          export DOCKER_HOST=""
          docker --version
          docker context use default >/dev/null 2>&1 || true
          BUILDER="plugin-dry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "BUILDER_NAME=$BUILDER" >> "$GITHUB_ENV"
          [[ "$BUILDKIT_IMAGE" =~ ^moby/buildkit:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::BLOCKER: PLUGIN_BUILDKIT_IMAGE must pin moby/buildkit version and digest"; exit 1;
          }
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --driver-opt network=host --use
          docker buildx inspect --bootstrap "$BUILDER"
          docker buildx build --load             --provenance=false --sbom=false             --build-arg "PYTHON_BASE_IMAGE=$PYTHON_BASE_IMAGE"             --build-arg "LIQUIBASE_SHA256=$LIQUIBASE_SHA256"             --file "$DOCKERFILE"             --tag "local/$PLUGIN_ID:sha-$GITHUB_SHA"             "$BUILD_CONTEXT"

      - name: Remove dry-run builder
        if: always()
        run: |
          if [[ -n "${BUILDER_NAME:-}" ]]; then
            docker buildx rm -f "$BUILDER_NAME" || true
          fi

      - name: Dry-run trust boundary summary
        run: |
          {
            echo "### Plugin dry-run"
            echo "No GHCR login/push, packages:write, id-token, signing, release, or persistent builder credentials were used."
            echo "Resolved plugin_id=$PLUGIN_ID from plugin_dir=$PLUGIN_DIR at $GITHUB_SHA."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Quarantine sign/verify then promote by digest
    needs: dry-run
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (inputs.enable_release == true && github.event_name == 'workflow_call') ||
        (inputs.enable_release == true && github.event_name == 'push')
      )
    # Как в ci-images.yml/ci-e2e.yml: сборка требует Docker daemon, которого на
    # чистый ubuntu-latest нет. Это же площадка с buildx и локальным реестром.
    runs-on: [self-hosted, linux, docker]
    environment: plugin-release
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # GitHub environment-owned typed provisioning, never workflow input.
      PLUGIN_PLATFORM_PUBLICATION_CONFIG: ${{ vars.PLUGIN_PLATFORM_PUBLICATION_CONFIG || '' }}
      # Optional exact HTTP base URLs for protected internal development only.
      PLUGIN_PLATFORM_DEV_HTTP_ALLOWLIST: ${{ vars.PLUGIN_PLATFORM_DEV_HTTP_ALLOWLIST || '' }}
    outputs:
      backend_ref: ${{ steps.release_verify.outputs.backend_ref }}
      artifact_ref: ${{ steps.release_verify.outputs.artifact_ref }}
      decision: ${{ steps.release_verify.outputs.decision }}
    steps:
      - name: Checkout immutable source without persisted credentials
        # The repository is public, so this is an ordinary anonymous read: no
        # credential is placed in the clone at all. Pinning is enforced by the
        # detached checkout plus the exact SHA equality test below, so the
        # result is the same immutable commit a token would have fetched.
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/plugin-source"
          GIT_TERMINAL_PROMPT=0 git clone --filter=blob:none --no-checkout \
            "https://github.com/$GITHUB_REPOSITORY.git" "$SOURCE"
          git -C "$SOURCE" -c advice.detachedHead=false checkout --detach "$GITHUB_SHA"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"

      - name: Resolve trusted CI scripts at full reusable SHA
        env:
          PLUGIN_DIR: ${{ needs.dry-run.outputs.plugin_dir }}
          INPUT_WORKFLOW_REF: ${{ inputs.trusted_workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "ne-tort/agentscale" && -z "$INPUT_WORKFLOW_REF" ]]; then
            CI_DIR="$SOURCE_DIR/.github/scripts"
          else
            [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::reusable release requires full reusable commit SHA"; exit 1;
            }
            EXPECTED="ne-tort/agentscale/.github/workflows/plugin-artifacts.yml@$WORKFLOW_SHA"
            [[ "$INPUT_WORKFLOW_REF" == "$EXPECTED" ]] || {
              echo "::error::reusable workflow identity mismatch"; exit 1;
            }
            TRUSTED="$RUNNER_TEMP/trusted-plugin-ci"
            git clone --filter=blob:none --no-checkout               https://github.com/ne-tort/agentscale.git "$TRUSTED"
            git -C "$TRUSTED" -c advice.detachedHead=false checkout --detach "$WORKFLOW_SHA"
            test "$(git -C "$TRUSTED" rev-parse HEAD)" = "$WORKFLOW_SHA"
            CI_DIR="$TRUSTED/.github/scripts"
          fi
          echo "CI_DIR=$CI_DIR" >> "$GITHUB_ENV"
          test -f "$CI_DIR/plugin_manifest_builder.py"
          test -f "$CI_DIR/plugin_verify.py"
          test -f "$CI_DIR/plugin_publication.py"

      - name: Validate GitHub OIDC source and workflow trust before any write
        id: trust
        env:
          EXPECTED_REPOSITORY: ${{ inputs.expected_repository || github.repository }}
          # ReleaseTrust сверяет это значение с GITHUB_REPOSITORY_ID, поэтому
          # обе стороны обязаны прийти: иначе release падает на
          # GITHUB_SOURCE_CONTEXT_INVALID ещё до любой записи.
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_REPOSITORY_ID: ${{ inputs.expected_repository_id || vars.PLUGIN_PLATFORM_REPOSITORY_ID || '' }}
          EXPECTED_REF: ${{ inputs.default_branch_ref || format('refs/heads/{0}', github.event.repository.default_branch) }}
          INPUT_WORKFLOW_REF: ${{ inputs.trusted_workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PLUGIN_ID: ${{ needs.dry-run.outputs.plugin_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import importlib.util
          import json
          import os
          import sys

          def fail(message):
              raise SystemExit("::error::" + message)

          spec = importlib.util.spec_from_file_location(
              "trusted_plugin_publication",
              os.path.join(os.environ["CI_DIR"], "plugin_publication.py"),
          )
          if spec is None or spec.loader is None:
              fail("trusted publication helper could not be loaded")
          publication = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = publication
          try:
              spec.loader.exec_module(publication)
          except Exception:
              fail("trusted publication helper could not be loaded")
          try:
              trust = publication.ReleaseTrust.from_environment(os.environ)
          except publication.PublicationBlocked as exc:
              fail(exc.code)
          except Exception:
              fail("trusted release context is invalid")

          # The shared helper rejects redirects, environment proxies, unexpected
          # hosts, oversized responses and pre-existing audience parameters.
          try:
              token = publication.fetch_github_oidc(
                  publication.UrllibTransport(), os.environ
              )
          except publication.PublicationBlocked as exc:
              fail(exc.code)
          try:
              parts = token.split(".")
              payload = json.loads(
                  base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4))
              )
          except Exception:
              fail("GitHub OIDC token is malformed")
          try:
              publication.validate_release_oidc_claims(payload, trust=trust)
          except publication.PublicationBlocked as exc:
              fail(exc.code)

          builder = trust.builder_identity
          repository = trust.expected_repository
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TRUSTED_BUILDER_ID={builder}\n")
              handle.write(f"SIGNER_IDENTITY=https://github.com/{builder}\n")
              handle.write(f"REGISTRY_OWNER={repository.split('/')[0].lower()}\n")
          PY
          # GITHUB_ENV is only applied to *later* steps. Reading
          # $TRUSTED_BUILDER_ID here is empty under `set -u`, which aborted the
          # release before any registry write with a bare "parameter not set". Derive
          # the same value in this step instead of re-reading the env file.
          TRUSTED_BUILDER_ID="ne-tort/agentscale/.github/workflows/plugin-artifacts.yml@$GITHUB_REF"
          # This typed protected mapping is required before any registry write.
          # Backend OIDC validation and durable approval remain authoritative later.
          python3 "$CI_DIR/plugin_publication.py" validate-context             --plugin-id "$PLUGIN_ID" --builder-identity "$TRUSTED_BUILDER_ID"

      - name: Install cosign and ORAS by version plus protected checksum
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || { echo "::error::only pinned linux/amd64 tools are configured"; exit 1; }
          [[ "$COSIGN_LINUX_AMD64_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::BLOCKER: protected cosign 2.4.1 SHA256 is unknown/not configured"; exit 1;
          }
          [[ "$ORAS_LINUX_AMD64_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::BLOCKER: protected ORAS 1.2.3 archive SHA256 is unknown/not configured"; exit 1;
          }
          TOOLS="$RUNNER_TEMP/plugin-tools"
          mkdir -p "$TOOLS"
          curl --proto '=https' --tlsv1.2 -fsSL             "https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION/cosign-linux-amd64"             -o "$TOOLS/cosign"
          echo "$COSIGN_LINUX_AMD64_SHA256  $TOOLS/cosign" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -fsSL             "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz"             -o "$TOOLS/oras.tar.gz"
          echo "$ORAS_LINUX_AMD64_SHA256  $TOOLS/oras.tar.gz" | sha256sum -c -
          tar -xzf "$TOOLS/oras.tar.gz" -C "$TOOLS" oras
          chmod 0555 "$TOOLS/cosign" "$TOOLS/oras"
          echo "$TOOLS" >> "$GITHUB_PATH"
          # GITHUB_PATH is applied to *later* steps only. Verifying with the bare
          # names here is "command not found" and aborted the release before any
          # registry write, even though both binaries had just been installed.
          "$TOOLS/cosign" version | grep -F "$COSIGN_VERSION"
          "$TOOLS/oras" version | grep -F "$ORAS_VERSION"

      - name: Revalidate manifest, layout and protocol before quarantine build
        run: |
          set -euo pipefail
          PREPARE="$RUNNER_TEMP/plugin-prepare"
          # ORAS intentionally rejects absolute file paths in file refs. Work
          # from the parent of the prepare directory so bundle inputs stay
          # relative to the current working directory.
          WORKSPACE="$(dirname "$PREPARE")"
          cd "$WORKSPACE"
          python3 "$CI_DIR/plugin_manifest_builder.py" prepare             --source-root "$SOURCE_DIR"             --plugin-dir "${{ needs.dry-run.outputs.plugin_dir }}"             --manifest-path "${{ inputs.manifest_path }}"             --output-dir "$PREPARE"             --base-image-arg "$PYTHON_BASE_IMAGE" > "$RUNNER_TEMP/resolved.json"
          python3 - <<'PY'
          import json
          import os

          resolved = json.load(open(os.environ["RUNNER_TEMP"] + "/resolved.json", encoding="utf-8"))
          mapping = {
              "PLUGIN_ID": "plugin_id", "PLUGIN_VERSION": "version",
              "SOURCE_MANIFEST": "manifest_path", "CANONICAL_MANIFEST": "canonical_manifest",
              "FRONTEND_ARCHIVE": "frontend_archive", "MIGRATIONS_ARCHIVE": "migrations_archive",
              "DOCKERFILE": "dockerfile", "BUILD_CONTEXT": "docker_context",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for environment_name, key in mapping.items():
                  handle.write(f"{environment_name}={resolved[key]}\n")
              owner = os.environ["REGISTRY_OWNER"]
              plugin_id = resolved["plugin_id"]
              handle.write(f"QUAR_BACKEND=ghcr.io/{owner}/plugins-quarantine/{plugin_id}/backend\n")
              handle.write(f"QUAR_BUNDLE=ghcr.io/{owner}/plugins-quarantine/{plugin_id}/bundle\n")
              handle.write(f"RELEASE_BACKEND=ghcr.io/{owner}/plugins/{plugin_id}/backend\n")
              handle.write(f"RELEASE_BUNDLE=ghcr.io/{owner}/plugins/{plugin_id}/bundle\n")
          PY

      - name: Login to GHCR only after trust validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login "$REGISTRY"             --username "$GITHUB_ACTOR" --password-stdin

      - name: Create fresh ephemeral release builder
        run: |
          set -euo pipefail
          # Имя НЕ DOCKER_CONTEXT: docker CLI трактует эту переменную как имя
          # своего контекста и падал с "context not found" на пути к исходникам.
          # build context. Очищаем только DOCKER_HOST.
          export DOCKER_HOST=""
          docker context use default >/dev/null 2>&1 || true
          BUILDER="plugin-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "BUILDER_NAME=$BUILDER" >> "$GITHUB_ENV"
          [[ "$BUILDKIT_IMAGE" =~ ^moby/buildkit:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::BLOCKER: PLUGIN_BUILDKIT_IMAGE must pin moby/buildkit version and digest"; exit 1;
          }
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --driver-opt network=host --use
          docker buildx inspect --bootstrap "$BUILDER"

      - name: Build and push backend only to quarantine with buildx evidence
        id: backend_build
        run: |
          set -euo pipefail
          # BuildKit defaults to an empty builder.id. The evidence validator
          # rejects that before signing, so bind provenance to the same trusted
          # workflow identity that cosign will use.
          docker buildx build --push             --provenance="mode=max,builder-id=https://github.com/$TRUSTED_BUILDER_ID" --sbom=true             --build-arg "PYTHON_BASE_IMAGE=$PYTHON_BASE_IMAGE"             --build-arg "LIQUIBASE_SHA256=$LIQUIBASE_SHA256"             --metadata-file "$RUNNER_TEMP/backend-build-metadata.json"             --file "$DOCKERFILE"             --tag "$QUAR_BACKEND:sha-$GITHUB_SHA"             "$BUILD_CONTEXT"
          BACKEND_DIGEST="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/backend-build-metadata.json")"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::buildx did not return a valid backend digest"; exit 1;
          }
          test "$(oras resolve "$QUAR_BACKEND:sha-$GITHUB_SHA")" = "$BACKEND_DIGEST"
          BACKEND_REF="$QUAR_BACKEND@$BACKEND_DIGEST"
          {
            echo "BACKEND_DIGEST=$BACKEND_DIGEST"
            echo "BACKEND_REF=$BACKEND_REF"
          } >> "$GITHUB_ENV"

      - name: Extract backend buildx SBOM and provenance from actual image descriptors
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/backend-evidence"
          mkdir -p "$EVIDENCE"
          docker buildx imagetools inspect --raw "$BACKEND_REF" > "$EVIDENCE/backend-index.json"
          python3 - <<'PY'
          import json
          import os
          import re

          root = os.environ["RUNNER_TEMP"] + "/backend-evidence"
          index = json.load(open(root + "/backend-index.json", encoding="utf-8"))
          descriptors = index.get("manifests", [])
          images = [item for item in descriptors if item.get("platform") and item.get("annotations", {}).get("vnd.docker.reference.type") != "attestation-manifest"]
          if len(images) != 1:
              raise SystemExit("::error::expected exactly one backend platform image")
          image_digest = images[0].get("digest", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest):
              raise SystemExit("::error::invalid backend image manifest digest")
          attestations = [
              item["digest"] for item in descriptors
              if item.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"
              and item.get("annotations", {}).get("vnd.docker.reference.digest") == image_digest
          ]
          if not attestations:
              raise SystemExit("::error::buildx attestation descriptors are missing")
          with open(root + "/manifest-digests.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(attestations) + "\n")
          with open(root + "/image-manifest-digest.txt", "w", encoding="utf-8") as handle:
              handle.write(image_digest + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"BACKEND_IMAGE_MANIFEST_DIGEST={image_digest}\n")
          PY
          # GITHUB_ENV applies to later steps only. Read the exact digest just
          # computed instead of expanding an empty variable under `set -u` here.
          BACKEND_IMAGE_MANIFEST_DIGEST="$(< "$EVIDENCE/image-manifest-digest.txt")"
          [[ "$BACKEND_IMAGE_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::invalid backend image manifest digest"; exit 1;
          }
          INDEX=0
          while IFS= read -r MANIFEST_DIGEST; do
            [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            MANIFEST="$EVIDENCE/attestation-$INDEX.json"
            oras manifest fetch "$QUAR_BACKEND@$MANIFEST_DIGEST" > "$MANIFEST"
            python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("\n".join(x["digest"] for x in m.get("layers", [])))'               "$MANIFEST" > "$EVIDENCE/layers-$INDEX.txt"
            LAYER=0
            while IFS= read -r LAYER_DIGEST; do
              [[ "$LAYER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
              oras blob fetch --output "$EVIDENCE/statement-$INDEX-$LAYER.json"                 "$QUAR_BACKEND@$LAYER_DIGEST"
              LAYER=$((LAYER + 1))
            done < "$EVIDENCE/layers-$INDEX.txt"
            INDEX=$((INDEX + 1))
          done < "$EVIDENCE/manifest-digests.txt"
          python3 "$CI_DIR/plugin_manifest_builder.py" backend-evidence             --evidence-dir "$EVIDENCE"             --backend-image-manifest-digest "$BACKEND_IMAGE_MANIFEST_DIGEST"             --source-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"             --builder-id "$TRUSTED_BUILDER_ID" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"             --output-sbom "$RUNNER_TEMP/backend-sbom.json"             --output-provenance "$RUNNER_TEMP/backend-provenance.json"

      - name: Sign and attest quarantined backend by digest
        run: |
          set -euo pipefail
          cosign sign --yes "$BACKEND_REF"
          cosign attest --yes --predicate "$RUNNER_TEMP/backend-sbom.json"             --type spdxjson "$BACKEND_REF"
          cosign attest --yes --predicate "$RUNNER_TEMP/backend-provenance.json"             --type slsaprovenance "$BACKEND_REF"

      - name: Build and push canonical OCI bundle only to quarantine
        id: bundle_build
        run: |
          set -euo pipefail
          # ORAS rejects absolute file refs; build outputs live under
          # plugin-prepare, so run from its parent and reference them relatively.
          cd "$(dirname "$CANONICAL_MANIFEST")"
          python3 "$CI_DIR/plugin_manifest_builder.py" build             --source-manifest "$SOURCE_MANIFEST"             --canonical-manifest "$CANONICAL_MANIFEST"             --backend-ref "$RELEASE_BACKEND@$BACKEND_DIGEST"             --frontend-archive "$FRONTEND_ARCHIVE"             --migrations-archive "$MIGRATIONS_ARCHIVE"             --source-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"             --output "$RUNNER_TEMP/oci-manifest.json"             --annotation-output "$RUNNER_TEMP/oci-annotations.json"
          oras push "$QUAR_BUNDLE:sha-$GITHUB_SHA"             --artifact-type "$ARTIFACT_TYPE"             --config "$CANONICAL_MANIFEST:$PLUGIN_MANIFEST_MEDIA_TYPE"             --annotation-file "$RUNNER_TEMP/oci-annotations.json"             --export-manifest "$RUNNER_TEMP/pushed-manifest.json"             "canonical-manifest.json:$PLUGIN_MANIFEST_MEDIA_TYPE"             "frontend-dist.tar.gz:$FRONTEND_MEDIA_TYPE"             "migrations.tar.gz:$MIGRATIONS_MEDIA_TYPE"
          test -s "$RUNNER_TEMP/pushed-manifest.json"
          ARTIFACT_DIGEST="sha256:$(sha256sum "$RUNNER_TEMP/pushed-manifest.json" | awk '{print $1}')"
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          test "$(oras resolve "$QUAR_BUNDLE:sha-$GITHUB_SHA")" = "$ARTIFACT_DIGEST"
          [[ "$ARTIFACT_DIGEST" != "$BACKEND_DIGEST" ]] || {
            echo "::error::backend and bundle digests must be distinct"; exit 1;
          }
          {
            echo "ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
            echo "ARTIFACT_REF=$QUAR_BUNDLE@$ARTIFACT_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Generate independent bundle evidence, sign and attest by digest
        run: |
          set -euo pipefail
          python3 "$CI_DIR/plugin_manifest_builder.py" bundle-evidence             --source-manifest "$SOURCE_MANIFEST"             --oci-manifest "$RUNNER_TEMP/oci-manifest.json"             --bundle-digest "$ARTIFACT_DIGEST"             --source-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"             --builder-id "$TRUSTED_BUILDER_ID" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"             --output-sbom "$RUNNER_TEMP/bundle-sbom.json"             --output-provenance "$RUNNER_TEMP/bundle-provenance.json"
          cosign sign --yes "$ARTIFACT_REF"
          cosign attest --yes --predicate "$RUNNER_TEMP/bundle-sbom.json"             --type spdxjson "$ARTIFACT_REF"
          cosign attest --yes --predicate "$RUNNER_TEMP/bundle-provenance.json"             --type slsaprovenance "$ARTIFACT_REF"

      - name: Verify signatures and all evidence before any release write
        id: quarantine_verify
        env:
          PLATFORM_VERSION: ${{ vars.PLATFORM_VERSION || '' }}
          PLUGIN_GRANTED_CAPABILITIES: ${{ vars.PLUGIN_GRANTED_CAPABILITIES || '' }}
        run: |
          set -euo pipefail
          [[ -n "$PLATFORM_VERSION" && -n "$PLUGIN_GRANTED_CAPABILITIES" ]] || {
            echo "::error::protected platform version and independently reviewed grants are required"; exit 1;
          }
          python3 "$CI_DIR/plugin_verify.py"             --manifest "$RUNNER_TEMP/oci-manifest.json"             --source-manifest "$SOURCE_MANIFEST"             --canonical-manifest "$CANONICAL_MANIFEST"             --pushed-manifest "$RUNNER_TEMP/pushed-manifest.json"             --backend-digest "$BACKEND_DIGEST"             --artifact-ref "$ARTIFACT_REF" --backend-ref "$BACKEND_REF"             --source-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"             --builder-identity "$TRUSTED_BUILDER_ID"             --platform-version "$PLATFORM_VERSION"             --granted-capabilities "$PLUGIN_GRANTED_CAPABILITIES"             --certificate-identity "$SIGNER_IDENTITY"             --output "$RUNNER_TEMP/quarantine-decision.json"

      - name: Promote verified backend and bundle with all referrers by digest
        id: promote
        run: |
          set -euo pipefail
          oras copy --recursive "$QUAR_BACKEND@$BACKEND_DIGEST"             "$RELEASE_BACKEND@$BACKEND_DIGEST"
          oras copy --recursive "$QUAR_BUNDLE@$ARTIFACT_DIGEST"             "$RELEASE_BUNDLE@$ARTIFACT_DIGEST"
          test "$(oras resolve "$RELEASE_BACKEND@$BACKEND_DIGEST")" = "$BACKEND_DIGEST"
          test "$(oras resolve "$RELEASE_BUNDLE@$ARTIFACT_DIGEST")" = "$ARTIFACT_DIGEST"
          {
            echo "RELEASE_BACKEND_REF=$RELEASE_BACKEND@$BACKEND_DIGEST"
            echo "RELEASE_ARTIFACT_REF=$RELEASE_BUNDLE@$ARTIFACT_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Reverify actual release refs and copied referrers
        id: release_verify
        env:
          PLATFORM_VERSION: ${{ vars.PLATFORM_VERSION || '' }}
          PLUGIN_GRANTED_CAPABILITIES: ${{ vars.PLUGIN_GRANTED_CAPABILITIES || '' }}
        run: |
          set -euo pipefail
          python3 "$CI_DIR/plugin_verify.py"             --manifest "$RUNNER_TEMP/oci-manifest.json"             --source-manifest "$SOURCE_MANIFEST"             --canonical-manifest "$CANONICAL_MANIFEST"             --pushed-manifest "$RUNNER_TEMP/pushed-manifest.json"             --backend-digest "$BACKEND_DIGEST"             --artifact-ref "$RELEASE_ARTIFACT_REF" --backend-ref "$RELEASE_BACKEND_REF"             --source-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"             --builder-identity "$TRUSTED_BUILDER_ID"             --platform-version "$PLATFORM_VERSION"             --granted-capabilities "$PLUGIN_GRANTED_CAPABILITIES"             --certificate-identity "$SIGNER_IDENTITY"             --output "$RUNNER_TEMP/release-decision.json"

      - name: Verify independent release evidence and publish through platform OIDC
        env:
          DOCKER_CONFIG_PATH: ${{ runner.home }}/.docker/config.json
        run: |
          set -euo pipefail
          # The pinned Trivy scan targets the actual release backend. The CSP
          # probe targets protected static-origin evidence for this exact release
          # bundle. Either missing/failed input stops before the platform POST.
          python3 "$CI_DIR/plugin_publication.py" publish             --plugin-id "$PLUGIN_ID" --plugin-version "$PLUGIN_VERSION"             --builder-identity "$TRUSTED_BUILDER_ID"             --bundle-ref "$RELEASE_ARTIFACT_REF" --bundle-digest "$ARTIFACT_DIGEST"             --backend-ref "$RELEASE_BACKEND_REF" --backend-digest "$BACKEND_DIGEST"             --manifest "$RUNNER_TEMP/oci-manifest.json"             --release-decision "$RUNNER_TEMP/release-decision.json"             --scan-report "$RUNNER_TEMP/backend-release-scan.json"             --bundle-sbom "$RUNNER_TEMP/bundle-sbom.json"             --bundle-provenance "$RUNNER_TEMP/bundle-provenance.json"             --summary "$GITHUB_STEP_SUMMARY"

      - name: Logout and remove release builder
        if: always()
        run: |
          docker logout "$REGISTRY" || true
          if [[ -n "${BUILDER_NAME:-}" ]]; then
            docker buildx rm -f "$BUILDER_NAME" || true
          fi
