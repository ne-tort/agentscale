name: CI Flutter

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/flutter/**"
      - ".github/workflows/ci-flutter.yml"
  workflow_dispatch:

jobs:
  analyze:
    # github-hosted ubuntu-latest fails instantly in this org;
    # self-hosted runner image may lack xz for Flutter SDK tarball.
    runs-on: [self-hosted, linux, docker]
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq/xz for Flutter SDK extract
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          export PATH="${HOME}/.local/bin:${PATH}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          if ! command -v jq >/dev/null 2>&1; then
            curl -fsSL -o "${HOME}/.local/bin/jq" \
              https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x "${HOME}/.local/bin/jq"
          fi
          if ! command -v xz >/dev/null 2>&1; then
            echo "xz required but missing; install xz-utils on the runner host" >&2
            exit 1
          fi
          jq --version
          xz --version | head -1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: No raw Color hex outside palette
        run: |
          if grep -RIn --exclude=app_palette.dart 'Color(0x' lib; then
            echo "Raw Color(0x…) found outside app_palette.dart"
            exit 1
          fi
      - name: No entity modals in features
        run: |
          if [ -d lib/features ] && grep -RInE 'showDialog\(|AlertDialog\(|showModalBottomSheet\(' lib/features; then
            echo "Modal entity pickers forbidden in lib/features (use AppSelectorPage)"
            exit 1
          fi
