name: CI Flutter

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/flutter/**"
      - ".github/workflows/ci-flutter.yml"
  workflow_dispatch:

jobs:
  analyze:
    # github-hosted ubuntu-latest fails instantly in this org.
    # Flutter SDK + pub live on Docker volume /cache (see infra/github-runner).
    runs-on: [self-hosted, linux, docker]
    defaults:
      run:
        working-directory: apps/flutter
    env:
      # Runner compose sets these; shell defaults if missing
      PUB_CACHE: /cache/pub
      FLUTTER_SDK: /cache/flutter-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK (persistent /cache)
        run: |
          set -euo pipefail
          SDK="${FLUTTER_SDK:-/cache/flutter-sdk}"
          PUB="${PUB_CACHE:-/cache/pub}"
          mkdir -p /cache "$PUB"
          echo "PUB_CACHE=$PUB" >> "${GITHUB_ENV}"
          echo "$SDK/bin" >> "${GITHUB_PATH}"

          # One Flutter job at a time still races across PRs — lock clone/update.
          exec 9>/cache/flutter-sdk.lock
          flock 9

          if [ -x "$SDK/bin/flutter" ]; then
            echo "==> Flutter cache HIT: $SDK"
            "$SDK/bin/flutter" --version
          else
            echo "==> Flutter cache MISS — cloning stable into $SDK"
            rm -rf "$SDK"
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$SDK"
            "$SDK/bin/flutter" config --no-analytics
            "$SDK/bin/flutter" --version
            "$SDK/bin/flutter" precache --no-android --no-ios --no-linux --no-windows --no-macos || true
          fi

      - name: Ensure jq/xz
        run: |
          set -euo pipefail
          command -v jq
          command -v xz
          jq --version
          xz --version | head -1

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: No raw Color hex outside palette
        run: |
          if grep -RIn --exclude=app_palette.dart 'Color(0x' lib; then
            echo "Raw Color(0x…) found outside app_palette.dart"
            exit 1
          fi
      - name: No entity modals in features
        run: |
          if [ -d lib/features ] && grep -RInE 'showDialog\(|AlertDialog\(|showModalBottomSheet\(' lib/features; then
            echo "Modal entity pickers forbidden in lib/features (use AppSelectorPage)"
            exit 1
          fi
