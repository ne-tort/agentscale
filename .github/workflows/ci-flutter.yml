name: CI Flutter

on:
  push:
    branches: [main]
    paths:
      - "apps/flutter/**"
      - ".github/workflows/ci-flutter.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/flutter/**"
      - ".github/workflows/ci-flutter.yml"
  workflow_dispatch:

jobs:
  analyze:
    # github-hosted ubuntu-latest fails instantly in this org;
    # self-hosted runner image may lack xz for Flutter SDK tarball.
    runs-on: [self-hosted, linux, docker]
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - name: Ensure xz for Flutter SDK extract
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xz-utils
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: No raw Color hex outside palette
        run: |
          if grep -RIn --exclude=app_palette.dart 'Color(0x' lib; then
            echo "Raw Color(0x…) found outside app_palette.dart"
            exit 1
          fi
