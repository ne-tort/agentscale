name: CI Gate

# Required-style check for pull requests (GitHub Free private cannot enforce
# branch protection). Auto-merge waits for this workflow via workflow_run.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Docker Desktop runner pack (4×). Stuck run: gh api -X POST .../actions/runs/<id>/force-cancel
  cancel-in-progress: false

jobs:
  infra:
    name: infra
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PIP_CACHE_DIR: /cache/pip
      POETRY_CLI: /cache/poetry-cli
      POETRY_CACHE_DIR: /cache/poetry
      POETRY_VIRTUALENVS_PATH: /cache/poetry-venvs
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Ensure kustomize on PATH
        run: |
          set -euo pipefail
          ver="v5.4.3"
          echo "==> looking for kustomize"
          if command -v kustomize >/dev/null 2>&1; then
            kustomize version
            exit 0
          fi
          # Persistent runner cache (same volume as poetry) — avoids GitHub release
          # CDN timeouts that flake the gate when PATH has no kustomize.
          cache="/cache/kustomize/${ver}"
          if [ -x "${cache}/kustomize" ]; then
            echo "==> kustomize cache HIT: ${cache}"
            echo "${cache}" >> "${GITHUB_PATH}"
            "${cache}/kustomize" version
            exit 0
          fi
          mkdir -p "${cache}"
          tgz="${{ runner.temp }}/kustomize.tgz"
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${ver}/kustomize_${ver}_linux_amd64.tar.gz"
          echo "==> downloading kustomize ${ver} (retries)"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "==> attempt ${attempt}/5"
            if curl -fsSL --connect-timeout 30 --max-time 180 \
              --retry 3 --retry-delay 5 --retry-all-errors \
              "${url}" -o "${tgz}"; then
              ok=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::failed to download kustomize ${ver} after retries"
            exit 1
          fi
          tar xz -C "${cache}" -f "${tgz}"
          echo "${cache}" >> "${GITHUB_PATH}"
          "${cache}/kustomize" version

      - name: Poetry (persistent /cache)
        run: |
          set -euo pipefail
          echo "==> python $(python3 --version)"
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          # CLI lives in a dedicated venv on the shared volume (system pip breaks under 3.12).
          POETRY_CLI="${POETRY_CLI:-/cache/poetry-cli}"
          mkdir -p /cache/pip /cache/poetry /cache/poetry-venvs
          echo "${POETRY_CLI}/bin" >> "${GITHUB_PATH}"
          export PATH="${POETRY_CLI}/bin:${PATH}"
          if [ -x "${POETRY_CLI}/bin/poetry" ]; then
            echo "==> poetry cache HIT: ${POETRY_CLI}/bin/poetry"
            poetry --version
          else
            echo "==> poetry cache MISS — bootstrap venv at ${POETRY_CLI}"
            rm -rf "${POETRY_CLI}"
            python3 -m venv "${POETRY_CLI}"
            "${POETRY_CLI}/bin/pip" install -U pip poetry
            poetry --version
          fi

      - name: Validate (kustomize, pins, no legacy deploy paths)
        working-directory: infra/ops
        run: |
          set -euo pipefail
          export PATH="${POETRY_CLI:-/cache/poetry-cli}/bin:${PATH}"
          echo "==> which kustomize: $(command -v kustomize)"
          echo "==> which poetry: $(command -v poetry)"
          echo "==> poetry install (venvs at ${POETRY_VIRTUALENVS_PATH})"
          poetry install --no-interaction
          echo "==> prodavan-ops unit tests"
          poetry run pytest -q
          echo "==> prodavan-ops validate"
          poetry run prodavan-ops validate
          echo "==> infra OK"
  api:
    name: api
    uses: ./.github/workflows/ci-api.yml

  flutter:
    name: flutter
    uses: ./.github/workflows/ci-flutter.yml

  schemas:
    name: schemas
    uses: ./.github/workflows/ci-schemas.yml

  gate:
    name: gate
    needs: [infra, api, flutter, schemas]
    if: always()
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 5
    steps:
      - name: All required jobs green
        run: |
          python3 - <<'PY'
          import os, sys
          checks = {
              "infra": os.environ["INFRA"],
              "api": os.environ["API"],
              "flutter": os.environ["FLUTTER"],
              "schemas": os.environ["SCHEMAS"],
          }
          print(checks)
          bad = [k for k, v in checks.items() if v != "success"]
          if bad:
              sys.exit(f"CI Gate failed: {bad}")
          print("CI Gate OK")
          PY
        env:
          INFRA: ${{ needs.infra.result }}
          API: ${{ needs.api.result }}
          FLUTTER: ${{ needs.flutter.result }}
          SCHEMAS: ${{ needs.schemas.result }}
