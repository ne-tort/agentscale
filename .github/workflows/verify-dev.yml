name: Verify Dev

# After CI Images: rollout first-party Deployments (:latest + Always), wait Argo, smoke HTTP.
# Does not mint secrets; ghcr-pull must already exist (TF bootstrap / SealedSecret).

on:
  workflow_run:
    workflows: ["CI Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "infra/k3s/**"
      - "infra/argocd/**"
      - "infra/ops/**"
      - ".github/workflows/verify-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-dev
  cancel-in-progress: false

env:
  HTTP_PORT: "8088"
  SMOKE_ADDR: "127.0.0.1"
  PRODAVAN_CI_HOST: host.docker.internal

jobs:
  wait-smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve kubeconfig (host, not checkout)
        run: |
          set -euo pipefail
          if [ -n "${KUBECONFIG:-}" ] && [ -f "${KUBECONFIG}" ]; then
            echo "using existing KUBECONFIG=${KUBECONFIG}"
            exit 0
          fi
          for c in "${HOME}/.kube/prodavan-dev.yaml" "${HOME}/.kube/config"; do
            if [ -f "$c" ]; then
              echo "KUBECONFIG=$c" >> "${GITHUB_ENV}"
              echo "using $c"
              exit 0
            fi
          done
          echo "No kubeconfig: set KUBECONFIG on the runner or place ~/.kube/prodavan-dev.yaml" >&2
          exit 1

      - name: Python venv + Poetry
        run: |
          python3 -m venv "${{ runner.temp }}/ops-venv"
          echo "${{ runner.temp }}/ops-venv/bin" >> "${GITHUB_PATH}"
          "${{ runner.temp }}/ops-venv/bin/python" -m pip install -U pip poetry

      - name: Install prodavan-ops
        working-directory: infra/ops
        run: poetry install --no-interaction

      - name: Prepare Docker kubeconfig
        working-directory: infra/ops
        run: |
          set -euo pipefail
          path="$(poetry run python -c "from prodavan_ops.k8s import resolve_kubeconfig_path; print(resolve_kubeconfig_path())")"
          echo "KUBECONFIG=${path}" >> "${GITHUB_ENV}"
          kubectl get ns prodavan --request-timeout=10s

      - name: Rollout first-party (after CI Images)
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        working-directory: infra/ops
        run: poetry run prodavan-ops rollout --timeout 900

      - name: Wait Argo Application
        timeout-minutes: 20
        working-directory: infra/ops
        run: poetry run prodavan-ops wait --app prodavan-dev --timeout 900

      - name: Smoke HTTP
        timeout-minutes: 2
        working-directory: infra/ops
        run: |
          set -euo pipefail
          # Docker Desktop runners: host.docker.internal + Windows portproxy → WSL Traefik
          ADDR="${PRODAVAN_CI_HOST:-${SMOKE_ADDR:-127.0.0.1}}"
          echo "smoke addr=$ADDR port=${HTTP_PORT}"
          poetry run prodavan-ops smoke --addr "$ADDR" --port "${HTTP_PORT}"
