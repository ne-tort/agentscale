[pytest]
# Isolated invocation from apps/api (explicit path + confcutdir are REQUIRED):
#   python -m pytest -c tests/e2e/k8s/plugin_acceptance/pytest.ini --confcutdir=tests/e2e/k8s/plugin_acceptance tests/e2e/k8s/plugin_acceptance -v
# testpaths below is only a fallback for running inside this directory without
# arguments: it is shlex-split, so it must stay a bare "." (never ["."], which
# would become a literal bracketed path). With -c from apps/api and no path
# argument, testpaths is ignored and collection would escape to all of apps/api,
# which is exactly why the documented command always passes the explicit path.
# tests/e2e/k8s has NO conftest.py, so this exact confcutdir keeps only this
# package's fixtures/gates and excludes tests/conftest.py and
# tests/e2e/conftest.py, whose import runs PostgreSQL/live-API/kubectl probes.
# Never use --noconftest: it would disable this package's gates too.
asyncio_mode = auto
testpaths = .
markers =
  plugin_acceptance: opt-in real-K8s acceptance on a disposable non-prod cluster
addopts = "-ra"
