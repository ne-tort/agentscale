# nginx for the TypeScript web app.
#
# Static files only: the ingress splits `/api` and `/health` to agentscale-api
# before traffic reaches this Service, so the container has no upstream to talk
# to. That is deliberate — `proxy_pass http://agentscale-api:8000` resolves its
# upstream at startup, so nginx refuses to boot whenever that name is absent
# (docker run, a local smoke test, or the API Service not created yet). Keeping
# the image self-contained means it starts anywhere and cannot CrashLoop on a
# DNS miss.
#
# Vite emits content-hashed files under /assets; every other path is a client
# route the React router owns, so unknown paths fall through to index.html —
# without that, a reload on /projects/abc returns 404 instead of the app.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The entry document names the hashed bundle, so it must never be cached:
    # a stale index.html pins the browser to a bundle that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Content-hashed bundles — immutable by construction.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        try_files $uri =404;
    }

    # Readiness/liveness probe. Registered before the SPA fallback so a probe
    # never has to render the app.
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 'ok';
    }

    # Client-side routes: serve the app shell and let the router resolve the path.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
