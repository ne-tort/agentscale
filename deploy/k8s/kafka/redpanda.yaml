# Sketch — Redpanda (Kafka API) for C-EVENT-BUS (P0).
# Single-node dev-container mode. API env:
#   KAFKA_ENABLED=true
#   KAFKA_BOOTSTRAP_SERVERS=prodavan-kafka:9092
#   KAFKA_CONSUMER_ENABLED=true
#   KAFKA_CONSUMER_MODE=kick   # or dispatch
---
apiVersion: v1
kind: Service
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app.kubernetes.io/name: prodavan-kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-kafka
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: kafka
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          args:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://prodavan-kafka:9092
            - --rpc-addr
            - 0.0.0.0:33145
            - --advertise-rpc-addr
            - prodavan-kafka:33145
            - --mode
            - dev-container
            - --smp
            - "1"
            - --default-log-level=warn
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
