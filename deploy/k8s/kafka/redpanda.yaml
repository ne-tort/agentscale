# Sketch — Redpanda (Kafka API) for C-EVENT-BUS (P0).
# Single-node dev-container mode. API env:
#   KAFKA_ENABLED=true
#   KAFKA_BOOTSTRAP_SERVERS=prodavan-kafka:9092
#   KAFKA_CONSUMER_ENABLED=true
#   KAFKA_CONSUMER_MODE=kick   # or dispatch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prodavan-kafka-data
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app.kubernetes.io/name: prodavan-kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-kafka
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: kafka
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          args:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://prodavan-kafka:9092
            - --rpc-addr
            - 0.0.0.0:33145
            - --advertise-rpc-addr
            - prodavan-kafka:33145
            - --mode
            - dev-container
            - --smp
            - "1"
            - --default-log-level=warn
          ports:
            - containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prodavan-kafka-data
---
# Parity with API KafkaManager._ensure_topics / MinIO init Job
apiVersion: batch/v1
kind: Job
metadata:
  name: prodavan-kafka-init
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-kafka-init
        app.kubernetes.io/part-of: prodavan
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until rpk cluster info -X brokers=prodavan-kafka:9092; do
                i=$((i+1))
                if [ "$i" -gt 30 ]; then exit 1; fi
                sleep 1
              done
              rpk topic create prodavan.platform.events -X brokers=prodavan-kafka:9092 || true
              rpk topic create prodavan.project.triggers -X brokers=prodavan-kafka:9092 || true
