# Sketch — keep in sync with infra/k3s/base/platform/kafka.yaml
apiVersion: v1
kind: Service
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/name: prodavan-kafka
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  clusterIP: None
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app.kubernetes.io/name: prodavan-kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prodavan-kafka
  labels:
    app.kubernetes.io/name: prodavan-kafka
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  serviceName: prodavan-kafka
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-kafka
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: kafka
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          args:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://prodavan-kafka-0.prodavan-kafka.prodavan.svc.cluster.local:9092
            - --rpc-addr
            - 0.0.0.0:33145
            - --advertise-rpc-addr
            - prodavan-kafka-0.prodavan-kafka.prodavan.svc.cluster.local:33145
            - --smp
            - "1"
            - --memory
            - 1G
            - --overprovisioned
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --check=false
            - --default-log-level=warn
          ports:
            - name: kafka
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
