# Sketch — Redis for C-CACHE / Celery broker (P0).
# Align env with API: REDIS_URL=redis://prodavan-redis:6379/0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prodavan-redis-data
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prodavan-redis
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: prodavan-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-redis
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-redis
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prodavan-redis-data
