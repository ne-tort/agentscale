# Example CronJobs for platform ops hooks (L07/L09).
# Requires Secret `prodavan-ops-token` with key `token` (platform.admin bearer).
# Set PRODAVAN_API_BASE to the in-cluster API URL (e.g. http://prodavan-api:8000).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prodavan-ops-cron-scripts
  labels:
    app.kubernetes.io/part-of: prodavan
data:
  idle-pause-sweep.sh: |
    #!/bin/sh
    set -eu
    curl -fsS -X POST "${PRODAVAN_API_BASE}/api/v1/admin/triggers/idle-pause/sweep" \
      -H "Authorization: Bearer ${PRODAVAN_OPS_TOKEN}" \
      -H "Content-Type: application/json"
  trigger-drain.sh: |
    #!/bin/sh
    set -eu
    curl -fsS -X POST "${PRODAVAN_API_BASE}/api/v1/admin/triggers/drain" \
      -H "Authorization: Bearer ${PRODAVAN_OPS_TOKEN}" \
      -H "Content-Type: application/json"
  gc-orphan-schemas.sh: |
    #!/bin/sh
    set -eu
    # dry_run=false drops orphan cab_inst_* schemas; prefer enqueue=true when Celery is up.
    curl -fsS -X POST "${PRODAVAN_API_BASE}/api/v1/admin/cabinets/gc-orphan-schemas?dry_run=false&limit=50" \
      -H "Authorization: Bearer ${PRODAVAN_OPS_TOKEN}" \
      -H "Content-Type: application/json"
  gc-orphan-blobs.sh: |
    #!/bin/sh
    set -eu
    curl -fsS -X POST "${PRODAVAN_API_BASE}/api/v1/admin/object-store/gc-orphan-blobs?dry_run=false&limit=50" \
      -H "Authorization: Bearer ${PRODAVAN_OPS_TOKEN}" \
      -H "Content-Type: application/json"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prodavan-idle-pause-sweep
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: idle-pause
spec:
  # Hourly — policy default is off per company; no-op when idle_pause_after_hours unset.
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prodavan-ops-cron
            app.kubernetes.io/part-of: prodavan
            app.kubernetes.io/component: idle-pause
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "/scripts/idle-pause-sweep.sh"]
              env:
                - name: PRODAVAN_API_BASE
                  value: "http://prodavan-api:8000"
                - name: PRODAVAN_OPS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: prodavan-ops-token
                      key: token
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: prodavan-ops-cron-scripts
                defaultMode: 0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prodavan-trigger-drain
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: triggers
spec:
  # Every 5 minutes — prefer this over TRIGGER_WORKER_ENABLED in multi-replica.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prodavan-ops-cron
            app.kubernetes.io/part-of: prodavan
            app.kubernetes.io/component: triggers
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "/scripts/trigger-drain.sh"]
              env:
                - name: PRODAVAN_API_BASE
                  value: "http://prodavan-api:8000"
                - name: PRODAVAN_OPS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: prodavan-ops-token
                      key: token
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: prodavan-ops-cron-scripts
                defaultMode: 0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prodavan-gc-orphan-schemas
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: schema-gc
spec:
  # Daily — cleans cab_inst_* schemas left after partial hard-delete / provision failures.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prodavan-ops-cron
            app.kubernetes.io/part-of: prodavan
            app.kubernetes.io/component: schema-gc
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "/scripts/gc-orphan-schemas.sh"]
              env:
                - name: PRODAVAN_API_BASE
                  value: "http://prodavan-api:8000"
                - name: PRODAVAN_OPS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: prodavan-ops-token
                      key: token
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: prodavan-ops-cron-scripts
                defaultMode: 0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prodavan-gc-orphan-blobs
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: blob-gc
spec:
  # Weekly — wipe orphan cabinet_packages/ and projects/ prefixes without live rows.
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prodavan-ops-cron
            app.kubernetes.io/part-of: prodavan
            app.kubernetes.io/component: blob-gc
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "/scripts/gc-orphan-blobs.sh"]
              env:
                - name: PRODAVAN_API_BASE
                  value: "http://prodavan-api:8000"
                - name: PRODAVAN_OPS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: prodavan-ops-token
                      key: token
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: prodavan-ops-cron-scripts
                defaultMode: 0755
