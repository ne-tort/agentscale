# Sketch — API Deployment labels for NetworkPolicy (P0).
# Complements existing compose/Helm API deploy; use these labels so
# brokers-allow / egress policies match. Image/env are placeholders.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodavan-api
  labels:
    app.kubernetes.io/name: prodavan-api
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prodavan-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prodavan-api
        app.kubernetes.io/part-of: prodavan
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: prodavan-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://prodavan-redis:6379/0
            - name: CELERY_ENABLED
              value: "true"
            - name: CELERY_BROKER_URL
              value: redis://prodavan-redis:6379/0
            - name: OBJECT_STORE_BACKEND
              value: s3
            - name: S3_ENDPOINT_URL
              value: http://prodavan-minio:9000
            - name: S3_BUCKET
              value: prodavan
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: prodavan-kafka:9092
            - name: INGRESS_RATE_LIMIT_PER_MINUTE
              value: "120"
            - name: REDIS_REQUIRED
              value: "true"
            - name: OBJECT_STORE_REQUIRED
              value: "true"
            - name: CELERY_REQUIRED
              value: "true"
            - name: KAFKA_REQUIRED
              value: "true"
          envFrom:
            - secretRef:
                name: prodavan-api
                optional: true
            - configMapRef:
                name: prodavan-api
                optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: prodavan-api
  labels:
    app.kubernetes.io/name: prodavan-api
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: prodavan-api
  ports:
    - name: http
      port: 8000
      targetPort: http
