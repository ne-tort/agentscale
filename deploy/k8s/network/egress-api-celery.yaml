# Sketch — egress for API/Celery pods (P0).
# Restricts outbound traffic to DNS + in-namespace brokers (Redis/MinIO/Kafka).
# Postgres / Keycloak / LLM egress: see egress-postgres-keycloak.yaml (CIDR placeholders).
# Apply after brokers-allow.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-api-celery-egress
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - prodavan-api
          - prodavan-celery-worker
  policyTypes:
    - Egress
  egress:
    # Cluster DNS (CoreDNS / kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Brokers + other prodavan pods in the same namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: prodavan
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 8000
