# Sketch — namespace default-deny (P0).
# Apply AFTER broker allow policies so prodavan pods keep Redis/MinIO/Kafka access.
# Does not include egress rules for DNS/API→Postgres — add before production use.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-default-deny-ingress
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: network
spec:
  podSelector: {}
  policyTypes:
    - Ingress
