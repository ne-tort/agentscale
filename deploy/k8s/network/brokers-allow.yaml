# Sketch — NetworkPolicy: allow API/Celery → brokers (P0).
# Requires a CNI that enforces NetworkPolicy (Calico/Cilium). Default-deny is NOT applied
# cluster-wide here — only ingress allowlists on broker pods.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-redis-allow
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodavan-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: prodavan
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-minio-allow
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodavan-minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: prodavan
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prodavan-kafka-allow
  labels:
    app.kubernetes.io/part-of: prodavan
    app.kubernetes.io/component: kafka
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodavan-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: prodavan
      ports:
        - protocol: TCP
          port: 9092
